<style id="desk-shared">
/* Shared design language for the writing desk: one palette, three typefaces, one top bar. */
:root{
  --dk-bg:#fdfdfc; --dk-paper:#ffffff; --dk-ink:#16171a; --dk-muted:#5b5e67; --dk-rule:#d8dbe1;
  --dk-soft:#f3f4f7; --dk-wash:#e8edf6; --dk-accent:#1f4f8a; --dk-accent-soft:#dde5f6; --dk-on-accent:#ffffff; --dk-mark:#f6eaa9;
  --dk-display:"Libre Caslon Display","Bodoni 72",Didot,Georgia,serif;
  --dk-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --dk-ui:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --dk-bg:#121316; --dk-paper:#1a1b20; --dk-ink:#ebeae5; --dk-muted:#a3a6ae; --dk-rule:#34363c;
  --dk-soft:#1c1e23; --dk-wash:#1b2331; --dk-accent:#8db2e8; --dk-accent-soft:#25314f; --dk-on-accent:#0f1320; --dk-mark:#4b4321; color-scheme:dark}}
:root[data-theme="dark"]{
  --dk-bg:#121316; --dk-paper:#1a1b20; --dk-ink:#ebeae5; --dk-muted:#a3a6ae; --dk-rule:#34363c;
  --dk-soft:#1c1e23; --dk-wash:#1b2331; --dk-accent:#8db2e8; --dk-accent-soft:#25314f; --dk-on-accent:#0f1320; --dk-mark:#4b4321; color-scheme:dark}
.dk-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;padding:14px 0 12px;border-bottom:1px solid var(--dk-rule)}
.dk-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font:600 12px/1.3 var(--dk-ui);letter-spacing:.08em;text-transform:uppercase}
.dk-crumbs a{color:var(--dk-ink);text-decoration:none;border-bottom:1px solid transparent}
.dk-crumbs a:hover{color:var(--dk-accent);border-color:var(--dk-accent)}
.dk-crumbs .dk-sep{color:var(--dk-muted)}
.dk-prefs{display:flex;gap:8px;flex-wrap:wrap}
.dk-seg{display:inline-flex;border:1px solid var(--dk-rule);border-radius:2px;overflow:hidden}
.dk-seg button{background:transparent;border:0;margin:0;padding:5px 10px;cursor:pointer;font:600 11px/1.4 var(--dk-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--dk-muted)}
.dk-seg button+button{border-left:1px solid var(--dk-rule)}
.dk-seg button:hover{color:var(--dk-ink)}
.dk-seg button[aria-pressed="true"]{background:var(--dk-ink);color:var(--dk-bg)}
.dk-seg button:focus-visible,.dk-crumbs a:focus-visible{outline:2px solid var(--dk-accent);outline-offset:2px}
</style>
<script>
/* Shared preferences: language (Spanish by default) and theme (light by default), remembered across all pages of the desk. */
(function(){
  var R=document.documentElement;
  var DEF={'desk-lang':'es','desk-theme':'light'};
  function get(k){try{return localStorage.getItem(k)||DEF[k]}catch(e){return DEF[k]}}
  function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function sys(){return (navigator.language||'').toLowerCase().indexOf('es')===0?'es':'en'}
  var T={en:{auto:'Auto',light:'Light',dark:'Dark',home:'Writing desk',lang:'Language',theme:'Theme'},
         es:{auto:'Auto',light:'Claro',dark:'Oscuro',home:'Mesa de escritura',lang:'Idioma',theme:'Tema'}};
  var D=window.DESK={lang:get('desk-lang'),theme:get('desk-theme'),onLang:null,
    eff:function(){return this.lang==='auto'?sys():this.lang}};
  function applyTheme(){if(D.theme==='light'||D.theme==='dark')R.setAttribute('data-theme',D.theme);else R.removeAttribute('data-theme')}
  function paint(){
    var t=T[D.eff()];
    document.querySelectorAll('[data-dk-lang]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-dk-lang')===D.lang)});
    document.querySelectorAll('[data-dk-theme]').forEach(function(b){var v=b.getAttribute('data-dk-theme');b.setAttribute('aria-pressed',v===D.theme);b.textContent=t[v]});
    document.querySelectorAll('[data-dk-t]').forEach(function(e){e.textContent=t[e.getAttribute('data-dk-t')]});
    document.querySelectorAll('[data-dk-aria]').forEach(function(e){e.setAttribute('aria-label',t[e.getAttribute('data-dk-aria')])});
  }
  function fire(){paint();if(D.onLang)D.onLang(D.eff())}
  D.setLang=function(l){D.lang=l;put('desk-lang',l);fire()};
  D.setTheme=function(t){D.theme=t;put('desk-theme',t);applyTheme();paint()};
  D.paint=paint;
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-dk-lang],[data-dk-theme]');if(!b)return;
    if(b.hasAttribute('data-dk-lang'))D.setLang(b.getAttribute('data-dk-lang'));else D.setTheme(b.getAttribute('data-dk-theme'));
  });
  window.addEventListener('languagechange',function(){if(D.lang==='auto')fire()});
  window.addEventListener('storage',function(e){
    if(e.key==='desk-theme'){D.theme=e.newValue||'light';applyTheme();paint()}
    if(e.key==='desk-lang'){D.lang=e.newValue||'es';fire()}
  });
  applyTheme();
  R.lang=D.eff();
})();
</script>
<style>
/* Layout: broadsheet masthead, generator desk on top, atlas grid of diagrams below; detail opens as a plate */
:root{
  --bg:var(--dk-bg); --ink:var(--dk-ink); --muted:var(--dk-muted); --rule:var(--dk-rule);
  --wash:var(--dk-wash); --wash2:var(--dk-soft); --accent:var(--dk-accent); --on-accent:var(--dk-on-accent);
  --display:var(--dk-display); --body:var(--dk-body); --ui:var(--dk-ui);
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* masthead */
.mast{padding-block:18px 18px;border-bottom:3px double var(--ink)}
.mast-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:500 12px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:10px}
.mast h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,8vw,92px);line-height:1;text-align:center;margin:18px 0 8px;letter-spacing:-.01em}
.mast p{text-align:center;margin:0 auto;max-width:60ch;color:var(--muted);font-style:italic}

/* section heads */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:8px;margin:40px 0 20px}
.kicker{font:600 12px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.sec-head h2{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.sec-head .note{font:400 14px var(--ui);color:var(--muted);max-width:46ch}

/* generator */
.desk{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px}
@media (max-width:860px){.desk{grid-template-columns:1fr}}
.controls{display:flex;flex-direction:column;gap:14px;min-width:0}
.spin-row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:600 14px var(--ui);letter-spacing:.02em;border:1px solid var(--ink);background:transparent;padding:10px 16px;cursor:pointer;border-radius:2px}
.btn:hover{background:var(--wash2)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.field{display:flex;flex-direction:column;gap:4px;font:500 12px var(--ui);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
select{font:400 16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--rule);padding:8px 10px;border-radius:2px;width:100%}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--rule)}
@media (max-width:420px){.slots{grid-template-columns:1fr}}
.slot{display:flex;align-items:stretch;border-bottom:1px solid var(--rule);min-width:0}
.slot:nth-child(odd){border-right:1px solid var(--rule)}
@media (max-width:420px){.slot:nth-child(odd){border-right:0}}
.slot-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:10px 10px 10px 0;cursor:pointer}
.slot:nth-child(even) .slot-main{padding-left:12px}
.slot-main:hover .sv{color:var(--accent)}
.sl{display:block;font:600 11px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sv{display:block;font-size:15.5px;line-height:1.35;margin-top:2px}
.lock{flex:none;width:34px;background:none;border:0;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.lock svg{width:15px;height:15px}
.lock[aria-pressed="true"]{color:var(--accent)}
.slot.locked .sv{font-weight:600}
.hint{font:400 13px var(--ui);color:var(--muted);margin:0}

.result{border:1px solid var(--ink);padding:22px 24px;min-width:0;background:var(--bg)}
.result .kicker{display:block}
.result h3{font-family:var(--display);font-weight:400;font-size:clamp(24px,3vw,32px);line-height:1.15;margin:6px 0 12px;text-wrap:balance}
.result p{margin:0 0 12px;max-width:65ch}
.result b{font-weight:600}
.constraint{font:500 14px var(--ui);border-left:3px solid var(--accent);padding:6px 0 6px 12px;color:var(--ink)}
.result-fig{background:var(--wash2);margin:16px 0;padding:8px}
.result-fig svg{display:block;width:100%;max-height:240px}
.result h4{font:600 12px var(--ui);letter-spacing:.1em;text-transform:uppercase;margin:16px 0 8px;color:var(--muted)}
.res-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.copied{font:500 13px var(--ui);color:var(--accent)}

/* beats list */
.beats{list-style:none;counter-reset:b;margin:0;padding:0;display:grid;gap:10px}
.beats li{counter-increment:b;display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.beats li::before{content:counter(b);width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:600 11px/22px var(--ui);text-align:center;margin-top:2px}
.beats b{font:600 15px var(--ui);display:block}
.beats span{font-size:15.5px;color:var(--ink)}
.beats.cols{grid-template-columns:1fr 1fr;column-gap:24px}
@media (max-width:640px){.beats.cols{grid-template-columns:1fr}}

/* atlas */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{font:500 13px var(--ui);border:1px solid var(--rule);background:transparent;padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px 24px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:none;border:0;border-top:1px solid var(--ink);padding:12px 0 0;cursor:pointer}
.thumb{background:var(--wash2);padding:10px;transition:background .2s}
.card:hover .thumb{background:var(--wash)}
.thumb svg{display:block;width:100%;aspect-ratio:400/250;height:auto}
.thumb .lbl,.thumb .dn{display:none}
.card .kicker{font-size:11px;margin-top:4px}
.card h3{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15;margin:0}
.card p{margin:0;font-size:15px;color:var(--muted);line-height:1.45}

/* svg vocabulary */
.ln{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ln.acc{stroke:var(--accent)} .ln.thin{stroke-width:1.5} .ln.dash{stroke-dasharray:6 5}
.guide{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.axis{fill:none;stroke:var(--muted);stroke-width:1}
.band{fill:var(--wash)} .band2{fill:var(--wash2)}
.shape{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.solid{fill:var(--ink)}
.dot circle{fill:var(--accent)}
.dn{fill:var(--on-accent);font:700 10px var(--ui)}
.lbl{fill:var(--ink);font:500 11.5px var(--ui)}
.lbl.m{fill:var(--muted);font-weight:400}
.lbl.b{font-weight:700}
.lbl.sm{font-size:10.5px}
.ahp{fill:var(--ink)}
.clue{fill:var(--accent)}

/* dialog */
dialog{border:0;padding:0;background:var(--bg);color:var(--ink);width:min(860px, calc(100% - 24px));max-height:calc(100% - 24px);border-radius:2px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,14,20,.55)}
.plate{padding:26px 28px 28px}
.plate-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:3px double var(--ink);padding-bottom:12px}
.plate h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,44px);line-height:1.05;margin:4px 0 4px;text-wrap:balance}
.origin{font:400 14px var(--ui);color:var(--muted)}
.x{background:none;border:1px solid var(--rule);width:36px;height:36px;cursor:pointer;flex:none;font:400 20px/1 var(--ui)}
.plate figure{margin:18px 0;background:var(--wash2);padding:12px}
.plate figure svg{display:block;width:100%;height:auto;max-height:380px}
.lede{font-size:19px;line-height:1.5;margin:0 0 18px;max-width:65ch}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:18px;border-top:1px solid var(--rule);padding-top:14px;margin-top:20px}
@media (max-width:560px){.meta{grid-template-columns:1fr}.plate{padding:20px 18px}}
.meta h4{font:600 12px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.meta p{margin:0;font-size:15.5px}
.plate-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}
.switches{display:flex;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 10px;cursor:pointer;font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mast-top{align-items:center}
footer{margin-top:48px;border-top:1px solid var(--rule);padding-top:12px;font:400 13px var(--ui);color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ---------- svg helpers ---------- */
const r1 = n => Math.round(n*10)/10;
function smooth(p){
  let d=`M${p[0][0]},${p[0][1]}`;
  for(let i=0;i<p.length-1;i++){
    const p0=p[i-1]||p[i],a=p[i],b=p[i+1],p3=p[i+2]||b;
    d+=` C${r1(a[0]+(b[0]-p0[0])/6)},${r1(a[1]+(b[1]-p0[1])/6)} ${r1(b[0]-(p3[0]-a[0])/6)},${r1(b[1]-(p3[1]-a[1])/6)} ${b[0]},${b[1]}`;
  }
  return d;
}
const T=(x,y,s,a='middle',c='')=>`<text class="lbl ${c}" x="${r1(x)}" y="${r1(y)}" text-anchor="${a}">${tr(s)}</text>`;
const D=(x,y,n)=>`<g class="dot"><circle cx="${x}" cy="${y}" r="9"/><text class="dn" x="${x}" y="${y+3.6}" text-anchor="middle">${n}</text></g>`;
const P=(d,c='ln',m='')=>`<path class="${c}" d="${d}" ${m?'marker-end="url(#ah)"':''}/>`;
const L=(x1,y1,x2,y2,c='guide')=>`<line class="${c}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
const R=(x,y,w,h,c='band')=>`<rect class="${c}" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
const svg=(inner,h=250)=>`<svg viewBox="0 0 400 ${h}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker></defs>${inner}</svg>`;

function koch(cx,cy,R,it){
  let p=[0,1,2].map(k=>{const a=(-90+120*k)*Math.PI/180;return[cx+R*Math.cos(a),cy+R*Math.sin(a)]});
  for(let n=0;n<it;n++){const q=[];for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];const dx=(b[0]-a[0])/3,dy=(b[1]-a[1])/3;const p1=[a[0]+dx,a[1]+dy],p3=[a[0]+2*dx,a[1]+2*dy];const g=-Math.PI/3;const p2=[p1[0]+dx*Math.cos(g)-dy*Math.sin(g),p1[1]+dx*Math.sin(g)+dy*Math.cos(g)];q.push(a,p1,p2,p3)}p=q}
  return 'M'+p.map(v=>r1(v[0])+','+r1(v[1])).join('L')+'Z';
}
function mini(x0,y0,w,h,ys,title,c='ln'){
  const top=y0+22,bot=y0+h-8,left=x0+10,right=x0+w-6;
  const pts=ys.map((v,i)=>[r1(left+6+(right-left-10)*i/(ys.length-1)),r1(bot-(bot-top)*v)]);
  return L(left,top,left,bot,'axis')+L(left,(top+bot)/2,right,(top+bot)/2,'guide')+P(smooth(pts),c+' thin','m')+T(x0+w/2,y0+12,title,'middle','sm b');
}
function circleLabels(cx,cy,r,names,start,step,skip=[]){
  let s='';
  names.forEach((n,i)=>{
    if(skip.includes(i))return;
    const a=(start+step*i)*Math.PI/180,c=Math.cos(a),sn=Math.sin(a);
    const x=r1(cx+r*c),y=r1(cy+r*sn);
    let lx=cx+(r+16)*c,ly=cy+(r+16)*sn+4,an=c>0.3?'start':c<-0.3?'end':'middle';
    if(an==='middle')ly+=sn<0?-4:8;
    s+=D(x,y,i+1)+T(lx,ly,n,an);
  });
  return s;
}

/* ---------- diagrams ---------- */
const DIAG={
pyramid:()=>svg(
  L(20,212,380,212,'axis')+P('M20,200 L90,200 L200,40 L310,200 L380,200')+
  D(50,200,1)+D(90,200,2)+D(145,120,3)+D(200,40,4)+D(255,120,5)+D(345,200,6)+

const FAM={arc:'Arcs & shapes',act:'Act structures',beat:'Beat sheets & methods',cycle:'Cycles',form:'Unusual forms'};
const S=[
{id:'pyramid',fam:'arc',name:"Freytag's Pyramid",origin:'Gustav Freytag, 1863',tag:'Tension climbs to a single peak, then releases.',
 about:'Freytag drew this shape from five-act tragedy. Everything before the climax tightens the situation; everything after it pays off the consequences. It is the quickest way to check that a story builds instead of wandering.',
 beats:[['Exposition','Who, where, and what normal looks like before the trouble starts.'],['Inciting incident','The event that breaks normal and hands the protagonist a problem they cannot ignore.'],['Rising action','Complications stack up; each attempt to fix things makes them harder.'],['Climax','The point of highest tension, where the central conflict is decided.'],['Falling action','The consequences of the climax play out and loose threads are tied.'],['Resolution','A new normal, visibly different from the one at the start.']],
 best:'Short stories, tragedies, any story with one clear conflict.',ex:'Romeo and Juliet · Macbeth · most fairy tales'},
{id:'poetics',fam:'arc',name:"Aristotle's Poetics",origin:'Aristotle, c. 335 BC',tag:'One unified action that turns on reversal and recognition.',
 about:'Aristotle called plot the soul of tragedy: a single complete action with a beginning, middle and end, where nothing could be removed without damaging the whole. The strongest plots turn on a reversal of fortune and a moment of recognition, ideally at the same moment.',
 beats:[['Beginning','A situation that needs nothing before it to make sense.'],['Complication','Everything that ties the knot, up to the turning point (desis).'],['Reversal','The action produces the opposite of what was intended (peripeteia).'],['Recognition','A shift from ignorance to knowledge, often about who someone really is (anagnorisis).'],['Suffering','A painful or destructive act that the recognition makes unbearable (pathos).'],['Catharsis','The untying (lusis): pity and fear are released in the audience.']],
 best:'Tragedy, mystery, any story built around a hidden truth.',ex:'Oedipus Rex · Othello · The Sixth Sense'},
{id:'vonnegut',fam:'arc',name:"Vonnegut's Story Shapes",origin:'Kurt Vonnegut, lecture on the shapes of stories',tag:'Plot fortune against time and stories become curves.',
 about:'Vonnegut drew stories on two axes: good fortune to ill fortune, beginning to end. A handful of shapes repeat across cultures. Choose a shape first and the scenes start to suggest themselves.',
 beats:[['Man in a hole','Someone falls into trouble and climbs out, ending better off than they began.'],['Boy meets girl','Someone finds something wonderful, loses it, and wins it back for good.'],['Cinderella','A steady rise, a sudden fall at the stroke of midnight, then a rise off the chart.'],['From bad to worse','Someone starts low and only sinks. No rescue arrives.']],
 best:'Choosing the emotional ride before plotting scenes.',ex:'Jaws · Cinderella · The Metamorphosis'},
{id:'booker',fam:'arc',name:"Booker's Seven Plots",origin:'Christopher Booker, The Seven Basic Plots, 2004',tag:'Seven master premises that most stories fall into.',
 about:'Booker spent decades sorting stories and concluded that most belong to seven families, each promising the reader a particular kind of journey. Use it as a premise filter: pick a family first, then a structure to tell it with.',
 beats:[['Overcoming the Monster','A threat to the community is confronted and destroyed. Beowulf, Jaws.'],['Rags to Riches','Someone humble gains wealth or love, loses it, and earns it back. Cinderella, David Copperfield.'],['The Quest','A long journey toward a distant goal, with companions and trials. The Lord of the Rings.'],['Voyage and Return','The hero enters a strange world and comes home changed. Alice in Wonderland.'],['Comedy','Confusion keeps people apart until everything is cleared up. When Harry Met Sally.'],['Tragedy','A flaw or mistake drives the hero to destruction. Macbeth, Breaking Bad.'],['Rebirth','A character trapped in darkness is redeemed. A Christmas Carol.']],
 best:'Finding the core promise of a premise.',ex:'See each type'},
{id:'risefall',fam:'arc',name:'Rise and Fall',origin:"The anti-hero's downfall, from classical tragedy to crime drama",tag:"A climb to the top that the hero's own flaw undoes.",
 about:'The protagonist wins early and often, which is what makes the fall hurt. The midpoint is usually a success, and from there the same quality that carried them up starts pulling them down. The ending lands lower than where they began.',
 beats:[['Modest start','An ordinary, frustrated life and the hunger underneath it.'],['The climb','Risky choices pay off; the reader enjoys the rise while starting to worry.'],['Peak','The midpoint: they have what they wanted, or think they do.'],['Fatal flaw','Pride, greed or loyalty begins making the decisions.'],['No way back','They pass the point where an honest exit was still possible.'],['The fall','They end below where they began, and others pay the cost too.']],
 best:'Crime stories, cautionary tales, character studies.',ex:'Scarface · Breaking Bad · The Wolf of Wall Street'},
{id:'threeact',fam:'act',name:'Three-Act Structure',origin:'Syd Field, Screenplay, 1979',tag:'Setup, confrontation, resolution, split roughly 25 / 50 / 25.',
 about:'The default shape of commercial film. Act I sets up the world and ends when the protagonist commits to a goal. Act II is the long middle of escalating obstacles, split in half by a midpoint. Act III forces the final confrontation.',
 beats:[['Inciting incident','Something disrupts the protagonist\'s life.'],['Plot point 1','The protagonist commits; the world of Act I is left behind.'],['Midpoint','A revelation or reversal that changes the goal or raises the stakes.'],['Plot point 2','The lowest moment, or a discovery that launches the finale.'],['Climax','The final confrontation with the central problem.'],['Resolution','What the win or loss has changed.']],
 best:'Screenplays, novels with a strong external goal.',ex:'Die Hard · The Wizard of Oz · Back to the Future'},
{id:'fiveact',fam:'act',name:'Five-Act Structure',origin:"Horace, the Elizabethan stage, Freytag",tag:'Five movements with the turn at the exact centre.',
 about:'Elizabethan plays came in five acts, with the climax in Act III rather than near the end. That leaves two full acts for consequences, which suits stories about guilt, revenge and the cost of a choice.',
 beats:[['Exposition','Characters, setting and the tensions already present.'],['Rising action','The conflict takes shape and the protagonist commits.'],['Climax','The turn: a decisive action whose consequences cannot be undone.'],['Falling action','Opposing forces gather; the suspense is about how, not whether.'],['Resolution','Catastrophe in tragedy, reconciliation in comedy.']],
 best:'Plays, tragedies, stories where consequences matter more than the event.',ex:'Hamlet · Romeo and Juliet · Titanic'},
{id:'kishotenketsu',fam:'act',name:'Kishōtenketsu',origin:'Classical Chinese and Japanese composition',tag:'Four parts, no conflict required. The twist is a change of view.',
 about:'Borrowed from classical Chinese poetry, this form builds meaning through juxtaposition instead of struggle. Two parts establish and develop a situation, the third brings in something seemingly unrelated, and the fourth shows how they belong together.',
 beats:[['Ki · introduction','Present the characters and their situation.'],['Shō · development','Follow and deepen that situation without major change.'],['Ten · twist','Introduce an unexpected element or angle that seems unrelated.'],['Ketsu · reconciliation','Bring the two together so the first part reads differently.']],
 best:'Quiet literary fiction, vignettes, flash fiction, comics.',ex:'My Neighbor Totoro · four-panel yonkoma comics'},
{id:'savethecat',fam:'beat',name:'Save the Cat',origin:'Blake Snyder, 2005',tag:'Fifteen beats with page targets, built for pace.',
 about:'Snyder\'s beat sheet tells you not only what happens but roughly when. It was written for screenplays, but novelists use it to diagnose saggy middles: if the midpoint arrives late, the reader feels it.',
 beats:[['Opening image','A snapshot of the hero\'s life and problem before the story.'],['Theme stated','Someone, usually not the hero, hints at the lesson.'],['Set-up','The hero\'s world, flaws and everything that needs fixing.'],['Catalyst','The life-changing event.'],['Debate','Should I go? The hero hesitates.'],['Break into Two','The hero chooses to enter the upside-down world of Act 2.'],['B story','A new relationship that carries the theme.'],['Fun and games','The promise of the premise; the scenes a trailer would show.'],['Midpoint','A false victory or false defeat; the stakes rise.'],['Bad guys close in','Outside pressure and inner doubt tighten together.'],['All is lost','The lowest point, often with a whiff of death.'],['Dark night of the soul','The hero wallows, then finds the insight.'],['Break into Three','The A and B stories meet; the hero sees the solution.'],['Finale','The hero applies the lesson and wins, changed.'],['Final image','A mirror of the opening image that proves the change.']],
 best:'Genre novels, screenplays, fixing a slow middle.',ex:'Legally Blonde · Groundhog Day · The Hunger Games'},
{id:'sevenpoint',fam:'beat',name:'Seven-Point Structure',origin:'Dan Wells',tag:'Plan the ending first, then make the beginning its opposite.',
 about:'Wells suggests designing backwards: decide the resolution, then make the hook its mirror image. Plot turns move the character from reacting to acting, pinches apply pressure, and the midpoint is where they stop running and push back.',
 beats:[['Hook','The opposite state of the resolution: weak where they will be strong.'],['Plot turn 1','A new idea, person or event sets the story moving.'],['Pinch 1','Pressure from the antagonist forces the character to act.'],['Midpoint','The character shifts from reaction to action.'],['Pinch 2','Things go badly wrong; the plan fails or a mentor is lost.'],['Plot turn 2','The last piece falls into place; they have what they need to win.'],['Resolution','The climax and the new state, mirroring the hook.']],
 best:'Plotting a character arc against an external plot.',ex:"Harry Potter and the Philosopher's Stone · The Hunger Games"},
{id:'fichtean',fam:'beat',name:'Fichtean Curve',origin:'John Gardner, The Art of Fiction, 1983',tag:'Start in trouble and keep raising it. Backstory can wait.',
 about:'Instead of a calm exposition, the story opens in crisis and stacks one crisis on another, each worse than the last. Background arrives in fragments between them. After the climax, the ending comes fast.',
 beats:[['First crisis','Open inside a problem; skip the slow introduction.'],['Rising crises','Each crisis is partly solved, and each solution causes the next. Weave in backstory here.'],['Climax','The biggest crisis, where everything is at stake.'],['Fast ending','Show the cost and stop.']],
 best:'Thrillers, horror, survival stories, short fiction.',ex:'Jurassic Park · Misery · The Hunger Games'},
{id:'snowflake',fam:'beat',name:'The Snowflake Method',origin:'Randy Ingermanson',tag:'Grow a novel outward from one sentence.',
 about:'A planning method rather than a shape. You begin with a one-sentence summary and expand it in passes, like a fractal snowflake gaining detail. Each step is small, so you always know what to do next.',
 beats:[['One sentence','Summarise the whole story in about fifteen words.'],['One paragraph','Five sentences: setup, three disasters, ending.'],['Character summaries','For each main character: goal, conflict, epiphany.'],['One page','Expand each sentence of the paragraph into a paragraph.'],['Character synopses','Tell the story from each main character\'s point of view.'],['Long synopsis','Expand each paragraph into a page.'],['Character charts','Full histories, motivations, and how each one changes.'],['Scene list','Break the synopsis into every scene.'],['Scene notes','A short paragraph of intent for each scene.'],['First draft','Write from the scene list.']],
 best:'Planners writing a novel, anyone stuck on a big idea.',ex:'Any novel you outline before drafting'},
{id:'hero',fam:'cycle',name:"The Hero's Journey",origin:"Joseph Campbell, 1949; Christopher Vogler's twelve stages",tag:'Leave the known world, survive the ordeal, bring something home.',
 about:'Campbell found a shared pattern in myths worldwide; Vogler condensed it into twelve stages for screenwriters. The hero crosses from the ordinary world into a special one, is transformed by an ordeal, and returns with something that changes home.',
 beats:[['Ordinary world','The hero\'s normal life, with a lack they may not admit.'],['Call to adventure','A problem, message or opportunity arrives.'],['Refusal of the call','Fear or duty makes them hesitate.'],['Meeting the mentor','Someone gives advice, a tool or courage.'],['Crossing the threshold','They commit and enter the special world.'],['Tests, allies, enemies','They learn the new rules and whom to trust.'],['Approach','Preparation for the central ordeal: plans and doubts.'],['Ordeal','A life-or-death crisis; something must die, literally or not.'],['Reward','They seize the prize: an object, knowledge or reconciliation.'],['The road back','Consequences give chase; they recommit to going home.'],['Resurrection','A final test that uses everything they have learned.'],['Return with the elixir','They bring home something that changes their world.']],
 best:'Adventure, fantasy, coming-of-age stories.',ex:'Star Wars (1977) · The Hobbit · The Lion King'},
{id:'storycircle',fam:'cycle',name:'The Story Circle',origin:'Dan Harmon, adapted from Campbell (also called the plot embryo)',tag:'Eight steps: want, go, find, pay, return, change.',
 about:'Harmon stripped the hero\'s journey down to eight steps that fit a TV episode or a short story. The top half of the circle is order, the bottom half is chaos; the character goes down into it and comes back up changed.',
 beats:[['You','A character in their comfort zone.'],['Need','But they want something.'],['Go','They enter an unfamiliar situation.'],['Search','They adapt to it.'],['Find','They get what they wanted.'],['Take','They pay a heavy price for it.'],['Return','They go back to their familiar situation.'],['Change','Having changed.']],
 best:'Short stories, TV episodes, character-driven arcs.',ex:'Community · Rick and Morty · Finding Nemo'},
{id:'tragic',fam:'cycle',name:'The Tragic Circle',origin:"A negative variant of Harmon's story circle",tag:'The same journey, but the lesson is misread and the circle never closes.',
 about:'The character goes through the same steps, but at the moment of paying the price they draw the wrong conclusion. They return without the change they needed, or changed for the worse, and cannot fit back into their old world.',
 beats:[['You','A character in their comfort zone, with a flaw.'],['Need','They want something, often for the wrong reason.'],['Go','They enter an unfamiliar situation.'],['Search','They adapt, sometimes too well.'],['Find','They get what they wanted.'],['Misread lesson','They pay the price but take the wrong lesson from it.'],['Return','They try to go back.'],['Ruin','Unchanged or worse, they cannot fit back in; the circle stays open.']],
 best:'Tragedies, dark character studies, cautionary tales.',ex:'The Great Gatsby · Citizen Kane · Breaking Bad'},
{id:'mirror',fam:'form',name:'Mirror Protagonists',origin:'Dual-actor structure',tag:'Two lives shaped by the same choice, ending in opposite places.',
 about:'Two protagonists face the same pressure and respond in opposite ways. Each one comments on the other, so the theme is argued through action instead of explained. Their paths usually cross at the centre of the story.',
 beats:[['Two starts','Establish both characters, alike in one crucial way.'],['The shared choice','They meet, or face the same decision, at the midpoint.'],['Divergence','Their responses send them in opposite directions.'],['Opposite endings','One rises, one falls, and each ending explains the other.']],
 best:'Rivalry stories, thematic novels, crime and detective pairs.',ex:'The Prestige · Heat · Crime and Punishment'},
{id:'ensemble',fam:'form',name:'Ensemble Network',origin:'Altman, Tarantino, Curtis and the multi-thread novel',tag:'Several storylines brush past each other and then collide.',
 about:'Each thread has its own small arc, but the meaning comes from where they touch. Plan a first crossing near the middle, then a convergence where one event affects everyone.',
 beats:[['Separate lives','Introduce each thread with its own want and problem.'],['First crossing','The threads touch, often without the characters knowing.'],['Convergence','One event pulls every thread into the same place.'],['Aftermath','Show how each life was bent by the others.']],
 best:'Novels with a city or community as the real subject.',ex:'Pulp Fiction · Love Actually · Short Cuts'},
{id:'epistolary',fam:'form',name:'Epistolary Collage',origin:'From Richardson\'s letter novels to found-footage fiction',tag:'The story told through documents the reader has to assemble.',
 about:'Letters, diaries, clippings, emails and transcripts carry the plot. The narrator disappears, and the reader becomes the detective who joins the pieces. Tension lives in what falls between documents.',
 beats:[['Choose the documents','Pick formats that reveal different sides: private, public, official.'],['The gaps','Leave events between documents for the reader to infer.'],['Contradictions','Let two documents disagree about the same event.'],['The last document','End on a piece that changes how the others read.']],
 best:'Horror, mystery, intimate stories told through voice.',ex:'Dracula · Carrie · The Color Purple · World War Z'},
{id:'unreliable',fam:'form',name:'The Unreliable Narrator',origin:'Perspective shift',tag:'Two stories at once: the one told and the one that happened.',
 about:'The narrator lies, misunderstands or hides something, and the reader slowly notices. Every scene has to work twice: once as told, and again after the reveal, when the clues fall into place.',
 beats:[['The told story','A convincing account the reader has every reason to trust.'],['Clues','Small contradictions and odd details that point to another version.'],['The reveal','The moment the told story collapses.'],['The reread','The ending invites the reader to see every earlier scene differently.']],
 best:'Psychological thrillers, twist endings, first-person fiction.',ex:'Gone Girl · Fight Club · The Murder of Roger Ackroyd'},
{id:'parallel',fam:'form',name:'Parallel Timelines',origin:'Split narrative',tag:'Timelines cut against each other until they meet.',
 about:'Two or more periods run side by side, and each cut makes the other timeline mean more. The past explains the present, the present raises questions about the past, and the story ends where they finally connect.',
 beats:[['Open in one time','Start with a hook in the timeline that raises a question.'],['Cut away','Jump to another time that seems to answer something else.'],['Echoes','Repeat images, objects or lines across the timelines.'],['Convergence','The timelines meet and the full picture appears.']],
 best:'Family sagas, mysteries, stories about memory.',ex:'Slumdog Millionaire · Cloud Atlas · This Is Us'},
];

const FAM_ES={arc:'Arcos y formas',act:'Estructuras en actos',beat:'Hojas de beats y métodos',cycle:'Ciclos',form:'Formas inusuales'};

const ES={
pyramid:{name:'La pirámide de Freytag',origin:'Gustav Freytag, 1863',tag:'La tensión sube hasta un único pico y después se libera.',
 about:'Freytag sacó esta forma de la tragedia en cinco actos. Todo lo anterior al clímax ajusta la situación; todo lo posterior paga las consecuencias. Es la forma más rápida de comprobar que una historia crece en lugar de dar vueltas.',
 beats:[['Exposición','Quién, dónde y cómo es la normalidad antes de que empiece el problema.'],['Detonante','El hecho que rompe la normalidad y le da al protagonista un problema que no puede ignorar.'],['Acción ascendente','Las complicaciones se acumulan; cada intento de arreglar las cosas las empeora.'],['Clímax','El punto de mayor tensión, donde se decide el conflicto central.'],['Acción descendente','Se despliegan las consecuencias del clímax y se atan los cabos sueltos.'],['Resolución','Una nueva normalidad, claramente distinta de la del comienzo.']],
 best:'Cuentos, tragedias, cualquier historia con un conflicto claro.',ex:'Romeo y Julieta · Macbeth · la mayoría de los cuentos de hadas'},
poetics:{name:'La Poética de Aristóteles',origin:'Aristóteles, c. 335 a. C.',tag:'Una sola acción unificada que gira sobre la peripecia y la agnición.',
 about:'Aristóteles llamó a la trama el alma de la tragedia: una acción completa con principio, medio y fin, donde nada puede quitarse sin dañar el conjunto. Las mejores tramas giran sobre un cambio de fortuna y un momento de reconocimiento, idealmente en el mismo instante.',
 beats:[['Comienzo','Una situación que no necesita nada previo para entenderse.'],['Complicación','Todo lo que ata el nudo, hasta el punto de giro (desis).'],['Peripecia','La acción produce lo contrario de lo que se buscaba.'],['Agnición','El paso de la ignorancia al conocimiento, a menudo sobre quién es realmente alguien.'],['Sufrimiento','Un acto doloroso o destructivo que el reconocimiento vuelve insoportable (pathos).'],['Catarsis','El desenlace (lisis): el público se libera a través de la compasión y el temor.']],
 best:'Tragedia, misterio, historias construidas alrededor de una verdad oculta.',ex:'Edipo rey · Otelo · Sexto sentido'},
vonnegut:{name:'Las formas de Vonnegut',origin:'Kurt Vonnegut, charla sobre la forma de las historias',tag:'Si graficás la fortuna en el tiempo, las historias se vuelven curvas.',
 about:'Vonnegut dibujaba las historias sobre dos ejes: de la buena a la mala fortuna, del principio al final. Unas pocas formas se repiten en todas las culturas. Elegí primero la forma y las escenas empiezan a sugerirse solas.',
 beats:[['Hombre en un pozo','Alguien cae en un problema y sale, mejor que como empezó.'],['Chico conoce chica','Alguien encuentra algo maravilloso, lo pierde y lo recupera para siempre.'],['Cenicienta','Un ascenso constante, una caída a la medianoche y un ascenso que se sale del gráfico.'],['De mal en peor','Alguien empieza abajo y solo se hunde. No llega ningún rescate.']],
 best:'Elegir el recorrido emocional antes de planear escenas.',ex:'Tiburón · Cenicienta · La metamorfosis'},
booker:{name:'Las siete tramas de Booker',origin:'Christopher Booker, The Seven Basic Plots, 2004',tag:'Siete premisas maestras en las que caen casi todas las historias.',
 about:'Booker pasó décadas clasificando historias y concluyó que la mayoría pertenece a siete familias, y cada una le promete al lector un tipo de viaje. Usalo como filtro de premisas: elegí primero la familia y después una estructura para contarla.',
 beats:[['Vencer al monstruo','Una amenaza para la comunidad es enfrentada y destruida. Beowulf, Tiburón.'],['De la pobreza a la riqueza','Alguien humilde gana fortuna o amor, lo pierde y lo vuelve a ganar. Cenicienta, David Copperfield.'],['La búsqueda','Un largo viaje hacia una meta lejana, con compañeros y pruebas. El Señor de los Anillos.'],['Viaje y regreso','El héroe entra en un mundo extraño y vuelve cambiado. Alicia en el país de las maravillas.'],['Comedia','La confusión separa a la gente hasta que todo se aclara. Cuando Harry conoció a Sally.'],['Tragedia','Un defecto o un error lleva al héroe a la destrucción. Macbeth, Breaking Bad.'],['Renacimiento','Un personaje atrapado en la oscuridad se redime. Cuento de Navidad.']],
 best:'Encontrar la promesa central de una premisa.',ex:'Ver cada tipo'},
risefall:{name:'Ascenso y caída',origin:'La caída del antihéroe, de la tragedia clásica al drama criminal',tag:'Una escalada a la cima que deshace el propio defecto del héroe.',
 about:'El protagonista gana temprano y seguido, y eso es lo que hace doler la caída. El punto medio suele ser un éxito, y desde ahí la misma cualidad que lo hizo subir empieza a hundirlo. El final queda más abajo que el punto de partida.',
 beats:[['Comienzo modesto','Una vida común y frustrada, y el hambre que hay debajo.'],['El ascenso','Las apuestas arriesgadas salen bien; el lector disfruta la subida mientras empieza a preocuparse.'],['Cima','El punto medio: tiene lo que quería, o cree tenerlo.'],['Defecto fatal','El orgullo, la codicia o la lealtad empiezan a decidir.'],['Sin retorno','Pasa el punto en el que todavía era posible una salida honesta.'],['La caída','Termina más abajo que donde empezó, y otros también pagan el costo.']],
 best:'Historias criminales, relatos de advertencia, estudios de personaje.',ex:'Scarface · Breaking Bad · El lobo de Wall Street'},
threeact:{name:'Estructura en tres actos',origin:'Syd Field, El libro del guion, 1979',tag:'Planteo, confrontación y resolución, en proporción 25 / 50 / 25.',
 about:'La forma por defecto del cine comercial. El Acto I presenta el mundo y termina cuando el protagonista se compromete con un objetivo. El Acto II es el largo medio de obstáculos crecientes, partido por un punto medio. El Acto III fuerza la confrontación final.',
 beats:[['Detonante','Algo altera la vida del protagonista.'],['Punto de giro 1','El protagonista se compromete; el mundo del Acto I queda atrás.'],['Punto medio','Una revelación o un giro que cambia el objetivo o sube lo que está en juego.'],['Punto de giro 2','El momento más bajo, o un descubrimiento que lanza el final.'],['Clímax','La confrontación final con el problema central.'],['Resolución','Lo que cambió la victoria o la derrota.']],
 best:'Guiones, novelas con un objetivo externo fuerte.',ex:'Duro de matar · El mago de Oz · Volver al futuro'},
fiveact:{name:'Estructura en cinco actos',origin:'Horacio, el teatro isabelino, Freytag',tag:'Cinco movimientos con el giro justo en el centro.',
 about:'Las obras isabelinas tenían cinco actos, con el clímax en el Acto III y no cerca del final. Eso deja dos actos enteros para las consecuencias, ideal para historias sobre culpa, venganza y el precio de una decisión.',
 beats:[['Exposición','Los personajes, el lugar y las tensiones que ya existen.'],['Acción ascendente','El conflicto toma forma y el protagonista se compromete.'],['Clímax','El giro: una acción decisiva cuyas consecuencias no se pueden deshacer.'],['Acción descendente','Las fuerzas contrarias se reúnen; el suspenso está en el cómo, no en el si.'],['Resolución','Catástrofe en la tragedia, reconciliación en la comedia.']],
 best:'Teatro, tragedias, historias donde importan más las consecuencias que el hecho.',ex:'Hamlet · Romeo y Julieta · Titanic'},
kishotenketsu:{name:'Kishōtenketsu',origin:'Composición clásica china y japonesa',tag:'Cuatro partes, sin conflicto obligatorio. El giro es un cambio de mirada.',
 about:'Tomada de la poesía clásica china, esta forma construye sentido por yuxtaposición en lugar de lucha. Dos partes presentan y desarrollan una situación, la tercera trae algo en apariencia ajeno y la cuarta muestra cómo encajan.',
 beats:[['Ki · introducción','Presentá a los personajes y su situación.'],['Shō · desarrollo','Seguí y profundizá esa situación sin grandes cambios.'],['Ten · giro','Introducí un elemento o un ángulo inesperado que parece no tener relación.'],['Ketsu · conclusión','Uní las dos cosas para que la primera parte se lea distinto.']],
 best:'Ficción literaria tranquila, viñetas, microficción, historietas.',ex:'Mi vecino Totoro · tiras yonkoma de cuatro viñetas'},
savethecat:{name:'Save the Cat',origin:'Blake Snyder, ¡Salva al gato!, 2005',tag:'Quince beats con páginas objetivo, pensados para el ritmo.',
 about:'La hoja de beats de Snyder dice no solo qué pasa sino más o menos cuándo. Se escribió para guiones, pero los novelistas la usan para diagnosticar medios flojos: si el punto medio llega tarde, el lector lo siente.',
 beats:[['Imagen de apertura','Una instantánea de la vida y el problema del héroe antes de la historia.'],['Tema enunciado','Alguien, casi nunca el héroe, insinúa la lección.'],['Planteo','El mundo del héroe, sus defectos y todo lo que hay que arreglar.'],['Catalizador','El hecho que cambia la vida.'],['Debate','¿Voy o no voy? El héroe duda.'],['Paso al Acto 2','El héroe elige entrar en el mundo al revés del segundo acto.'],['Trama B','Una relación nueva que lleva el tema.'],['Diversión y juegos','La promesa de la premisa; las escenas que mostraría un tráiler.'],['Punto medio','Una falsa victoria o una falsa derrota; sube lo que está en juego.'],['Los malos se acercan','La presión externa y la duda interna aprietan juntas.'],['Todo está perdido','El punto más bajo, a menudo con olor a muerte.'],['Noche oscura del alma','El héroe se hunde y después encuentra la clave.'],['Paso al Acto 3','Las tramas A y B se juntan; el héroe ve la solución.'],['Final','El héroe aplica la lección y gana, cambiado.'],['Imagen final','Un espejo de la imagen de apertura que prueba el cambio.']],
 best:'Novelas de género, guiones, arreglar un medio lento.',ex:'Legalmente rubia · Hechizo del tiempo · Los juegos del hambre'},
sevenpoint:{name:'Estructura de siete puntos',origin:'Dan Wells',tag:'Planeá primero el final y hacé del comienzo su opuesto.',
 about:'Wells propone diseñar hacia atrás: decidí la resolución y hacé del gancho su imagen invertida. Los giros llevan al personaje de reaccionar a actuar, las presiones aprietan y el punto medio es donde deja de huir y empieza a empujar.',
 beats:[['Gancho','El estado opuesto a la resolución: débil donde será fuerte.'],['Giro 1','Una idea, persona o hecho nuevo pone la historia en marcha.'],['Presión 1','La presión del antagonista obliga al personaje a actuar.'],['Punto medio','El personaje pasa de la reacción a la acción.'],['Presión 2','Todo sale muy mal; falla el plan o se pierde al mentor.'],['Giro 2','Encaja la última pieza; tiene lo que necesita para ganar.'],['Resolución','El clímax y el nuevo estado, espejo del gancho.']],
 best:'Planear el arco de un personaje contra una trama externa.',ex:'Harry Potter y la piedra filosofal · Los juegos del hambre'},
fichtean:{name:'Curva de Fichte',origin:'John Gardner, El arte de la ficción, 1983',tag:'Empezá en problemas y seguí subiéndolos. El trasfondo puede esperar.',
 about:'En lugar de una exposición tranquila, la historia abre en crisis y apila una crisis sobre otra, cada una peor que la anterior. El trasfondo llega en fragmentos entre ellas. Después del clímax, el final llega rápido.',
 beats:[['Primera crisis','Abrí dentro de un problema; saltá la introducción lenta.'],['Crisis crecientes','Cada crisis se resuelve a medias y cada solución causa la siguiente. Acá se teje el trasfondo.'],['Clímax','La crisis más grande, donde todo está en juego.'],['Final rápido','Mostrá el costo y cortá.']],
 best:'Thrillers, terror, historias de supervivencia, cuentos.',ex:'Parque Jurásico · Misery · Los juegos del hambre'},
snowflake:{name:'El método copo de nieve',origin:'Randy Ingermanson',tag:'Hacer crecer una novela a partir de una sola oración.',
 about:'Es un método de planificación, no una forma. Empezás con un resumen de una oración y lo expandís por pasadas, como un copo fractal que gana detalle. Cada paso es chico, así que siempre sabés qué hacer después.',
 beats:[['Una oración','Resumí toda la historia en unas quince palabras.'],['Un párrafo','Cinco oraciones: planteo, tres desastres, final.'],['Resúmenes de personajes','Para cada personaje principal: objetivo, conflicto, epifanía.'],['Una página','Expandí cada oración del párrafo en un párrafo.'],['Sinopsis de personajes','Contá la historia desde el punto de vista de cada personaje principal.'],['Sinopsis larga','Expandí cada párrafo en una página.'],['Fichas de personajes','Historias completas, motivaciones y cómo cambia cada uno.'],['Lista de escenas','Dividí la sinopsis en todas sus escenas.'],['Notas de escena','Un párrafo corto de intención para cada escena.'],['Primer borrador','Escribí a partir de la lista de escenas.']],
 best:'Escritores que planifican una novela, o cualquiera trabado con una idea grande.',ex:'Cualquier novela que planifiques antes de escribir'},
hero:{name:'El viaje del héroe',origin:'Joseph Campbell, 1949; las doce etapas de Christopher Vogler',tag:'Dejar el mundo conocido, sobrevivir a la prueba, traer algo a casa.',
 about:'Campbell encontró un patrón común en los mitos de todo el mundo; Vogler lo condensó en doce etapas para guionistas. El héroe cruza del mundo ordinario a uno especial, se transforma en una prueba y vuelve con algo que cambia su hogar.',
 beats:[['Mundo ordinario','La vida normal del héroe, con una carencia que quizá no admite.'],['La llamada a la aventura','Llega un problema, un mensaje o una oportunidad.'],['Rechazo de la llamada','El miedo o el deber lo hacen dudar.'],['Encuentro con el mentor','Alguien le da un consejo, una herramienta o valor.'],['Cruce del umbral','Se compromete y entra en el mundo especial.'],['Pruebas, aliados, enemigos','Aprende las reglas nuevas y en quién confiar.'],['Aproximación','La preparación para la prueba central: planes y dudas.'],['Prueba suprema','Una crisis de vida o muerte; algo tiene que morir, literalmente o no.'],['Recompensa','Se queda con el premio: un objeto, un saber o una reconciliación.'],['El camino de regreso','Las consecuencias lo persiguen; se compromete a volver.'],['Resurrección','Una prueba final que usa todo lo aprendido.'],['Regreso con el elixir','Trae a casa algo que cambia su mundo.']],
 best:'Aventura, fantasía, historias de crecimiento.',ex:'La guerra de las galaxias (1977) · El hobbit · El rey león'},
storycircle:{name:'El círculo narrativo',origin:'Dan Harmon, a partir de Campbell (también llamado embrión de trama)',tag:'Ocho pasos: querer, ir, encontrar, pagar, volver, cambiar.',
 about:'Harmon redujo el viaje del héroe a ocho pasos que entran en un episodio o en un cuento. La mitad de arriba del círculo es el orden y la de abajo el caos; el personaje baja y vuelve a subir cambiado.',
 beats:[['Vos','Un personaje en su zona de confort.'],['Necesidad','Pero quiere algo.'],['Ir','Entra en una situación desconocida.'],['Buscar','Se adapta a ella.'],['Encontrar','Consigue lo que quería.'],['Pagar','Paga un precio alto por eso.'],['Volver','Regresa a su situación conocida.'],['Cambiar','Habiendo cambiado.']],
 best:'Cuentos, episodios de TV, arcos centrados en el personaje.',ex:'Community · Rick and Morty · Buscando a Nemo'},
tragic:{name:'El círculo trágico',origin:'Una variante negativa del círculo de Harmon',tag:'El mismo viaje, pero la lección se lee mal y el círculo nunca se cierra.',
 about:'El personaje recorre los mismos pasos, pero en el momento de pagar el precio saca la conclusión equivocada. Vuelve sin el cambio que necesitaba, o peor, y ya no encaja en su mundo de antes.',
 beats:[['Vos','Un personaje en su zona de confort, con un defecto.'],['Necesidad','Quiere algo, a menudo por la razón equivocada.'],['Ir','Entra en una situación desconocida.'],['Buscar','Se adapta, a veces demasiado bien.'],['Encontrar','Consigue lo que quería.'],['Lección mal leída','Paga el precio pero aprende lo que no era.'],['Volver','Intenta regresar.'],['Ruina','Igual que antes o peor, ya no encaja; el círculo queda abierto.']],
 best:'Tragedias, estudios oscuros de personaje, relatos de advertencia.',ex:'El gran Gatsby · El ciudadano Kane · Breaking Bad'},

};
const UI={
en:{kick:'A field guide for fiction writers',title:'The Plot Atlas',sub:'Twenty ways to shape a story, drawn as diagrams. Browse the atlas, pick a structure, then spin the generator for a writing prompt built on it.',

 atlas:'The atlas',atlasH:'Plot structures',atlasNote:'Open any plate for the full diagram, the beats, and examples.',all:'All',
 foot:'Diagrams redrawn from common plot-structure references (Freytag, Campbell, Harmon, Snyder, Wells, Booker, Vonnegut and others). Examples are illustrative; most stories mix several shapes.',
 auto:'Auto',light:'Light',dark:'Dark',theme:'Theme',lang:'Language',yourPrompt:'Your prompt',beatsToHit:'Beats to hit',copy:'Copy prompt',about:'About this structure',copied:'Copied',selected:'Selected. Press Ctrl+C to copy.',
 bestFor:'Works well for',examples:'Examples',use:'Use in a prompt',close:'Close',lock:'Lock',unlock:'Unlock',reroll:'Reroll',constraintL:'Constraint',beatsL:'Beats',
 labels:{structure:'Structure',plot:'Plot type',tone:'Tone',character:'Protagonist',want:'Wants',obstacle:'Obstacle',setting:'Setting',object:'Object',twist:'Wild card',constraint:'Constraint'}},
es:{kick:'Guía de campo para escritores de ficción',title:'El atlas de tramas',sub:'Veinte maneras de darle forma a una historia, dibujadas como diagramas. Recorré el atlas, elegí una estructura y girá el generador para obtener una consigna de escritura basada en ella.',

 auto:'Auto',light:'Claro',dark:'Oscuro',theme:'Tema',lang:'Idioma',yourPrompt:'Tu consigna',beatsToHit:'Beats a cubrir',copy:'Copiar consigna',about:'Sobre esta estructura',copied:'Copiado',selected:'Seleccionado. Presioná Ctrl+C para copiar.',

 labels:{structure:'Estructura',plot:'Tipo de trama',tone:'Tono',character:'Protagonista',want:'Quiere',obstacle:'Obstáculo',setting:'Lugar',object:'Objeto',twist:'Comodín',constraint:'Restricción'}}};
const u=k=>UI[lang][k];

/* ---------- generator state (indices, so locks survive a language switch) ---------- */
const KEYS=['structure','plot','tone','character','want','obstacle','setting','object','twist','constraint'];
const size=k=>k==='structure'?S.length:POOL[k].length;
const state={v:{},lock:{}};
const rnd=(n,not)=>{if(n<2)return 0;let x;do{x=Math.floor(Math.random()*n)}while(x===not);return x};
const val=k=>k==='structure'?loc(S[state.v.structure],'name'):POOL[k][state.v[k]][lang==='es'?1:0];
const an=w=>/^[aeiou]/i.test(w)?'an':'a';
const cap=s=>s[0].toUpperCase()+s.slice(1);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

const LOCK_ON='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="10" height="7" rx="1" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>';
const LOCK_OFF='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5 7V5a3 3 0 0 1 5.8-1"/></svg>';

function spin(only){KEYS.forEach(k=>{if(only?k===only:!state.lock[k])state.v[k]=rnd(size(k),state.v[k])});render()}
function renderSlots(){
  const lb=u('labels');
  document.getElementById('slots').innerHTML=KEYS.map(k=>`<div class="slot${state.lock[k]?' locked':''}">
    <button class="slot-main" data-reroll="${k}" title="${u('reroll')}: ${lb[k].toLowerCase()}"><span class="sl">${lb[k]}</span><span class="sv">${esc(val(k))}</span></button>
    <button class="lock" data-lock="${k}" aria-pressed="${!!state.lock[k]}" aria-label="${state.lock[k]?u('unlock'):u('lock')}: ${lb[k]}">${state.lock[k]?LOCK_ON:LOCK_OFF}</button></div>`).join('');
  document.getElementById('structSel').value=S[state.v.structure].id;
}
function promptParts(){
  const s=S[state.v.structure],v=k=>val(k);let head,body;
  if(lang==='es'){
    head=`Una historia en tono ${v('tone')} del tipo «${v('plot')}», construida sobre ${loc(s,'name')}`;
    body=[['Tu protagonista es ',v('character')],[', que quiere ',v('want')],['. Lo que se interpone: ',v('obstacle')],['. Ambientala en ',v('setting')],[', y hacé que ',v('object')],[' importe al final. Comodín: ',v('twist')],['.','']];
  }else{
    head=`${cap(an(v('tone')))} ${v('tone')} ${v('plot')} story, built on ${loc(s,'name')}`;
    body=[['Your protagonist is ',v('character')],[', who wants ',v('want')],['. Standing in the way: ',v('obstacle')],['. Set it in ',v('setting')],[', and make ',v('object')],[' matter by the end. Wild card: ',v('twist')],['.','']];
  }
  return {s,head,body,constraint:v('constraint')};
}
const beatList=s=>{const b=loc(s,'beats');return `<ol class="beats${b.length>6?' cols':''}">${b.map(x=>`<li><div><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div></li>`).join('')}</ol>`};
function renderResult(){
  const {s,head,body,constraint}=promptParts();
  document.getElementById('result').innerHTML=`
    <span class="kicker">${u('yourPrompt')}</span>
    <h3>${esc(head)}</h3>
    <p>${body.map(([t,b])=>esc(t)+(b?`<b>${esc(b)}</b>`:'')).join('')}</p>
    <p class="constraint">${esc(constraint)}</p>
    <div class="result-fig">${DIAG[s.id]()}</div>
    <h4>${u('beatsToHit')} · ${esc(loc(s,'name'))}</h4>
    ${beatList(s)}
    <div class="res-actions"><button class="btn primary" id="copy">${u('copy')}</button><button class="btn" data-open="${s.id}">${u('about')}</button><span class="copied" id="copied" role="status"></span></div>`;
}
function render(){renderSlots();renderResult()}

/* ---------- atlas ---------- */
let filter='all',openId=null;
function renderFilters(){
  const f=[['all',u('all')]].concat(Object.keys(FAM).map(k=>[k,famName(k)]));
  document.getElementById('filters').innerHTML=f.map(([k,n])=>`<button class="chip" data-filter="${k}" aria-pressed="${filter===k}">${n}</button>`).join('');
}
function renderGrid(){
  document.getElementById('grid').innerHTML=S.filter(s=>filter==='all'||s.fam===filter).map(s=>`<button class="card" data-open="${s.id}">
    <div class="thumb">${DIAG[s.id]()}</div>
    <span class="kicker">${famName(s.fam)}</span><h3>${esc(loc(s,'name'))}</h3><p>${esc(loc(s,'tag'))}</p></button>`).join('');
}
const dlg=document.getElementById('dlg');
function openPlate(id){
  openId=id;
  const i=S.findIndex(s=>s.id===id),s=S[i],prev=S[(i-1+S.length)%S.length],next=S[(i+1)%S.length];
  document.getElementById('plate').innerHTML=`
    <div class="plate-head"><div><span class="kicker">${famName(s.fam)}</span><h2 id="dlgTitle">${esc(loc(s,'name'))}</h2><div class="origin">${esc(loc(s,'origin'))}</div></div>
      <button class="x" data-close aria-label="${u('close')}">×</button></div>
    <figure>${DIAG[s.id]()}</figure>
    <p class="lede">${esc(loc(s,'about'))}</p>
    ${beatList(s)}
    <div class="meta"><div><h4>${u('bestFor')}</h4><p>${esc(loc(s,'best'))}</p></div><div><h4>${u('examples')}</h4><p><i>${esc(loc(s,'ex'))}</i></p></div></div>
    <div class="plate-actions"><button class="btn primary" data-use="${s.id}">${u('use')}</button>
      <span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-open="${prev.id}">← ${esc(loc(prev,'name'))}</button><button class="btn" data-open="${next.id}">${esc(loc(next,'name'))} →</button></span></div>`;
  if(!dlg.open)dlg.showModal();
  dlg.scrollTop=0;
}

/* ---------- static text, language and theme ---------- */
function renderStatic(){
  document.documentElement.lang=lang;
  document.title=u('title');
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=u(el.dataset.i));
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  document.querySelectorAll('[data-theme-set]').forEach(b=>b.textContent=u(b.dataset.themeSet));
  const sel=document.getElementById('structSel');
  sel.innerHTML=Object.keys(FAM).map(k=>`<optgroup label="${famName(k)}">${S.filter(s=>s.fam===k).map(s=>`<option value="${s.id}">${esc(loc(s,'name'))}</option>`).join('')}</optgroup>`).join('');
  document.querySelector('.mast-top [data-i="kick"]').textContent=u('kick')+' · '+S.length+(lang==='es'?' estructuras':' structures');
}
function setLang(l){lang=l;renderStatic();renderFilters();renderGrid();render();if(dlg.open&&openId)openPlate(openId)}

let theme='auto';
try{theme=localStorage.getItem('plot-theme')||'auto'}catch(_){}
function applyTheme(t,save){
  theme=t;const root=document.documentElement;
  if(t==='auto'){if(save)root.removeAttribute('data-theme')}else root.setAttribute('data-theme',t);
  document.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.themeSet===t));
  if(save){try{localStorage.setItem('plot-theme',t)}catch(_){}}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.reroll){spin(t.dataset.reroll)}
  else if(t.dataset.lock){const k=t.dataset.lock;state.lock[k]=!state.lock[k];renderSlots()}
  else if(t.dataset.filter){filter=t.dataset.filter;renderFilters();renderGrid()}
  else if(t.dataset.open){openPlate(t.dataset.open)}
  else if(t.dataset.lang){setLang(t.dataset.lang)}
  else if(t.dataset.themeSet){applyTheme(t.dataset.themeSet,true)}
  else if('close' in t.dataset){dlg.close()}
  else if(t.dataset.use){state.v.structure=S.findIndex(s=>s.id===t.dataset.use);state.lock.structure=true;render();dlg.close();document.getElementById('gen-h').scrollIntoView({behavior:'smooth',block:'start'})}
  else if(t.id==='spin'){spin()}
  else if(t.id==='unlock'){state.lock={};renderSlots()}
  else if(t.id==='copy'){
    const {s,head,body,constraint}=promptParts();
    const txt=`${head}\n\n${body.map(x=>x[0]+x[1]).join('')}\n\n${u('constraintL')}: ${constraint}\n\n${u('beatsL')} (${loc(s,'name')}):\n`+loc(s,'beats').map((x,i)=>`${i+1}. ${x[0]}: ${x[1]}`).join('\n');
    const msg=document.getElementById('copied');
    const fallback=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('result'));const sl=getSelection();sl.removeAllRanges();sl.addRange(r);msg.textContent=u('selected')};
    try{navigator.clipboard.writeText(txt).then(()=>msg.textContent=u('copied'),fallback)}catch(_){fallback()}
  }
});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
document.getElementById('structSel').addEventListener('change',e=>{state.v.structure=S.findIndex(s=>s.id===e.target.value);state.lock.structure=true;render()});

DESK.onLang=setLang;
renderStatic();renderFilters();renderGrid();spin();
</script>
