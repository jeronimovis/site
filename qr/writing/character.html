<style id="desk-shared">
/* Shared design language for the writing desk: one palette, three typefaces, one top bar. */
:root{
  --dk-bg:#fdfdfc; --dk-paper:#ffffff; --dk-ink:#16171a; --dk-muted:#5b5e67; --dk-rule:#d8dbe1;
  --dk-soft:#f3f4f7; --dk-wash:#e8edf6; --dk-accent:#1f4f8a; --dk-accent-soft:#dde5f6; --dk-on-accent:#ffffff; --dk-mark:#f6eaa9;
  --dk-display:"Libre Caslon Display","Bodoni 72",Didot,Georgia,serif;
  --dk-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --dk-ui:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --dk-bg:#121316; --dk-paper:#1a1b20; --dk-ink:#ebeae5; --dk-muted:#a3a6ae; --dk-rule:#34363c;
  --dk-soft:#1c1e23; --dk-wash:#1b2331; --dk-accent:#8db2e8; --dk-accent-soft:#25314f; --dk-on-accent:#0f1320; --dk-mark:#4b4321; color-scheme:dark}}
:root[data-theme="dark"]{
  --dk-bg:#121316; --dk-paper:#1a1b20; --dk-ink:#ebeae5; --dk-muted:#a3a6ae; --dk-rule:#34363c;
  --dk-soft:#1c1e23; --dk-wash:#1b2331; --dk-accent:#8db2e8; --dk-accent-soft:#25314f; --dk-on-accent:#0f1320; --dk-mark:#4b4321; color-scheme:dark}
.dk-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;padding:14px 0 12px;border-bottom:1px solid var(--dk-rule)}
.dk-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font:600 12px/1.3 var(--dk-ui);letter-spacing:.08em;text-transform:uppercase}
.dk-crumbs a{color:var(--dk-ink);text-decoration:none;border-bottom:1px solid transparent}
.dk-crumbs a:hover{color:var(--dk-accent);border-color:var(--dk-accent)}
.dk-crumbs .dk-sep{color:var(--dk-muted)}
.dk-prefs{display:flex;gap:8px;flex-wrap:wrap}
.dk-seg{display:inline-flex;border:1px solid var(--dk-rule);border-radius:2px;overflow:hidden}
.dk-seg button{background:transparent;border:0;margin:0;padding:5px 10px;cursor:pointer;font:600 11px/1.4 var(--dk-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--dk-muted)}
.dk-seg button+button{border-left:1px solid var(--dk-rule)}
.dk-seg button:hover{color:var(--dk-ink)}
.dk-seg button[aria-pressed="true"]{background:var(--dk-ink);color:var(--dk-bg)}
.dk-seg button:focus-visible,.dk-crumbs a:focus-visible{outline:2px solid var(--dk-accent);outline-offset:2px}
</style>
<script>
/* Shared preferences: language (Spanish by default) and theme (light by default), remembered across all pages of the desk. */
(function(){
  var R=document.documentElement;
  var DEF={'desk-lang':'es','desk-theme':'light'};
  function get(k){try{return localStorage.getItem(k)||DEF[k]}catch(e){return DEF[k]}}
  function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function sys(){return (navigator.language||'').toLowerCase().indexOf('es')===0?'es':'en'}
  var T={en:{auto:'Auto',light:'Light',dark:'Dark',home:'Writing desk',lang:'Language',theme:'Theme'},
         es:{auto:'Auto',light:'Claro',dark:'Oscuro',home:'Mesa de escritura',lang:'Idioma',theme:'Tema'}};
  var D=window.DESK={lang:get('desk-lang'),theme:get('desk-theme'),onLang:null,
    eff:function(){return this.lang==='auto'?sys():this.lang}};
  function applyTheme(){if(D.theme==='light'||D.theme==='dark')R.setAttribute('data-theme',D.theme);else R.removeAttribute('data-theme')}
  function paint(){
    var t=T[D.eff()];
    document.querySelectorAll('[data-dk-lang]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-dk-lang')===D.lang)});
    document.querySelectorAll('[data-dk-theme]').forEach(function(b){var v=b.getAttribute('data-dk-theme');b.setAttribute('aria-pressed',v===D.theme);b.textContent=t[v]});
    document.querySelectorAll('[data-dk-t]').forEach(function(e){e.textContent=t[e.getAttribute('data-dk-t')]});
    document.querySelectorAll('[data-dk-aria]').forEach(function(e){e.setAttribute('aria-label',t[e.getAttribute('data-dk-aria')])});
  }
  function fire(){paint();if(D.onLang)D.onLang(D.eff())}
  D.setLang=function(l){D.lang=l;put('desk-lang',l);fire()};
  D.setTheme=function(t){D.theme=t;put('desk-theme',t);applyTheme();paint()};
  D.paint=paint;
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-dk-lang],[data-dk-theme]');if(!b)return;
    if(b.hasAttribute('data-dk-lang'))D.setLang(b.getAttribute('data-dk-lang'));else D.setTheme(b.getAttribute('data-dk-theme'));
  });
  window.addEventListener('languagechange',function(){if(D.lang==='auto')fire()});
  window.addEventListener('storage',function(e){
    if(e.key==='desk-theme'){D.theme=e.newValue||'light';applyTheme();paint()}
    if(e.key==='desk-lang'){D.lang=e.newValue||'es';fire()}
  });
  applyTheme();
  R.lang=D.eff();
})();
</script>
<style>
/* Layout: masthead like the other desk pages; a roster of characters on the left; each section is a grid of
   [questions | margin], and the margin holds the editor's red-pencil marks. Blue stays the desk accent. */
:root{--bg:var(--dk-bg);--ink:var(--dk-ink);--muted:var(--dk-muted);--rule:var(--dk-rule);--soft:var(--dk-soft);--accent:var(--dk-accent);
  --pencil:#A8392E;--pencil-wash:#f8e9e6;
  --display:var(--dk-display);--body:var(--dk-body);--ui:var(--dk-ui)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pencil:#E57B70;--pencil-wash:#2b1b19}}
:root[data-theme="dark"]{--pencil:#E57B70;--pencil-wash:#2b1b19}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{padding:18px 0 16px;border-bottom:3px double var(--ink)}
.kick{font:600 12px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.3rem,6.5vw,4.2rem);line-height:1;margin:8px 0 8px;letter-spacing:-.01em;text-wrap:balance}
.lede{margin:0;color:var(--muted);font-style:italic;max-width:60ch}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;padding-top:26px}
.roster{position:sticky;top:14px;align-self:start;font-family:var(--ui)}
.roster h2{font:600 11.5px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.roster ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.roster li{border-bottom:1px solid var(--rule)}
.who{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 8px 10px 0}
.who b{display:block;font-family:var(--display);font-weight:400;font-size:21px;line-height:1.15}
.who small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.who small em{font-style:normal;color:var(--pencil);font-weight:600}
.who:hover b{color:var(--accent)}
.who[aria-current="true"]{padding-left:10px;box-shadow:inset 3px 0 0 var(--accent)}
.roster-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{font:600 13px var(--ui);letter-spacing:.02em;background:transparent;border:1px solid var(--ink);padding:7px 13px;border-radius:2px;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{background:var(--soft)}
.btn.quiet{border-color:var(--rule)}
.btn.quiet:hover{border-color:var(--ink)}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.solid:hover{background:var(--accent);border-color:var(--accent);color:var(--dk-on-accent)}

.head{display:grid;gap:10px;margin-bottom:16px}
.tag{font:600 11.5px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--pencil);margin:0}
.name-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 20px;border-bottom:1px solid var(--rule)}
.name{flex:1 1 280px;min-width:0;font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,40px);line-height:1.1;border:0;background:none;padding:2px 0 6px}
.name-link{font:600 13px var(--ui);color:var(--accent);text-decoration:none;white-space:nowrap;padding-bottom:8px}
.name-link:hover{text-decoration:underline;text-underline-offset:3px}
.head-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px}
.mini label{display:block;font:600 11.5px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.mini input{width:100%;border:0;border-bottom:1px solid var(--rule);background:none;padding:3px 0 5px;font-size:17px}
.mini input:focus{border-bottom-color:var(--ink)}
.meter{font:500 12px var(--ui);color:var(--muted);margin-top:6px}
.meter-bar{position:relative;height:1px;background:var(--ink);margin:12px 0 6px}
.meter-bar i{position:absolute;top:-5px;width:11px;height:11px;border-radius:50%;background:var(--accent);transform:translateX(-50%);transition:left .3s ease}
.meter-ends{display:flex;justify-content:space-between;gap:12px}
.meter-ends b{font-weight:600;color:var(--ink)}

.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--rule);margin:16px 0 6px;scrollbar-width:thin}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 9px;font:500 14px var(--ui);color:var(--muted);white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tabs button sup{color:var(--pencil);font-weight:700;font-size:11px;margin-left:4px}
.tabs .last{margin-left:auto}
.lead{font-style:italic;font-size:19px;max-width:62ch;margin:20px 0 0;text-wrap:pretty}
.lead.warn{color:var(--pencil);font-size:16px;margin-top:8px}

.sec{display:grid;grid-template-columns:minmax(0,62ch) minmax(190px,250px);gap:12px 44px;padding:32px 0 28px;border-bottom:1px solid var(--rule);scroll-margin-top:56px}
.sec:last-child{border-bottom:0}
.sec-main{display:grid;gap:20px;min-width:0}
.sec h3{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.1;margin:0;text-wrap:balance}
.sec h3 span{font:700 12px var(--ui);letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:6px;font-variant-numeric:tabular-nums}
.principle{margin:-8px 0 0;color:var(--muted);font-style:italic;font-size:16px}
.margin{align-self:start;padding-top:40px;display:grid;gap:14px}
.margin:empty{display:none}
.margin-label{font:600 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--pencil);margin:0}
.note{margin:0;color:var(--pencil);font-style:italic;font-size:16px;line-height:1.38;padding-left:12px;border-left:2px solid var(--pencil);animation:mark .3s ease both;overflow-wrap:anywhere}
@keyframes mark{from{opacity:.2;transform:translateX(6px)}}

.field{display:grid;gap:6px;min-width:0;border:0;margin:0;padding:0}
.field>label,.field>legend{font-weight:600;font-size:17.5px;line-height:1.3;padding:0}
.hint{font:400 13px var(--ui);color:var(--muted);margin:0}
.field input[type="text"],.field textarea{width:100%;background:var(--soft);border:0;border-bottom:1px solid var(--rule);padding:9px 11px;font-size:17px;line-height:1.45;border-radius:0;resize:vertical}
.field textarea{min-height:3.2em;field-sizing:content}
.field textarea.big{min-height:11em}
.field input[type="text"]:focus,.field textarea:focus{border-bottom-color:var(--accent);outline:2px solid var(--accent);outline-offset:0}
::placeholder{color:var(--muted);opacity:.75;font-style:italic}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.pill{position:relative;font:500 13px var(--ui)}
.pill input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pill span{display:block;border:1px solid var(--rule);padding:6px 13px;border-radius:999px}
.pill:hover span{border-color:var(--ink)}
.pill input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:10px;align-items:baseline;font-size:17px}
.check input{width:16px;height:16px;accent-color:var(--accent);flex:none;translate:0 2px}
.rows{display:grid;gap:10px;margin-top:4px}
.row{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr)) auto;gap:8px;align-items:start}
.row.stacked{grid-template-columns:minmax(0,1fr) auto;padding:12px 0 12px 14px;border-left:1px solid var(--ink)}
.row.stacked .cells{display:grid;gap:10px}
.cell{display:grid;gap:3px;min-width:0}
.cell label{font:500 12px var(--ui);color:var(--muted)}
.x{font:500 12px var(--ui);background:none;border:0;color:var(--muted);padding:10px 4px;text-decoration:underline;text-underline-offset:3px}
.x:hover{color:var(--pencil)}
.add{justify-self:start}
.zocalo{display:flex;align-items:stretch;font:500 12.5px var(--ui);border:1px solid var(--ink);overflow:hidden}
.zocalo b{flex:none;background:var(--pencil);color:var(--bg);padding:6px 10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;display:flex;align-items:center}
.zocalo div{overflow-x:auto;white-space:nowrap;padding:6px 12px;text-transform:uppercase;letter-spacing:.03em}
.zocalo:has(div:empty){display:none}
.hedge-out{font-size:16.5px;line-height:1.55;border-left:1px solid var(--ink);padding:4px 0 4px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.hedge-out:empty{display:none}
.hedge-out mark{background:var(--pencil-wash);color:var(--pencil);text-decoration:underline wavy var(--pencil);text-underline-offset:4px;padding:0 2px}
.hedge-count{font:400 13px var(--ui);color:var(--muted);margin:0}
.hedge-count:empty{display:none}

.report{max-width:70ch;padding-top:26px;display:grid;gap:30px}
.report h3{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.1;margin:0}
.report-sum{font-style:italic;font-size:19px;margin:6px 0 0}
.rep-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.rep-list>li{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;padding:16px 0;border-bottom:1px solid var(--rule)}
.jump{font:600 13px var(--ui);text-align:left;background:none;border:0;padding:2px 0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;align-self:start}
.rep-notes{display:grid;gap:10px}
.rep-notes .note{animation:none}
.out-actions{display:flex;flex-wrap:wrap;gap:8px}
.small{font:400 13px/1.5 var(--ui);color:var(--muted);margin:0;max-width:62ch}
#fallback{width:100%;min-height:12em;margin-top:12px;background:var(--soft);border:1px solid var(--rule);padding:10px;font:13px ui-monospace,Menlo,Consolas,monospace}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:500 13px var(--ui);padding:10px 16px;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;border-radius:2px}
.toast.on{opacity:1}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
footer{margin-top:48px;border-top:1px solid var(--rule);padding-top:12px;font:400 13px/1.5 var(--ui);color:var(--muted);max-width:80ch}

@media (max-width:1080px){
  .sec{grid-template-columns:minmax(0,1fr)}
  .margin{padding-top:0;order:2}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);gap:20px;padding-top:18px}
  .roster{position:static}
  .roster ul{display:flex;overflow-x:auto;border-top:0;gap:8px}
  .roster li{border:1px solid var(--rule);flex:none;max-width:70vw}
  .who{padding:8px 12px}
  .who[aria-current="true"]{padding-left:12px;box-shadow:inset 0 -3px 0 var(--accent)}
  .head-row{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row:not(.stacked) .cell+.cell{grid-column:1}
  .row:not(.stacked) .x{grid-column:2;grid-row:1}
  .rep-list>li{grid-template-columns:minmax(0,1fr);gap:8px}
  .tabs .last{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
'use strict';

/* ---------- language ---------- */
let lang = DESK.eff();
/* Every visible string in the schema is a pair: [Spanish, English]. */
const L = x => Array.isArray(x) ? x[lang === 'en' ? 1 : 0] : x;

/* ---------- schema: the questions, in the order of the class ---------- */
const SCHEMA = [
  { id: 'juego', t: ['Juego', 'Play'],
    lead: ['El borrador es emocional; la corrección, intelectual. Empezá acá y no corrijas nada. Las otras pestañas son para después.',
           'The draft is emotional; the editing is intellectual. Start here and correct nothing. The other tabs are for later.'],
    secs: [
      { id: 'ridiculo', t: ['Exagerar el síntoma', 'Exaggerate the symptom'],
        p: ['Andá a tu tendencia más marcada y llevala al máximo. De tanto ridículo aparece una oración que vibra distinto, y desde ahí se elabora.',
            'Go to your strongest tendency and push it all the way. Out of all that silliness comes one sentence that hums differently, and you build from there.'],
        fields: [
          { k: 'estereotipo_partida', type: 'text', q: ['¿De qué estereotipo partís?', 'Which stereotype are you starting from?'],
            ph: ['El jefe tacaño, la princesa, el detective de 1940', 'The stingy boss, the princess, the 1940 detective'] },
          { k: 'ridiculo', type: 'big', q: ['Estereotipalo hasta el ridículo. Tirá información sin frenar.', 'Stereotype it to the point of ridicule. Pour out information without braking.'],
            hint: ['Borrador tonto, feo y malo. Nadie lo corrige acá.', 'A dumb, ugly, bad draft. Nobody corrects it here.'] },
          { k: 'vibra', type: 'area', q: ['¿Qué oración vibra distinto?', 'Which sentence hums differently?'] }
        ] },
      { id: 'frankenstein', t: ['De quién está hecho', 'Who they are made of'],
        p: ['Los personajes son un compuesto de gente que ya conocés: cómo hacía las cosas tu tía, el tono de un jefe, alguien de la tele.',
            'Characters are a composite of people you already know: the way your aunt did things, a boss’s tone, someone off the TV.'],
        fields: [
          { k: 'piezas', type: 'list', q: ['Piezas', 'Parts'], add: ['Agregar pieza', 'Add a part'],

/* ---------- helpers ---------- */
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return e;
}
const $ = id => document.getElementById(id);
const str = x => (typeof x === 'string' ? x.trim() : '');
function cite(s) {
  const t = s.length > 64 ? s.slice(0, 61).trimEnd() + '…' : s;
  return lang === 'en' ? '“' + t + '”' : '«' + t + '»';
}
function rowsOf(c, k) {
  return (Array.isArray(c.d[k]) ? c.d[k] : []).filter(r => r && Object.values(r).some(x => str(x)));
}

/* ---------- amount of information (editor's tabs only) ---------- */
function infoCount(c) {
  let n = 0;
  SCHEMA.forEach(g => {
    if (g.id === 'juego') return;
    g.secs.forEach(s => s.fields.forEach(f => {
      const v = c.d[f.k];
      if (f.type === 'list') rowsOf(c, f.k).forEach(r => { n += Object.values(r).filter(x => str(x)).length; });
      else if (f.type === 'checks') n += v ? Object.values(v).filter(Boolean).length : 0;
      else if (str(v)) n += 1;
    }));
  });
  return n;
}

/* ---------- hedges, in Spanish and English: the pasted text can be in either ---------- */
const HEDGE = /(?<![\p{L}])(tal vez|quiz[aá]s?|a lo mejor|podr[ií]a ser|puede ser|puede que|capaz que|capaz|parec[ií]a|parece que|se parecer[ií]a|supongo|creo que|me parece|como si|no s[eé] si|probablemente|de alguna manera|una especie de|algo as[ií]|maybe|perhaps|possibly|probably|might|could be|seem(?:s|ed)?|as if|as though|sort of|kind of|I think|I guess|I suppose|somehow|not sure|something like)(?![\p{L}])/giu;
function hedges(text) { return (text.match(HEDGE) || []).length; }
function paintHedges(box, countEl, text) {
  box.textContent = ''; countEl.textContent = '';
  if (!str(text)) return;
  let last = 0, n = 0;
  for (const mt of text.matchAll(HEDGE)) {
    box.append(text.slice(last, mt.index), el('mark', { text: mt[0] }));
    last = mt.index + mt[0].length; n++;
  }
  box.append(text.slice(last));
  countEl.textContent = u().hedges(n);
}

/* ---------- the editor: rules that return questions ---------- */
function diagnose(c) {
  const out = [];
  const v = k => str(c.d[k]);
  const add = (sec, key, ...a) => out.push({ sec, text: m(key, ...a) });
  const tipo = v('tipo');
  const org = tipo === 'organico', mec = tipo === 'mecanico';
  const info = infoCount(c);

  if (!v('ridiculo') && info >= 3) add('ridiculo', 'rid_empty');
  if (v('ridiculo') && !v('vibra')) add('ridiculo', 'rid_vibra');
  if (org && !v('propio')) add('frankenstein', 'frank');

  if (!tipo && info >= 1) add('funcion', 'fun_tipo');
  if (mec && info > 14) add('funcion', 'fun_mec', info);
  if (mec && !v('destello')) add('funcion', 'fun_destello');
  if (org && info < 8) add('funcion', 'fun_org', info);

  rowsOf(c, 'rasgos').forEach(r => { if (str(r.rasgo) && !str(r.sirve)) add('identidad', 'id_rasgo', cite(str(r.rasgo))); });
  if (org && !rowsOf(c, 'rasgos').length && !v('jungla')) add('identidad', 'id_repite');
  if (!v('praxis') && v('adjudicada')) add('identidad', 'id_praxis');

  if (!mec && info >= 3 && !v('necesidad')) add('motivo', 'mot_none');
  if (v('gran') === 'obsesion' && !v('obsesion')) add('motivo', 'mot_obs');
  if (v('gran') === 'destino' && !v('destino')) add('motivo', 'mot_dest');
  if (v('necesidad') && !v('rompe')) add('motivo', 'mot_rompe');

  if ((v('adjetivos') || v('repite')) && !v('desafia')) add('personalidad', 'pers');

  const est = v('estereotipo_partida');
  if ((est || v('ahorra')) && !v('quiebre')) add('estereotipo', 'est', est ? cite(est) : '');

  rowsOf(c, 'nudos').forEach(r => {
    if (str(r.a) && str(r.b) && !str(r.raiz)) add('creencias', 'nudo_raiz', cite(str(r.a)), cite(str(r.b)));
    if ((str(r.a) || str(r.b)) && !(str(r.a) && str(r.b))) add('creencias', 'nudo_half');
  });
  const cr = rowsOf(c, 'creencias');
  cr.forEach(r => {
    if (!str(r.cree)) return;
    const name = cite(str(r.cree));
    if (!str(r.contra)) add('creencias', 'cr_contra', name);
    if (!str(r.evidencia)) add('creencias', 'cr_evid', name);
    if (!str(r.conducta)) add('creencias', 'cr_cond', name);
  });
  if (rowsOf(c, 'nudos').some(r => str(r.raiz)) && !cr.length) add('creencias', 'cr_raiz');
  if (org && !cr.length && !rowsOf(c, 'nudos').length) add('creencias', 'cr_none');

  rowsOf(c, 'zocalo').forEach(r => { if (str(r.p) && !str(r.creencia)) add('pensamiento', 'pens', cite(str(r.p))); });

  if (v('borracho') && !v('sentimiento')) add('siente', 'sie_sent');
  if (v('sentimiento') && !cr.length) add('siente', 'sie_cr');

  if (v('hecho') && !v('intimo')) add('cambio', 'cam_int');
  if (v('rituales') && !rowsOf(c, 'senales').length) add('cambio', 'cam_sen');
  if ((v('hecho') || v('rituales')) && !v('quiebre_c')) add('cambio', 'cam_q');
  if (v('clase') === 'resiste' && !v('rituales')) add('cambio', 'cam_res');

  if (v('conoce') === 'no') add('voz', 'voz_no');
  if (org && !v('latiguillos') && (v('colectivo') || v('escucha') || v('choque_l'))) add('voz', 'voz_neutro');
  if (v('latiguillos') && !v('colectivo')) add('voz', 'voz_col');

  const dream = v('atmosfera') || v('simbolos') || v('raro') || v('funcion_s');
  if ((v('atmosfera') || v('simbolos')) && !v('raro')) add('sueno', 'sue_raro');
  if (dream && !v('revela')) add('sueno', 'sue_rev');
  if (dream && !v('atmosfera')) add('sueno', 'sue_atm');

  if (org && !v('oculta')) add('sombra', 'som_oc');
  if (v('oculta') && !v('justifica')) add('sombra', 'som_just');
  if (v('secree') && !v('oculta')) add('sombra', 'som_cree', cite(v('secree')));
  if (v('oculta') && v('justifica') && !v('gimnasia')) add('sombra', 'som_gim');

  if (v('narra') === 'si') {
    const h = hedges(v('muestra'));
    if (h > 0) add('narra', 'nar_h', h);
    if (!v('confianza')) add('narra', 'nar_conf');
    if (!v('deforma')) add('narra', 'nar_def');
  }

  const vivo = c.d.chk_vivo ? Object.values(c.d.chk_vivo).filter(Boolean).length : 0;
  if (info > 10 && vivo === 0) add('kayfabe', 'kay_vivo');
  if (!v('empatia') && est) add('kayfabe', 'kay_emp', cite(est));

  return out;
}

  let total = 0;
  SCHEMA.forEach(g => {
    const n = g.secs.reduce((a, s) => a + (by[s.id] ? by[s.id].length : 0), 0); total += n;
    box.append(el('button', { type: 'button', role: 'tab', id: 'tab-' + g.id, 'aria-selected': String(state.tab === g.id), onclick: () => go(g.id) },
      L(g.t), n ? el('sup', { text: String(n) }) : null));
  });
  box.append(el('button', { type: 'button', role: 'tab', id: 'tab-informe', class: 'last', 'aria-selected': String(state.tab === 'informe'), onclick: () => go('informe') },
    u().reportTab, total ? el('sup', { text: String(total) }) : null));
}
function go(tab, secId) {
  state.tab = tab; save(); renderTabs(); renderSheet();
  const target = secId ? $('sec-' + secId) : $('tabs');
  if (target) target.scrollIntoView({ block: 'start' });
}

function renderField(c, f) {
  if (f.when && str(c.d[f.when[0]]) !== f.when[1]) return null;
  const id = 'f-' + f.k, q = L(f.q);
  const hint = f.hint ? el('p', { class: 'hint', text: L(f.hint) }) : null;
  const onText = e => { c.d[f.k] = e.target.value; grow(e.target); changed(); };

  if (f.type === 'text') {
    return el('div', { class: 'field' }, el('label', { for: id, text: q }), hint,
      el('input', { id, type: 'text', value: c.d[f.k] || '', placeholder: f.ph ? L(f.ph) : null, oninput: onText }));
  }
  if (f.type === 'area' || f.type === 'big') {
    const t = el('textarea', { id, class: f.type === 'big' ? 'big' : null, rows: f.type === 'big' ? 8 : 2, oninput: onText });
    t.value = c.d[f.k] || '';
    return el('div', { class: 'field' }, el('label', { for: id, text: q }), hint, t);
  }
  if (f.type === 'hedge') {
    const box = el('div', { class: 'hedge-out', 'aria-label': u().hedgeBox });
    const count = el('p', { class: 'hedge-count' });
    const t = el('textarea', { id, rows: 5, oninput: e => { c.d[f.k] = e.target.value; grow(e.target); paintHedges(box, count, e.target.value); changed(); } });
    t.value = c.d[f.k] || '';
    paintHedges(box, count, t.value);
    return el('div', { class: 'field' }, el('label', { for: id, text: q }), hint, t, count, box);
  }
  if (f.type === 'choice') {
    return el('fieldset', { class: 'field' }, el('legend', { text: q }), hint,
      el('div', { class: 'pills' }, f.opts.map(([val, label]) => {
        const inp = el('input', { type: 'radio', name: id, id: id + '-' + val, value: val,
          onclick: e => {
            if (c.d[f.k] === val) { c.d[f.k] = ''; e.target.checked = false; } else c.d[f.k] = val;
            touch(); save(); renderSheet(); refresh();
            const again = $(id + '-' + val); if (again) again.focus();
          } });
        inp.checked = c.d[f.k] === val;
        return el('label', { class: 'pill' }, inp, el('span', { text: L(label) }));
      })));
  }
  if (f.type === 'checks') {
    const cv = c.d[f.k] = c.d[f.k] || {};
    return el('fieldset', { class: 'field' }, el('legend', { text: q }),
      f.opts.map(([val, label]) => {
        const inp = el('input', { type: 'checkbox', id: id + '-' + val, onchange: e => { cv[val] = e.target.checked; changed(); } });
        inp.checked = !!cv[val];
        return el('label', { class: 'check' }, inp, el('span', { text: L(label) }));
      }));
  }
  if (f.type === 'list') {
    if (!Array.isArray(c.d[f.k]) || !c.d[f.k].length) c.d[f.k] = [{}];
    const list = c.d[f.k];
    const zoc = f.zocalo ? el('div', { class: 'zocalo', 'aria-hidden': 'true' }, el('b', { text: u().now }), el('div', { id: 'zocalo-strip' })) : null;
    const rows = el('div', { class: 'rows' }, list.map((r, i) => {
      const cells = f.cols.map(([sub, label]) => {
        const cid = id + '-' + i + '-' + sub;
        const on = e => { r[sub] = e.target.value; grow(e.target); changed(); };
        let ctl;
        if (f.stacked) { ctl = el('textarea', { id: cid, rows: 2, oninput: on }); ctl.value = r[sub] || ''; }
        else ctl = el('input', { id: cid, type: 'text', value: r[sub] || '', placeholder: f.plain ? L(label) : null, oninput: on });
        return el('div', { class: 'cell' }, el('label', { for: cid, class: f.plain ? 'visually-hidden' : null, text: f.plain ? q + ' ' + (i + 1) : L(label) }), ctl);
      });
      const rm = el('button', { type: 'button', class: 'x', 'aria-label': u().removeRow + (i + 1),
        onclick: () => { list.splice(i, 1); touch(); save(); renderSheet(); refresh(); } }, u().remove);
      return f.stacked
        ? el('div', { class: 'row stacked' }, el('div', { class: 'cells' }, cells), rm)
        : el('div', { class: 'row', style: '--n:' + f.cols.length }, cells, rm);
    }));
    const addBtn = el('button', { type: 'button', class: 'btn quiet add',
      onclick: () => { list.push({}); save(); renderSheet(); const first = $(id + '-' + (list.length - 1) + '-' + f.cols[0][0]); if (first) first.focus(); } }, L(f.add));
    return el('fieldset', { class: 'field' }, el('legend', { text: q }), hint, rows, addBtn, zoc);
  }
  return null;
}

function renderSheet() {
  const c = cur(), sheet = $('sheet'); sheet.textContent = '';
  if (state.tab === 'informe') { renderReport(sheet, c); return; }
  const g = SCHEMA.find(x => x.id === state.tab) || SCHEMA[0];
  sheet.append(el('p', { class: 'lead', text: L(g.lead) }));
  if (g.id !== 'juego' && g.id !== 'fuera' && str(c.d.tipo) === 'mecanico') sheet.append(el('p', { class: 'lead warn', text: u().mecWarn }));
  g.secs.forEach(s => {
    sheet.append(el('section', { class: 'sec', id: 'sec-' + s.id, 'aria-labelledby': 'h-' + s.id },
      el('div', { class: 'sec-main' },
        el('h3', { id: 'h-' + s.id }, el('span', { text: String(SECS[s.id].n).padStart(2, '0') }), L(s.t)),
        el('p', { class: 'principle', text: L(s.p) }),
        s.fields.map(f => renderField(c, f))),
      el('aside', { class: 'margin', id: 'm-' + s.id, 'aria-label': u().notesOf + L(s.t) })));
  });
  paintMargins();
  if (NO_SIZING) requestAnimationFrame(() => sheet.querySelectorAll('textarea').forEach(grow));
}

function paintMargins(by) {
  const c = cur();
  by = by || notesBySec(diagnose(c));
  document.querySelectorAll('.margin').forEach(box => {
    const list = by[box.id.slice(2)] || [];
    const sig = list.join('\n');
    if (box.dataset.sig === sig) return;
    box.dataset.sig = sig; box.textContent = '';
    if (!list.length) return;
    box.append(el('p', { class: 'margin-label', text: u().editor }), ...list.map(t => el('p', { class: 'note', text: t })));
  });
  const strip = $('zocalo-strip');
  if (strip) strip.textContent = rowsOf(c, 'zocalo').map(r => str(r.p)).filter(Boolean).join('   ·   ');
}

let refT = null;
function changed() {
  const c = cur(), wasExample = c.ejemplo && !c.touched;
  touch(); save();
  if (wasExample) { const tag = document.querySelector('#head .tag'); if (tag) tag.remove(); }
  clearTimeout(refT); refT = setTimeout(refresh, 180);
}
/* Rewrites only the counters and the margins, so the field being typed in keeps focus. */
function refresh() {
  const by = notesBySec(diagnose(cur()));
  if (state.tab !== 'informe') paintMargins(by);
  let total = 0;
  SCHEMA.forEach(g => {
    const n = g.secs.reduce((a, s) => a + (by[s.id] ? by[s.id].length : 0), 0); total += n;
    setSup($('tab-' + g.id), n);
  });
  setSup($('tab-informe'), total);
  renderMeter();
  state.chars.forEach(c => {
    const b = document.querySelector('.who[data-id="' + c.id + '"]'); if (!b) return;
    b.querySelector('em').textContent = u().marks(diagnose(c).length);
    b.querySelector('small span').textContent = tipoLabel(c);
  });
}
function setSup(btn, n) {
  if (!btn) return;
  let s = btn.querySelector('sup');
  if (!n) { if (s) s.remove(); return; }
  if (!s) { s = el('sup'); btn.append(s); }
  s.textContent = String(n);
}

/* ---------- the editor's reading ---------- */
function renderReport(sheet, c) {
  const t = u(), notes = diagnose(c), by = notesBySec(notes);
  const secIds = Object.keys(SECS).filter(id => by[id]);
  const wrap = el('div', { class: 'report' });
  wrap.append(el('div', {}, el('h3', { text: t.reportTab }), el('p', { class: 'report-sum', text: notes.length ? t.sum(notes.length, secIds.length) : t.noMarks })));
  if (notes.length) {
    wrap.append(el('ul', { class: 'rep-list' }, secIds.map(id =>
      el('li', {},
        el('button', { type: 'button', class: 'jump', onclick: () => go(SECS[id].group, id) }, String(SECS[id].n).padStart(2, '0') + ' · ' + L(SECS[id].t)),
        el('div', { class: 'rep-notes' }, by[id].map(x => el('p', { class: 'note', text: x })))))));
  }
  const fb = el('textarea', { id: 'fallback', readonly: true, hidden: true, 'aria-label': t.fallback });
  wrap.append(el('div', {},
    el('h3', { text: t.take }),
    el('p', { class: 'small', style: 'margin:8px 0 14px', text: t.storage }),
    el('div', { class: 'out-actions' },
      el('button', { type: 'button', class: 'btn solid', onclick: () => copyMd(c, fb) }, t.copyMd),
      el('button', { type: 'button', class: 'btn', onclick: () => saveFile(slug(c.nombre) + '.md', toMarkdown(c), 'text/markdown') }, t.dlMd),
      el('button', { type: 'button', class: 'btn', onclick: () => saveFile(t.fileAll + '.json', JSON.stringify({ chars: state.chars }, null, 2), 'application/json') }, t.dlJson),
      el('label', { class: 'btn quiet', for: 'import', text: t.load }),
      el('input', { id: 'import', type: 'file', accept: '.json,application/json', class: 'visually-hidden', onchange: importFile })
    ),
    fb));
  sheet.append(wrap);
}

function slug(s) {
  return (str(s) || u().fileChar).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || u().fileChar;
}
function toMarkdown(c) {
  const out = ['# ' + (str(c.nombre) || u().unnamed)];
  if (str(c.proyecto)) out.push('', '*' + str(c.proyecto) + '*');
  if (str(c.linea)) out.push('', str(c.linea));
  SCHEMA.forEach(g => {
    const gl = [];
    g.secs.forEach(s => {
      const sl = [];
      s.fields.forEach(f => {
        const val = c.d[f.k], q = L(f.q);
        if (f.type === 'list') {
          const rows = rowsOf(c, f.k); if (!rows.length) return;
          sl.push('', '**' + q + '**', '');
          rows.forEach(r => {
            if (f.plain) { sl.push('- ' + str(r[f.cols[0][0]])); return; }
            let first = true;
            f.cols.forEach(([sub, label]) => { if (!str(r[sub])) return; sl.push((first ? '- ' : '  ') + L(label) + ' ' + str(r[sub]).replace(/\n+/g, ' ')); first = false; });
          });
        } else if (f.type === 'choice') {
          const o = f.opts.find(x => x[0] === val); if (o) sl.push('', '**' + q + '** ' + L(o[1]));
        } else if (f.type === 'checks') {
          const on = f.opts.filter(x => val && val[x[0]]); if (on.length) sl.push('', on.map(x => '- [x] ' + L(x[1])).join('\n'));
        } else if (str(val)) sl.push('', '**' + q + '**', '', str(val));
      });
      if (sl.length) gl.push('', '### ' + L(s.t), ...sl);
    });
    if (gl.length) out.push('', '## ' + L(g.t), ...gl);
  });
  const notes = diagnose(c);
  if (notes.length) { out.push('', '## ' + u().mdOpen, ''); notes.forEach(n => out.push('- ' + L(SECS[n.sec].t) + ': ' + n.text)); }
  return out.join('\n') + '\n';
}
function copyMd(c, fb) {
  const md = toMarkdown(c);
  const fail = () => { fb.hidden = false; fb.value = md; fb.focus(); fb.select(); toast(u().copyFail); };
  try { navigator.clipboard.writeText(md).then(() => toast(u().copied), fail); } catch (e) { fail(); }
}
function saveFile(filename, data, type) {
  const url = URL.createObjectURL(new Blob([data], { type: type + ';charset=utf-8' }));
  const a = el('a', { href: url, download: filename });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast(u().saved(filename));
}
function importFile(e) {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  file.text().then(txt => {
    const data = JSON.parse(txt);
    const list = Array.isArray(data) ? data : data.chars;
    if (!Array.isArray(list) || !list.length) throw new Error('empty');
    const have = new Set(state.chars.map(c => c.id));
    let n = 0;
    list.forEach(c => {
      if (!c || typeof c !== 'object') return;
      const nc = { id: have.has(c.id) || !c.id ? uid() : String(c.id), nombre: str(c.nombre), proyecto: str(c.proyecto), linea: str(c.linea), touched: true,
        d: (c.d && typeof c.d === 'object') ? c.d : {} };
      state.chars.push(nc); have.add(nc.id); n++;
    });
    if (!n) throw new Error('empty');
    state.current = state.chars[state.chars.length - 1].id; state.tab = 'juego';
    save(); renderAll(); toast(u().imported(n));
  }).catch(() => toast(u().importBad));
  e.target.value = '';
}

function renderAll() { renderStatic(); renderRoster(); renderHead(); renderTabs(); renderSheet(); }

/* ---------- roster actions ---------- */
$('new').addEventListener('click', () => {
  const c = blank(); state.chars.push(c); state.current = c.id; state.tab = 'juego';
  save(); renderAll(); $('c-nombre').focus();
});
$('dup').addEventListener('click', () => {
  const c = JSON.parse(JSON.stringify(cur())); c.id = uid(); delete c.ejemplo; c.touched = true; c.nombre = (c.nombre || u().unnamed) + u().copyOf;
  state.chars.push(c); state.current = c.id; save(); renderAll(); toast(u().dupDone);
});
let delArmed = null;
$('del').addEventListener('click', e => {
  const b = e.currentTarget;
  if (!delArmed) {
    b.textContent = u().delAsk((cur().nombre || u().unnamed).slice(0, 18));
    delArmed = setTimeout(() => { b.textContent = u().del; delArmed = null; }, 3500);
    return;
  }
  clearTimeout(delArmed); delArmed = null;
  state.chars = state.chars.filter(c => c.id !== state.current);
  if (!state.chars.length) state.chars.push(blank());
  state.current = state.chars[0].id; save(); renderAll(); toast(u().deleted);
});

/* ---------- language switch and start ---------- */
function setLang(l) {
  lang = l;
  state.chars = state.chars.map(c => (c.ejemplo && !c.touched) ? seed(c.id) : c);
  renderAll();
}
(function start() {
  const s = load();
  if (s) state = { chars: s.chars, current: s.current, tab: s.tab || 'juego' };
  else { const c = seed(); state = { chars: [c], current: c.id, tab: 'juego' }; }
  state.chars.forEach(c => { if (!c.d || typeof c.d !== 'object') c.d = {}; });
  if (!state.chars.some(c => c.id === state.current)) state.current = state.chars[0].id;
  DESK.onLang = setLang;
  setLang(DESK.eff());
})();
</script>
