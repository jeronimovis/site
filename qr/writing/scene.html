<style id="desk-shared">
/* Shared design language for the writing desk: one palette, three typefaces, one top bar. */
:root{
  --dk-bg:#fdfdfc; --dk-paper:#ffffff; --dk-ink:#16171a; --dk-muted:#5b5e67; --dk-rule:#d8dbe1;
  --dk-soft:#f3f4f7; --dk-wash:#e8edf6; --dk-accent:#1f4f8a; --dk-accent-soft:#dde5f6; --dk-on-accent:#ffffff; --dk-mark:#f6eaa9;
  --dk-display:"Libre Caslon Display","Bodoni 72",Didot,Georgia,serif;
  --dk-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --dk-ui:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --dk-bg:#121316; --dk-paper:#1a1b20; --dk-ink:#ebeae5; --dk-muted:#a3a6ae; --dk-rule:#34363c;
  --dk-soft:#1c1e23; --dk-wash:#1b2331; --dk-accent:#8db2e8; --dk-accent-soft:#25314f; --dk-on-accent:#0f1320; --dk-mark:#4b4321; color-scheme:dark}}
:root[data-theme="dark"]{
  --dk-bg:#121316; --dk-paper:#1a1b20; --dk-ink:#ebeae5; --dk-muted:#a3a6ae; --dk-rule:#34363c;
  --dk-soft:#1c1e23; --dk-wash:#1b2331; --dk-accent:#8db2e8; --dk-accent-soft:#25314f; --dk-on-accent:#0f1320; --dk-mark:#4b4321; color-scheme:dark}
.dk-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;padding:14px 0 12px;border-bottom:1px solid var(--dk-rule)}
.dk-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font:600 12px/1.3 var(--dk-ui);letter-spacing:.08em;text-transform:uppercase}
.dk-crumbs a{color:var(--dk-ink);text-decoration:none;border-bottom:1px solid transparent}
.dk-crumbs a:hover{color:var(--dk-accent);border-color:var(--dk-accent)}
.dk-crumbs .dk-sep{color:var(--dk-muted)}
.dk-prefs{display:flex;gap:8px;flex-wrap:wrap}
.dk-seg{display:inline-flex;border:1px solid var(--dk-rule);border-radius:2px;overflow:hidden}
.dk-seg button{background:transparent;border:0;margin:0;padding:5px 10px;cursor:pointer;font:600 11px/1.4 var(--dk-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--dk-muted)}
.dk-seg button+button{border-left:1px solid var(--dk-rule)}
.dk-seg button:hover{color:var(--dk-ink)}
.dk-seg button[aria-pressed="true"]{background:var(--dk-ink);color:var(--dk-bg)}
.dk-seg button:focus-visible,.dk-crumbs a:focus-visible{outline:2px solid var(--dk-accent);outline-offset:2px}
</style>
<script>
/* Shared preferences: language (Spanish by default) and theme (light by default), remembered across all pages of the desk. */
(function(){
  var R=document.documentElement;
  var DEF={'desk-lang':'es','desk-theme':'light'};
  function get(k){try{return localStorage.getItem(k)||DEF[k]}catch(e){return DEF[k]}}
  function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function sys(){return (navigator.language||'').toLowerCase().indexOf('es')===0?'es':'en'}
  var T={en:{auto:'Auto',light:'Light',dark:'Dark',home:'Writing desk',lang:'Language',theme:'Theme'},
         es:{auto:'Auto',light:'Claro',dark:'Oscuro',home:'Mesa de escritura',lang:'Idioma',theme:'Tema'}};
  var D=window.DESK={lang:get('desk-lang'),theme:get('desk-theme'),onLang:null,
    eff:function(){return this.lang==='auto'?sys():this.lang}};
  function applyTheme(){if(D.theme==='light'||D.theme==='dark')R.setAttribute('data-theme',D.theme);else R.removeAttribute('data-theme')}
  function paint(){
    var t=T[D.eff()];
    document.querySelectorAll('[data-dk-lang]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-dk-lang')===D.lang)});
    document.querySelectorAll('[data-dk-theme]').forEach(function(b){var v=b.getAttribute('data-dk-theme');b.setAttribute('aria-pressed',v===D.theme);b.textContent=t[v]});
    document.querySelectorAll('[data-dk-t]').forEach(function(e){e.textContent=t[e.getAttribute('data-dk-t')]});
    document.querySelectorAll('[data-dk-aria]').forEach(function(e){e.setAttribute('aria-label',t[e.getAttribute('data-dk-aria')])});
  }
  function fire(){paint();if(D.onLang)D.onLang(D.eff())}
  D.setLang=function(l){D.lang=l;put('desk-lang',l);fire()};
  D.setTheme=function(t){D.theme=t;put('desk-theme',t);applyTheme();paint()};
  D.paint=paint;
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-dk-lang],[data-dk-theme]');if(!b)return;
    if(b.hasAttribute('data-dk-lang'))D.setLang(b.getAttribute('data-dk-lang'));else D.setTheme(b.getAttribute('data-dk-theme'));
  });
  window.addEventListener('languagechange',function(){if(D.lang==='auto')fire()});
  window.addEventListener('storage',function(e){
    if(e.key==='desk-theme'){D.theme=e.newValue||'light';applyTheme();paint()}
    if(e.key==='desk-lang'){D.lang=e.newValue||'es';fire()}
  });
  applyTheme();
  R.lang=D.eff();
})();
</script>
<style>
/* Layout: one reading column; four index cards as a selector, a detail sheet below, a script page for prompts, then craft diagrams. */
:root{
  --bg:var(--dk-bg); --paper:var(--dk-paper); --ink:var(--dk-ink); --muted:var(--dk-muted); --rule:var(--dk-rule); --soft:var(--dk-soft);
  --neg:var(--dk-accent); --fight:#A8392E; --sed:#86407A; --disc:#8F6312;
  --display:var(--dk-display); --body:var(--dk-body); --ui:var(--dk-ui);
  --mono:"Courier Prime","Courier New",Courier,monospace;
  --accent:var(--neg);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fight:#E57B70; --sed:#CF8CC0; --disc:#DDAA52}}
:root[data-theme="dark"]{--fight:#E57B70; --sed:#CF8CC0; --disc:#DDAA52}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
p{margin:0}
.label{font-family:var(--ui);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding-block:18px;border-bottom:1px solid var(--rule)}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--rule);border-radius:999px;padding:2px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:999px;font-family:var(--ui);font-size:12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.hero{padding-block:40px 28px;display:grid;gap:18px;border-bottom:3px double var(--ink)}
.hero .kick{font:600 12px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:clamp(44px,8vw,88px);line-height:.95;letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--accent);transition:color .3s}
.rule-quote{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;max-width:720px}
.rule-quote .bigq{font-family:var(--display);font-size:64px;line-height:.8;color:var(--muted)}
.rule-quote p{font-size:19px}
.rule-quote cite{display:block;margin-top:8px;font-style:normal}

.types{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:12px}
.type{--c:var(--neg);text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:16px 16px 18px;cursor:pointer;
  display:grid;gap:10px;position:relative;transition:transform .15s,border-color .15s;align-content:start}
.type:hover{transform:translateY(-2px)}
.type[aria-selected="true"]{border-color:var(--c);box-shadow:inset 0 -4px 0 var(--c)}
.type svg{width:100%;height:auto;max-height:96px;color:var(--c)}
.type h3{font-size:26px;line-height:1.05}
.type p{font-size:14.5px;color:var(--muted)}
.type .num{position:absolute;top:12px;right:14px}
@media (max-width:860px){.types{grid-template-columns:repeat(2,1fr)}}
@media (max-width:440px){.types{grid-template-columns:1fr}.type svg{max-height:72px}}

.detail{margin-top:28px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:28px clamp(18px,4vw,36px);display:grid;gap:24px}
.detail-head{display:grid;gap:8px}
.detail-head h2{font-size:clamp(34px,5vw,52px);color:var(--accent)}
.detail-head .tag{font-size:21px;font-style:italic;max-width:46ch}
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:32px}
.cols > *{min-width:0}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.block{display:grid;gap:8px}
.block p{max-width:62ch}
.changes{border-left:3px solid var(--accent);padding-left:14px}
.changes strong{font-family:var(--display);font-weight:400;font-size:24px;display:block}
ul.plain{margin:0;padding-left:1.1em;display:grid;gap:6px}
.trap{background:var(--soft);padding:14px 16px;border-radius:3px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:440px;height:auto}
.example{font-size:15.5px;color:var(--muted)}

section.s{margin-top:64px;display:grid;gap:18px}
section.s > header{display:grid;gap:8px;max-width:680px}
section.s h2{font-size:clamp(32px,4.5vw,46px)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--rule);background:var(--paper);padding:6px 14px;border-radius:999px;font-family:var(--ui);font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.go{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--accent);color:var(--paper);padding:12px 22px;border-radius:3px;font-family:var(--ui);font-weight:700;letter-spacing:.06em;cursor:pointer;transition:background .3s}
.go:active{transform:translateY(1px)}
.go svg{width:18px;height:18px;flex:none}
.ghost{border:1px solid var(--rule);background:none;padding:11px 18px;border-radius:3px;font-family:var(--ui);cursor:pointer}
.page{background:var(--paper);border:1px solid var(--rule);box-shadow:0 1px 0 var(--rule),0 18px 40px -28px rgba(0,0,0,.35);
  padding:clamp(22px,5vw,56px) clamp(18px,6vw,72px);font-family:var(--ui);font-size:15.5px;line-height:1.6;max-width:820px;width:100%;justify-self:center;font-family:var(--mono)}
.page .slug{font-weight:700;text-transform:uppercase}
.page .kind{text-transform:uppercase;color:var(--accent);font-weight:700;letter-spacing:.06em}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:118px 1fr 34px;gap:12px;align-items:start}
.row .k{text-transform:uppercase;color:var(--muted);font-size:13px;padding-top:2px}
.row .v{min-width:0}
.lock{width:30px;height:30px;border:1px solid var(--rule);border-radius:3px;background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.lock[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.lock svg{width:15px;height:15px}
@media (max-width:520px){.row{grid-template-columns:1fr 34px}.row .k{grid-column:1/-1;padding:0}}
.pagefoot{margin-top:22px;padding-top:14px;border-top:1px dashed var(--rule);font-size:14px;color:var(--muted)}
.flash{animation:flash .5s ease}
@keyframes flash{from{background:var(--soft)}to{background:transparent}}
.toast{font-family:var(--ui);font-size:13px;color:var(--muted)}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:860px){.grid3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.grid3{grid-template-columns:1fr}}
figure{margin:0;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:16px;display:grid;gap:10px;align-content:start}
figure svg{width:100%;height:auto;display:block}
figure h3{font-size:22px}
figcaption{font-size:15px;color:var(--muted)}
svg .ink{stroke:var(--ink);fill:none}
svg .mut{stroke:var(--muted);fill:none}
svg .acc{stroke:var(--accent);fill:none}
svg .accf{fill:var(--accent)}
svg .papf{fill:var(--paper)}
svg .softf{fill:var(--soft)}
svg text{font-family:var(--ui);font-size:11px;fill:var(--muted);letter-spacing:.04em}
svg text.strong{fill:var(--ink);font-weight:700}
svg text.a{fill:var(--accent);font-weight:700}

.check{display:grid;max-width:760px}
.check label{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.check input{width:18px;height:18px;margin-top:4px;accent-color:var(--accent)}
.check span b{font-weight:600}
.check input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}
footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--rule);font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

    {who:"a police officer and her informant",s:"the officer",o:"the informant"},
    {who:"a grandmother and her granddaughter",s:"the grandmother",o:"her granddaughter"},
    {who:"a band's singer and its drummer",s:"the singer",o:"the drummer"},
    {who:"a shop owner and a teenage shoplifter",s:"the shop owner",o:"the teenager"}],
  goal:{

    fight:["admit they lied","leave and never come back","take the blame in front of everyone","stop pretending everything is fine","choose a side, now","give back what they took","apologise to someone who is dead","say out loud what happened that summer"],
    seduction:["join a scheme that is almost legal","come back to a life they escaped","forgive someone they shouldn't","quit a safe job for a risky one","lie to their own family","get into a stranger's car","trust them one more time","give up the one thing they are proud of"]},
  secret:["the will was changed last month","the baby is not who everyone thinks","the money has been gone for a year","their father had a second family","the accident was not an accident","the house was sold weeks ago","the diagnosis came back clean and they kept pretending","the friend they are mourning is alive"],
  disc:["the reader only, not the characters","both of them at the same moment"],
  resist:["saying yes means admitting they were wrong for years","someone is listening on the other side of the door","they promised a dead person they never would","it would cost them the only job they have","they said yes once before and it ruined them","pride: the other one asked in the wrong tone","they don't have it to give and can't admit it","the last time they gave in, someone got hurt"],
  prop:["a set of keys that no longer open anything","a plate of food going cold","a lottery ticket","a phone that keeps lighting up face down","an unpaid electricity bill","a child's drawing","a wedding ring in a pocket, not on a finger","a borrowed coat","a cake with the wrong name on it","an urn","a cigarette nobody lights","a cheque already signed"],
  constraint:["no more than ten lines of dialogue","nobody may name the real subject","it has to happen during a household chore","start mid-sentence and end before the goodbye","one of the characters cannot speak","a third person is in the room and must not find out","it has to be over before the kettle boils","nobody may sit down"],
  turn:["someone neither of them expected calls","one of them reveals they already knew","the prop breaks, spills or goes missing","the weaker side suddenly holds the stronger card","the person they are fighting about walks in","one of them laughs at the wrong moment","the power goes out","a lie from the first line is caught"]
},
es:{
  slug:["INT. CAFETERÍA DE HOSPITAL — 3 A. M.","EXT. TERMINAL DE ÓMNIBUS — AMANECER","INT. UNA COCINA DESPUÉS DEL VELORIO — NOCHE","INT. AUTO FRENADO EN UN PEAJE — DÍA","INT. AULA VACÍA — ÚLTIMA HORA DE LA TARDE","EXT. TERRAZA DURANTE UN CORTE DE LUZ — NOCHE","INT. CASA DE EMPEÑOS — HORA DE CIERRE","INT. BAÑO DE UN SALÓN DE FIESTAS — NOCHE","EXT. ESTACIÓN DE SERVICIO EN UNA RUTA DESIERTA — MEDIODÍA","INT. LAVADERO AUTOMÁTICO — DOMINGO A LA MAÑANA","INT. ASCENSOR TRABADO ENTRE PISOS — DÍA","INT. SALA DE ESPERA DE UNA ESCRIBANÍA — MAÑANA","EXT. ESTACIONAMIENTO DEL CEMENTERIO — ATARDECER","INT. TRASTIENDA DE UNA PANADERÍA — 5 A. M.","INT. CAMIÓN DE MUDANZA, A MEDIO CARGAR — DÍA","INT. CAMARÍN DE UN CANAL DE TELEVISIÓN — NOCHE"],
  pair:[
    {who:"una madre y su hijo adulto",s:"la madre",o:"su hijo"},
    {who:"dos hermanas",s:"una de ellas",o:"la otra"},
    {who:"un dueño y su inquilina",s:"el dueño",o:"la inquilina"},
    {who:"una jefa y el empleado al que acaba de negarle un aumento",s:"la jefa",o:"el empleado"},
    {who:"un profesor jubilado y su mejor exalumna",s:"el profesor",o:"su exalumna"},
    {who:"un exmarido y la nueva pareja de su exmujer",s:"el exmarido",o:"la nueva pareja"},
    {who:"un cura y una feligresa que dejó de ir",s:"el cura",o:"la feligresa"},
    {who:"una enfermera de guardia y la hija de un paciente",s:"la enfermera",o:"la hija"},
    {who:"dos viejos amigos, veinte años después",s:"uno de ellos",o:"el otro"},
    {who:"una estafadora y un viudo",s:"la estafadora",o:"el viudo"},
    {who:"una policía y su informante",s:"la policía",o:"el informante"},
    {who:"una abuela y su nieta",s:"la abuela",o:"su nieta"},
    {who:"la cantante de una banda y su baterista",s:"la cantante",o:"el baterista"},
    {who:"un comerciante y una adolescente que le roba",s:"el comerciante",o:"la adolescente"}],
  goal:{
    negotiation:["le firme la cesión de la casa","le preste plata sin preguntar para qué","retire lo que dijo en la cena","se calle una semana más","le cambie el turno de Navidad","le ceda la tenencia del perro","le entregue una carta que prometió quemar","le baje el precio a la mitad"],
    fight:["admita que mintió","se vaya y no vuelva nunca","cargue con la culpa delante de todos","deje de hacer como que todo está bien","elija un bando, ya","devuelva lo que se llevó","le pida perdón a alguien que está muerto","diga en voz alta qué pasó aquel verano"],
    seduction:["se sume a un negocio casi legal","vuelva a una vida de la que escapó","perdone a alguien que no debería","deje un trabajo seguro por uno arriesgado","le mienta a su propia familia","se suba al auto de un desconocido","confíe una vez más","renuncie a lo único que le da orgullo"]},
  secret:["el testamento se cambió el mes pasado","el bebé no es de quien todos creen","la plata no está desde hace un año","su padre tenía otra familia","el accidente no fue un accidente","la casa se vendió hace semanas","el diagnóstico dio bien y siguieron fingiendo","el amigo al que lloran está vivo"],
  disc:["solo el lector, no los personajes","los dos, en el mismo momento"],
  resist:["decir que sí es admitir que se equivocaron durante años","alguien escucha del otro lado de la puerta","se lo prometieron a un muerto","les costaría el único trabajo que tienen","ya dijeron que sí una vez y les arruinó la vida","orgullo: el otro lo pidió en el tono equivocado","no lo tienen para dar y no pueden admitirlo","la última vez que cedieron, alguien salió lastimado"],
  prop:["unas llaves que ya no abren nada","un plato de comida que se enfría","un billete de lotería","un celular que no para de iluminarse boca abajo","una factura de luz impaga","un dibujo de un chico","un anillo de casamiento en el bolsillo, no en el dedo","un saco prestado","una torta con el nombre equivocado","una urna","un cigarrillo que nadie prende","un cheque ya firmado"],
  constraint:["no más de diez líneas de diálogo","nadie puede nombrar el tema real","tiene que pasar durante una tarea doméstica","empezá en mitad de una frase y terminá antes de la despedida","uno de los personajes no puede hablar","hay un tercero en la habitación que no puede enterarse","tiene que terminar antes de que hierva la pava","nadie puede sentarse"],
  turn:["llama alguien que ninguno de los dos esperaba","uno revela que ya lo sabía","el objeto se rompe, se derrama o desaparece","el lado débil de pronto tiene la carta más fuerte","entra la persona por la que discuten","uno se ríe en el momento equivocado","se corta la luz","se descubre una mentira de la primera línea"]
}};

/* ---------- state ---------- */
const root=document.documentElement;
let lang="es", current="negotiation", genType="any";
const locks={}, state={};
const FIELDS=["slug","type","pair","goal","resist","prop","constraint","turn"];
const L=()=>UI[lang], T=k=>TYPES[lang][k], P=()=>POOLS[lang];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const rnd=n=>Math.floor(Math.random()*n);

/* theme */
function setTheme(t){
  if(t==="auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme",t);
  document.querySelectorAll("#themeSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===t));
  try{localStorage.setItem("scene-theme",t)}catch(e){}
}
document.querySelectorAll("#themeSeg button").forEach(b=>b.addEventListener("click",()=>setTheme(b.dataset.t)));

/* language */
function setLang(l){
  lang=l; root.lang=l;
  document.querySelectorAll("#langSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  document.querySelectorAll("[data-i18n]").forEach(el=>{const v=L()[el.dataset.i18n]; if(typeof v==="string") el.innerHTML=v;});
  document.title=l==="es"?"Cuatro tipos de escena":"Four Kinds of Scene";
  buildCards(); select(current,true); paintChips(); renderPage(false);
}
document.querySelectorAll("#langSeg button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));

/* cards */
function buildCards(){
  const el=document.getElementById("types"); el.innerHTML="";
  ORDER.forEach((k,i)=>{
    const t=T(k), b=document.createElement("button");
    b.type="button"; b.className="type"; b.id="tab-"+k; b.setAttribute("role","tab");
    b.setAttribute("aria-selected",k===current);
    b.style.setProperty("--c",`var(${COLORS[k]})`);
    b.innerHTML=`<span class="label num">${i+1}/4</span>${ICONS[k]}<h3>${t.name}</h3><p>${t.tag.split(/[.:]/)[0]}.</p>`;
    b.addEventListener("click",()=>select(k));
    el.appendChild(b);
  });
}

function graph(k){
  const t=T(k), pts=PTS[k], W=560,H=220,Lm=96,R=34,Tm=24,B=48,n=pts.length;
  const x=i=>Lm+i*(W-Lm-R)/(n-1), mid=Tm+(H-Tm-B)/2, amp=(H-Tm-B)/2-6, y=v=>mid-v*amp;
  let d=`M${x(0)} ${y(pts[0])}`;
  for(let i=1;i<n;i++){
    if(k==="discovery") d+=` L${x(i)} ${y(pts[i-1])} L${x(i)} ${y(pts[i])}`;
    else{const cx=(x(i-1)+x(i))/2; d+=` C${cx} ${y(pts[i-1])}, ${cx} ${y(pts[i])}, ${x(i)} ${y(pts[i])}`;}
  }
  const ticks=t.beats.map((b,i)=>`<path d="M${x(i)} ${Tm} V${H-B}" class="mut" stroke-width=".6" stroke-dasharray="2 4"/><text x="${x(i)}" y="${H-B+20}" text-anchor="middle">${b.toUpperCase()}</text><text x="${x(i)}" y="${H-B+34}" text-anchor="middle">${i+1}</text>`).join("");
  const dots=pts.map((v,i)=>i===n-1?`<circle cx="${x(i)}" cy="${y(v)}" r="6" class="accf"/>`:`<circle cx="${x(i)}" cy="${y(v)}" r="4" class="papf"/><circle cx="${x(i)}" cy="${y(v)}" r="4" class="acc" stroke-width="2"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t.name}: ${t.g.y}">
    <path d="M${Lm} ${mid} H${W-R}" class="mut" stroke-width="1"/>
    <text x="${Lm-12}" y="${Tm+8}" text-anchor="end">${t.g.top.toUpperCase()}</text>
    <text x="${Lm-12}" y="${mid+4}" text-anchor="end" class="strong">${t.g.y.toUpperCase()}</text>
    <text x="${Lm-12}" y="${H-B}" text-anchor="end">${t.g.bot.toUpperCase()}</text>
    ${ticks}<path d="${d}" class="acc" stroke-width="3" stroke-linecap="round"/>${dots}</svg>`;
}

function select(k,quiet){
  current=k; const t=T(k), u=L();
  root.style.setProperty("--accent",`var(${COLORS[k]})`);
  document.querySelectorAll(".type").forEach(b=>b.setAttribute("aria-selected",b.id==="tab-"+k));
  const det=document.getElementById("detail");
  det.setAttribute("aria-labelledby","tab-"+k);
  det.innerHTML=`
    <div class="detail-head"><span class="label">${u.typeN(ORDER.indexOf(k)+1)}</span><h2>${t.name}</h2><p class="tag">${t.tag}</p></div>
    <div class="cols">
      <div class="block" style="gap:18px">
        <p>${t.what}</p>
        <div class="changes"><span class="label">${u.whatChanges}</span><strong>${t.change}</strong><p>${t.changeNote}</p></div>
        <div class="block"><span class="label">${u.signs}</span><ul class="plain">${t.signs.map(s=>`<li>${s}</li>`).join("")}</ul></div>
      </div>
      <div class="block" style="gap:18px">
        <div class="block"><span class="label">${u.shape}</span><div class="chart">${graph(k)}</div></div>
        <div class="trap"><span class="label">${u.trap}</span><p style="margin-top:6px">${t.trap}</p></div>
        <p class="example">${t.example}</p>
      </div>
    </div>`;
  if(!quiet && genType!=="any"){genType=k; paintChips(); roll(true);}
}

/* ---------- generator ---------- */
function paintChips(){
  const el=document.getElementById("typeChips"); el.innerHTML="";
  ["any",...ORDER].forEach(k=>{
    const c=document.createElement("button"); c.type="button"; c.className="chip";
    c.textContent=k==="any"?L().any:T(k).name; c.setAttribute("aria-pressed",genType===k);
    c.addEventListener("click",()=>{genType=k; locks.type=false; paintChips(); if(k!=="any") select(k,true); roll(true);});
    el.appendChild(c);
  });
}
function rollField(f){
  const p=POOLS.en;
  switch(f){
    case "type": return genType==="any"?ORDER[rnd(4)]:genType;
    case "goal": return state.type==="discovery"?{d:rnd(4),s:rnd(p.secret.length)}:rnd(8);
    default: return rnd(p[f].length);
  }
}
function roll(typeOnly){
  const prev=state.type;
  FIELDS.forEach(f=>{
    if(locks[f]) return;
    if(typeOnly && f!=="type" && f!=="goal") return;
    state[f]=rollField(f);
  });
  if((state.type==="discovery")!==(typeof state.goal==="object")) state.goal=rollField("goal");
  renderPage(true);
}
function value(f){
  const p=P(), u=L(), s=state, pr=p.pair[s.pair];
  switch(f){
    case "slug": return p.slug[s.slug];
    case "type": return `<span class="kind">${T(s.type).name}</span> — ${T(s.type).tag}`;
    case "pair": return cap(pr.who)+".";
    case "goal":
      if(s.type==="discovery"){const who=s.goal.d<2?[pr.s,pr.o][s.goal.d]:p.disc[s.goal.d-2]; return u.disc(who,p.secret[s.goal.s]);}
      return u.wants(cap(pr.s),pr.o,p.goal[s.type][s.goal]);
    case "resist": return s.type==="discovery"?u.buried(p.resist[s.resist]):cap(p.resist[s.resist])+".";
    case "prop": return `${cap(p.prop[s.prop])}. ${u.propS}`;
    case "constraint": return cap(p.constraint[s.constraint])+".";
    case "turn": return u.turnP+p.turn[s.turn]+".";
  }
}
const lockSvg=on=>on?`<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="8" rx="1" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>`
  :`<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="8" rx="1" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M5 7V5a3 3 0 0 1 6 0" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>`;

function renderPage(flash){
  if(state.type===undefined) return;
  const page=document.getElementById("page"), t=T(state.type), u=L();
  page.style.setProperty("--accent",`var(${COLORS[state.type]})`);
  page.innerHTML=`<div class="rows">${FIELDS.map(f=>`
    <div class="row" data-f="${f}"><span class="k">${u.F[f]}</span><span class="v${f==="slug"?" slug":""}">${value(f)}</span>
    <button type="button" class="lock" data-lock="${f}" aria-pressed="${!!locks[f]}" aria-label="${locks[f]?u.unlockOne:u.lock}: ${u.F[f]}">${lockSvg(locks[f])}</button></div>`).join("")}
  </div>
  <div class="pagefoot">${u.foot(t.beats.join(" → "),t.change.toLowerCase())}</div>`;
  page.querySelectorAll("[data-lock]").forEach(b=>b.addEventListener("click",()=>{locks[b.dataset.lock]=!locks[b.dataset.lock]; renderPage(false);}));
  if(flash) page.querySelectorAll(".row").forEach(r=>{if(!locks[r.dataset.f]){r.classList.remove("flash"); void r.offsetWidth; r.classList.add("flash");}});
}
const strip=h=>h.replace(/<[^>]+>/g,"");
function promptText(){
  const u=L(), t=T(state.type);
  return [value("slug"),"",strip(value("type")),
    ...["pair","goal","resist","prop","constraint","turn"].map(f=>`${u.F[f]}: ${strip(value(f))}`),
    `${u.beatsW}: ${t.beats.join(" → ")}`,
    `${u.mustChange}: ${t.change.toLowerCase()}.`].join("\n");
}
function toast(m){const el=document.getElementById("toast"); el.textContent=m; clearTimeout(toast.t); toast.t=setTimeout(()=>el.textContent="",2200);}

document.getElementById("roll").addEventListener("click",()=>roll(false));
document.getElementById("unlock").addEventListener("click",()=>{FIELDS.forEach(f=>locks[f]=false); renderPage(false); toast(L().unlocked);});
document.getElementById("copy").addEventListener("click",()=>{
  const fallback=()=>{const r=document.createRange(); r.selectNodeContents(document.getElementById("page")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast(L().selected);};
  try{navigator.clipboard.writeText(promptText()).then(()=>toast(L().copied),fallback);}catch(e){fallback();}
});

/* ---------- start with a filled example ---------- */
FIELDS.forEach(f=>state[f]=rollField(f));
state.goal=rollField("goal");
DESK.onLang=setLang;
setLang(DESK.eff());
</script>
