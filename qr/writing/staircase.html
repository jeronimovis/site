 or fascinating in his depravity; in <em>Strangers on a Train<\/em>, Bruno’s evil is offset by Guy’s “goodness.”", "<strong>Tragedy is not stakes.<\/strong> Piling up deaths and losses produces melodrama, unless the loss is concrete and tied to the character’s motives."]}], "lamps": [{"title": "Does the character have to transform?", "verdict": "In a short story something has to move, but it can be minimal (a gesture, as in Verni’s two lines) or a revelation (for the character, or only for the reader), rather than a full transformation.", "sides": [{"kind": "screen", "label": "Screenwriting", "text": "The want-and-need manuals and Russell’s “rite of passage” hero describe a full arc from A to Z: the character pursues the want, discovers the need, changes, and that change wins them the climax."}, {"kind": "story", "label": "Short story", "text": "The short story is built from the inside out, around a single revealing moment: an epiphany more than an arc. Shaelin Bishop: the climax is often a small decision that shows who the character has become. In much Latin American fiction, the character doesn’t even change."}, {"kind": "story", "label": "Story: structure", "text": "Highsmith: in the suspense novel “there is usually a drastic change in the hero”; the short story “may have only one scene and take place in five minutes or less.” <em>How to Structure a Short Story<\/em>: a novel follows a transformation; a short story follows a decision under pressure. The question isn’t “will she heal?” but “will she choose A or B?”"}, {"kind": "story", "label": "Story: Dall’Oste", "text": "In <em>Cajón de herramientas<\/em> (class 3), the change from point A to point B is crucial, and it can be minimal. In Nicolás Verni’s “La Libertad”: “Martín got up from the table and said he was going out for cigarettes. As soon as he shut the front door he felt he had started to run.”"}]}], "quiz": [{"q": "Which of these statements is correct?", "o": ["The want drives the theme; the need, the plot", "The want drives the plot; the need, the theme", "Both drive the plot", "In fiction only the need matters"], "a": 1, "why": "The external want creates the action; the internal need gives it meaning."}, {"q": "A story with a clear need but no want risks:", "o": ["Falling into melodrama", "Having a reactive protagonist and a plot where nothing happens", "Having too many subplots", "Having an unlikable hero"], "a": 1, "why": "The example is <em>Manchester by the Sea<\/em>."}, {"q": "In Shaelin Bishop’s three setups, “sacrifice” means:", "o": ["The character dies", "The external and emotional goals contradict each other", "The character risks being exposed", "The past explains the goal"], "a": 1, "why": "Achieving one goal destroys the other, like Joel choosing between humanity and Ellie."}, {"q": "In Verni’s “La Libertad,” how big is Martín’s change?", "o": ["A lifelong arc", "A gesture: he starts running as soon as he shuts the door", "None: he stays the same", "A change revealed in an epilogue"], "a": 1, "why": "Dall’Oste uses it to show that the move from A to B fits in two sentences."}, {"q": "Why doesn’t piling tragedies on a character create tension?", "o": ["Because readers don’t like sad stories", "Because loss only matters if it is concrete and tied to the character’s motives", "Because tragedy only goes in the climax", "Because it slows the pace"], "a": 1, "why": "Unanchored tragedy reads as melodrama and produces indifference."}], "exercise": {"title": "Genie of the lamp", "text": "Write a story about wishes and the methods for getting them, in the line of Aladdin, Stevenson’s “The Bottle Imp” or Balzac’s <em>The Wild Ass’s Skin<\/em>, where a piece of leather shrinks with every wish. The wish is what the character wants; decide what they need and what the wish hides from them, and how much it costs them."}}, {"n": 6, "name": "Keeping the reader reading", "kicker": "Tension, questions, promises", "intro": "Once there are characters in conflict, the question is why anyone would keep turning the pages. The answer: give the reader enough information to fear and hope, open questions on purpose and keep the promises you make.", "sources": "Shaelin Bishop, *Tension, Stakes &amp; Ambiguity* · Dada Groover, *How to Keep Your Readers Reading* · Dwight Swain · Brandon Sanderson, *Promises, Progress, and Payoffs* · Peter Russell · Chuck Palahniuk, *Consider This* · Patricia Highsmith, *Plotting and Writing Suspense Fiction* · Raymond Carver, *On Writing* · Julio Cortázar, *Some Aspects of the Short Story* · Horacio Quiroga, *Decalogue of the Perfect Short-Story Writer* · Flannery O’Connor, *Mystery and Manners* · Erik Bork, *The Idea*", "sections": [{"h": "Tension", "bullets": ["<strong>Tension comes from information, not from hiding it<\/strong> (Shaelin Bishop). If the reader doesn’t know what is happening or why it matters, they feel no tension: they get confused.", "<strong>Its five materials:<\/strong> possible outcomes that matter; the stakes (tangible and emotional together); urgency and deadlines; an occasion (a party, a meeting) that forces the confrontation; and inevitability, tracks laid so the reader sees the crash coming.", "<strong>Three scales:<\/strong> micro (line by line: subtext, silences, hostility), narrative (the main conflict) and thematic (ideas in conflict).", "<strong>Page tools<\/strong> (Russell): ticking clocks, alternating good and bad news, stakes rising with each exchange.", "<strong>“What’s your clock?” and “Where’s your gun?”<\/strong> (Palahniuk). The clock is anything that limits the length of the story and forces it to end: a pregnancy, a plane’s four engines catching fire one after another, Scarlett O’Hara’s waist. The gun is the threat the reader knows is waiting.", "<strong>Two axes<\/strong> (Palahniuk, after Tom Spanbauer). The horizontal is the succession of plot points; the vertical, the rise in emotional, physical or psychological tension. Limit the elements—you arrive with the same “horses” you set out with—so they build tension.", "<strong>Recycle objects<\/strong> (Palahniuk). Bring out and put away the same object throughout the story: each time it returns, it comes back with a new meaning and marks how the characters have evolved, like O’Connor’s wooden leg.", "<strong>Suspense by denial.<\/strong> Raise a subject and refuse to explore it: “The first rule of fight club is you do not talk about fight club.” And don’t state your theses: the reader wants a gradual discovery.", "<strong>“Every story with a beginning, a middle and an end has suspense”<\/strong> (Highsmith); the suspense story simply has more.", "<strong>Menace<\/strong> (Carver). The feeling that something is about to happen. He starts writing “when I feel a new story threatening me,” and keeps that threat in the text.", "<strong>Tension from the first words<\/strong> (Cortázar): “A story is bad when it is written without that tension that must show itself from the first words or the first scenes.”", "<strong>Don’t protect your characters.<\/strong>"]}, {"h": "Questions and promises", "bullets": ["<strong>Make a question map<\/strong> (Dada Groover). Note which questions each page opens and decide where each is answered: some on the next page, others at the end. Leave a question open only on purpose.", "<strong>Relatable beats likable.<\/strong> The protagonist doesn’t have to be nice, but the reader has to recognize something human in them.", "<strong>Promises, progress, payoffs<\/strong> (Sanderson). The beginning promises a tone, a genre, a plot and a character; the middle has to show progress on each; the ending has to pay off every promise. In <em>Star Wars<\/em>, Han’s return, Luke switching off the targeting computer and the small ship beating the big one pay off three different promises.", "<strong>Every story is change, or the threat of change.<\/strong>"]}], "lamps": [{"title": "Clarity or secrecy?", "verdict": "They don’t contradict each other. The secret logic isn’t hidden information: its pieces are on the page the whole time, in plain sight, and the only thing that changes at the end is their meaning. That is exactly “share the information, not the meaning.”", "sides": [{"kind": "both", "label": "For every form", "text": "Shaelin Bishop: hiding information creates frustration; ambiguity belongs around meaning, decisions and emotions, not around the basic facts. Her advice: share the information, not the meaning."}, {"kind": "story", "label": "Short story", "text": "Guillermo Martínez builds the short story on a secret logic that is only revealed at the end."}]}, {"title": "Do all the questions have to be answered?", "verdict": "Leave the meaning open if you want, but answer the questions about the facts.", "sides": [{"kind": "novel", "label": "Novel", "text": "Groover: you have to answer almost every question you open; leaving one open by oversight frustrates the reader."}, {"kind": "story", "label": "Short story", "text": "Many stories end with an open meaning: what the ending signifies can remain unresolved even when what happened is clear."}]}, {"title": "Write for the audience or for the characters?", "verdict": "Write the draft for the characters’ world. Use the reader-facing tools (question map, stakes, tension) when revising, to check whether that world reaches someone from outside.", "sides": [{"kind": "screen", "label": "Screen and market", "text": "Erik Bork: we’re paid so the audience feels what it came to feel; a viable idea has to be entertaining. Groover: the reader has to be hooked by the sample pages, or they don’t buy the book."}, {"kind": "story", "label": "Short story", "text": "Palahniuk: “I’d tell you to forget about being liked”; tastes change, and a book that stays in someone’s memory finds its audience over time. Quiroga (X): “Don’t think of your friends when you write, or of the impression your story will make. Tell it as if your tale mattered only to the small world of your characters.” O’Connor: “the only reader you can know anything about is yourself.”"}]}], "quiz": [{"q": "According to Shaelin Bishop, hiding basic information from the reader mostly produces:", "o": ["Suspense", "Mystery", "Confusion", "Irony"], "a": 2, "why": "The reader only feels tension when they understand what could go wrong."}, {"q": "Which of these is one of the five materials of tension?", "o": ["An occasion that forces the confrontation", "A likable protagonist", "A twist ending", "First-person narration"], "a": 0, "why": "The others are possible outcomes, stakes, urgency and inevitability."}, {"q": "For Palahniuk, a story’s “clock” is:", "o": ["The time of day when it takes place", "Anything that limits the story and forces it to end", "The narrator’s pace", "A flashback"], "a": 1, "why": "A pregnancy, failing engines, a growing waist: the clock tells the reader the story will end."}, {"q": "What does Carver mean by a story’s “menace”?", "o": ["A violent antagonist", "The feeling that something is about to happen", "A cliffhanger ending", "A dark tone"], "a": 1, "why": "It’s the threat he feels when a story starts, and the tension he keeps in it."}, {"q": "What is a question map?", "o": ["A list of questions for interviewing characters", "A record of which questions each page opens and where each is answered", "A chart of plot points by percentage", "A list of themes"], "a": 1, "why": "It lets you open and close questions on purpose."}, {"q": "Why doesn’t a story’s secret logic break the rule of “sharing information”?", "o": ["Because short stories are exempt", "Because its pieces are in plain sight; only their meaning is revealed late", "Because it is always explained in the first paragraph", "Because in short stories readers prefer to be confused"], "a": 1, "why": "The facts are there; what changes is the logic that links them."}], "exercise": {"title": "Box", "text": "Imagine a story where something is shut inside a box, chest or trunk, and weave the tale around that hidden object. Before you start, make a question map: what the reader knows on each page and when each question is answered. Bring the box back more than once, each time with a new meaning."}}, {"n": 7, "name": "The shape of the whole", "kicker": "From the short story to long forms", "intro": "Only now does structure make sense: a shape that holds characters, scenes and tension. The short story comes first; then the models for long forms, as a reference shelf.", "sources": "Julio Cortázar, *Some Aspects of the Short Story* · Edgar Allan Poe, *The Philosophy of Composition* · Shaelin Bishop, *7 Short Story Tips* · *How to Structure a Short Story*, by the author of *Make Your Story Matter* · Franco Dall’Oste, *Breve teoría del cuento* (classes 1 and 4) · Horacio Quiroga, *Decalogue of the Perfect Short-Story Writer* · Guillermo Martínez, *Eleven Theses* · Chuck Palahniuk, *Consider This* · Patricia Highsmith, *Plotting and Writing Suspense Fiction* · Pablo De Santis, *Contar un secreto* · Erik Bork, *The Idea* · Mary Robinette Kowal, Orson Scott Card’s MICE quotient · Larry Brooks, *Story Engineering* · Peter Russell", "sections": [{"h": "The short story", "bullets": ["<strong>Photograph, not film<\/strong> (Cortázar). The novel accumulates, like a film; the short story crops a fragment so that the crop acts “like an explosion that throws open a much wider reality.” “The novel always wins on points, while the story must win by knockout.”", "<strong>Read in one sitting<\/strong> (Poe). “If any literary work is too long to be read at one sitting, we must be content to dispense with the immensely important effect derivable from unity of impression.”", "<strong>Set up the concept early.<\/strong> A short story has no back cover; the reader needs the situation right away, as in Ling Ma’s “Los Angeles,” which opens with the narrator’s hundred ex-boyfriends living with her.", "<strong>A scaffold to start: the five-paragraph essay.<\/strong> Introduction as inciting incident, body as escalation, conclusion as climax. Use it to get going and then break it.", "<strong>Corner the character<\/strong>, physically or emotionally, so they have to face what they’ve been dodging.", "<strong>Compress.<\/strong> One central conflict, one main setting, a short span, no subplots or flashback scenes: the backstory is barely hinted.", "<strong>Make themes tangible:<\/strong> a repeated physical action (a character who washes again and again) instead of an explanation.", "<strong>The present as a lens on the past.<\/strong> The story traps a character in a narrow window that lights up everything that brought them here.", "<strong>Ten decisions<\/strong> (Franco Dall’Oste, <em>Breve teoría del cuento<\/em>, class 4): point of view, tone and style, time structure, degree of realism, the visible and the hidden story, characterization, atmosphere, ending (closed or open, surprising or confirming), length, and adherence to or subversion of a genre.", "<strong>A decision under pressure<\/strong> (<em>How to Structure a Short Story<\/em>). A short story follows one meaningful choice and the events that lead to it. Put it this way: “In the end, will the protagonist choose A or B?”: safety or risk, truth or comfort, staying or leaving.", "<strong>“In a well-made story, the first three lines are almost as important as the last three”<\/strong> (Quiroga, V).", "<strong>“The beginning is more than half of the whole”<\/strong> (Aristotle, in Martínez’s sixth thesis). That is where point of view, tone, register and the characters’ entrance are decided, and above all “narrative authority”: originality, resolution and writing should already appear in embryo.", "<strong>“Establish your authority, and you can do anything”<\/strong> (Tom Spanbauer, quoted by Palahniuk). “Action has authority in itself”: clear, physical verbs pull the reader along; a speech full of expert detail convinces; getting the small things right makes the incredible inevitable.", "<strong>A story can be minimal<\/strong> (Highsmith): its germ can be as slight as rain washing away the prints on a glass; it can “have only one scene and take place in five minutes or less.”", "<strong>A shape in seven beats<\/strong> (<em>How to Structure a Short Story<\/em>): set the container (0–15%), inciting incident (15–30%), escalation (30–50%), midpoint turn (50%), confrontation (60–70%), the choice (70–85%), consequences (85–100%). End on the final decision, not after, and consider mirroring the opening (from order to rupture, from isolation to connection) so the story closes on itself."]}, {"h": "How the short story changed", "bullets": ["<strong>From the voice to the page<\/strong> (Franco Dall’Oste, <em>Breve teoría del cuento<\/em>, class 1). Oral tales; then <em>One Thousand and One Nights<\/em> and the <em>Decameron<\/em>; with Poe and his theory of unity of effect, the modern short story is born.", "<strong>Three forms<\/strong> (Dall’Oste, class 4). Classic: chronological, omniscient narrator, epiphanic ending. Modern: non-linear time, unreliable narrator, irony, open endings. Postmodern: fragments, parody, self-reference, multiple endings.", "<strong>The Latin American line.<\/strong> Borges; the Boom (Cortázar’s fantastic in the everyday, García Márquez); the post-Boom (Piglia, Bolaño); and today Mariana Enriquez and Samanta Schweblin.", "<strong>The nouvelle, a third form<\/strong> (De Santis). “An uncertain genre,” as Piglia called it: it is defined by what it isn’t. It usually has a frame (someone tells a story another told them), an atmosphere of mystery and melancholy, and an ending that “looks more like a farewell than a slammed door,” the secret often left intact. <em>Bartleby<\/em>, <em>The Metamorphosis<\/em>, Onetti’s <em>Goodbyes<\/em>.", "<strong>“Minor” genres gained respect<\/strong> (Dall’Oste). Horror, science fiction and crime (King, Le Guin, Enriquez) give tools for exploring collective anxieties."]}, {"h": "Long forms (reference shelf)", "bullets": ["<strong>Is the idea viable?<\/strong> Erik Bork, who writes for film and television, reduces it to the central problem and proposes seven tests that spell PROBLEM: Punishing, Relatable, Original, Believable, Life-altering, Entertaining, Meaningful.", "<strong>MICE<\/strong> (Orson Scott Card, in Mary Robinette Kowal’s version): milieu, inquiry, character, event. Each thread opens and closes in its own way: entering and leaving a place, a question asked and answered, an identity that breaks and settles, an order broken and restored. They nest and close in reverse order; endings that keep ending are usually closed out of order.", "<strong>Four quarters<\/strong> (Larry Brooks): setup, response, attack, resolution. Peter Russell’s BMOC places the turns on pages 30, 60, 90 and 110 of a screenplay.", "<strong>Nine classic models:<\/strong> Freytag’s pyramid, the tragic pyramid, the hero’s journey, the plot embryo and its tragic version, the seven-point structure, Aristotle’s <em>Poetics<\/em>, the snowflake method and <em>Save the Cat<\/em>."]}], "lamps": [{"title": "Outlines and page numbers", "verdict": "For a short story, take the long-form models as vocabulary (inciting incident, midpoint turn, climax), not as a timetable.", "sides": [{"kind": "screen", "label": "Screen and novel", "text": "The BMOC (pages 30/60/90/110), the four quarters, <em>Save the Cat<\/em> and the hero’s journey are made for features and novels: long, goal-driven stories with room for subplots and several turns."}, {"kind": "story", "label": "Short story", "text": "The short-story rules forbid subplots, secondary characters and flashback scenes, and prefer depth to forward motion. The seven-beat shape is a scaffold, not a contract. Cortázar’s photograph is the opposite of an outline: a fragment chosen and cropped."}]}], "quiz": [{"q": "Which of these is a rule for not overrunning a short story?", "o": ["Use at least two subplots", "No flashback scenes: the backstory is hinted", "Start with the character’s past", "Change setting in every scene"], "a": 1, "why": "One conflict, one setting, no subplots or flashbacks, and end on the decision."}, {"q": "According to <em>How to Structure a Short Story<\/em>, what does a short story follow?", "o": ["A full transformation", "A decision under pressure", "A whole life", "Several subplots"], "a": 1, "why": "The novel follows a transformation; the short story, a meaningful choice."}, {"q": "Where should a short story end, according to the seven-beat shape?", "o": ["Long after the climax, with an epilogue", "On the final decision, not after", "At the midpoint turn", "When every subplot is resolved"], "a": 1, "why": "The consequences are brief; the story ends on the choice."}, {"q": "In the MICE model, a “milieu” story begins and ends when:", "o": ["A question is asked and answered", "The character enters a place and leaves it", "An order is broken and restored", "The character’s identity breaks and settles"], "a": 1, "why": "The example is <em>Gulliver’s Travels<\/em>."}, {"q": "For Martínez, what is at stake above all in a story’s opening?", "o": ["The ending", "Narrative authority", "The word count", "The title"], "a": 1, "why": "The beginning is “more than half of the whole,” and that’s where the reader decides to trust the narrator."}, {"q": "In Cortázar’s image, how does a short story win?", "o": ["On points", "By knockout", "By disqualification", "In the last round"], "a": 1, "why": "The novel piles up points; the short story has to knock the reader out."}, {"q": "Which model is designed mainly for screenwriting?", "o": ["The seven-beat shape", "The five-paragraph essay", "The BMOC (pages 30/60/90/110)", "The two logics"], "a": 2, "why": "Russell calculates it on the pages of a feature film."}], "exercise": {"title": "Plots", "text": "Choose one of the plot ideas from Nathaniel Hawthorne’s <em>American Notebooks<\/em>, such as “A man possesses the most perfect object a mortal could wish for; in trying to improve it, he ruins it” or “An old mirror. Someone discovers a way to bring back to the surface all the images it reflected in the past.” Write a short story from it: a single container, one decision (A or B), first three lines that already point to the ending, and end on the choice."}}, {"n": 8, "name": "Two stories, two logics", "kicker": "What a short story holds inside", "intro": "It is the last step, and it comes from the Spanish-language tradition. It explains why a story can feel like an anecdote with a surprise, and what makes it work instead: a hidden story under the visible one, and an ending that feels inevitable, not merely surprising.", "sources": "Ricardo Piglia, *Theses on the Short Story* and prologue to Rodolfo Walsh’s *Cuentos completos* · Guillermo Martínez, *Eleven Theses (and Antitheses) on Writing Fiction* and “El cuento como sistema lógico” · Pablo De Santis, *Contar un secreto* · Franco Dall’Oste, *Breve teoría del cuento* (classes 1, 3 and 4) · Flannery O’Connor, *Mystery and Manners* · Julio Cortázar, *Some Aspects of the Short Story* · Felisberto Hernández, *False Explanation of My Stories* · Raymond Carver, *On Writing* · Patricia Highsmith, *Plotting and Writing Suspense Fiction* · E. M. Forster, *Aspects of the Novel* · Juan José Saer, *The Concept of Fiction*", "sections": [{"h": "Two stories and the iceberg", "bullets": ["<strong>“A story always tells two stories”<\/strong> (Piglia, <em>Theses on the Short Story<\/em>). Chekhov noted: “A man in Monte Carlo goes to the casino, wins a million, returns home, commits suicide.” The story of the gambling is in the foreground; the story of the suicide is built in secret.", "<strong>“The short-story writer’s art lies in knowing how to encode story 2 in the interstices of story 1.”<\/strong> Each story has its own causality: “The same events enter simultaneously into two antagonistic narrative logics,” and the essential elements serve a double function. In Borges’s “Death and the Compass,” the popular edition of the <em>History of the Hasidic Sect<\/em> that a shopkeeper publishes looks like an ironic coincidence in story 1 and is indispensable in story 2. “What is superfluous in one story is basic in the other.”", "<strong>The secret story is a story, not a hidden meaning.<\/strong> “It isn’t a hidden meaning that depends on interpretation: the enigma is nothing but a story told in an enigmatic way.” The technical problem of the short story is “How do you tell one story while telling another?”", "<strong>The classic version and the modern one.<\/strong> In Poe and Quiroga, “the surprise effect comes when the end of the secret story surfaces.” From Chekhov, Mansfield and the Joyce of <em>Dubliners<\/em> on, the tension between the two is never resolved: “the modern story tells two stories as if they were one.” Kafka inverts the procedure: he tells the secret story clearly and makes the visible one enigmatic.", "<strong>The iceberg<\/strong> (Hemingway): “the most important thing is never told.” In “Big Two-Hearted River,” the war never appears and the story seems to be the description of a fishing trip. According to Piglia, Hemingway would tell the casino in full detail and never say the man is going to kill himself, “but he would write the story as if the reader already knew it.”", "<strong>The art of ellipsis<\/strong> (Piglia on Walsh). For Walsh, “fiction is the art of ellipsis, it works with allusion and the unsaid.” In “Fotos” and “Cartas,” the political and social tensions are implicit: “Walsh practices the iceberg technique à la Hemingway: the most important thing in a story is what isn’t narrated.”", "<strong>Deferred juxtaposition<\/strong> (Joyce, quoted by Piglia): “A word we don’t even notice, an insignificant fact that takes up one line, finds its echo ten pages later.” That is how the hidden story is sown.", "<strong>Where stories come from<\/strong> (Walter Benjamin, in class 3 of Franco Dall’Oste’s <em>Breve teoría del cuento<\/em>). The peasant tells stories of his land and makes the everyday strange; the sailor brings stories from afar and makes the exotic familiar. Piglia updates them: the investigation of a crime and the journey."]}, {"h": "Anecdote and short story", "bullets": ["<strong>An anecdote is a sequence of actions with a surprising ending<\/strong> (“You won’t believe what happened to me yesterday”). It works best when the ending, besides surprising, recasts what came before; in that it resembles the short story.", "<strong>The short story is a system of two logics<\/strong> (Guillermo Martínez, “El cuento como sistema lógico”). One surface logic, initial, tied to common sense, which the reader accepts at first; and a secret, final one that gains ground and recasts every element. Martínez prefers this idea to Piglia’s two stories, “because often there isn’t really a second story at all, only a different light cast on the facts.”", "<strong>The ending as displacement<\/strong> (Martínez, eleventh thesis). The ending “must propose a displacement with respect to what has been told, one that gathers, recasts or lights in a different way everything read.” It doesn’t necessarily imply surprise—“a rabbit pulled out of a hat at the last moment,” as Heker would say—“but it does imply a turn not wholly expected that nonetheless imposes itself on the reader as necessary”: the “necessity and wonder of the solution” Borges asked of the detective story. Often the story’s first germ already contains that turn.", "<strong>An artifact built for its ending<\/strong> (De Santis). Since Poe, the modern short story has been built for its ending: “The ending isn’t a mere conclusion: it is the star, the sign of conviction, the secret of the architecture.” In the novel, by contrast, the ending can be just the action dying out.", "<strong>The effect is fatal, not surprising.<\/strong> The ending must feel inexorable and necessary. There is surprise, but it lies in discovering the secret logic, under which the surface details take on another meaning.", "<strong>Where the second logic lives.<\/strong> In the details (objects, people and their traits, the way actions are carried out) and in the structure (the narrator, the focus, the textual genre).", "<strong>The diagnosis:<\/strong> stories that feel like anecdotes usually have a secret logic that is unclear, incomplete or missing."]}, {"h": "Causality and plausibility", "bullets": ["<strong>Causality, not chronology<\/strong> (E. M. Forster, George Saunders). “The king died and then the queen died” is a sequence; “the king died, and then the queen died of grief” is a plot.", "<strong>Work backwards<\/strong> (Jeff Kitchen). Start from the ending and ask what had to cause it, and what caused that.", "<strong>Inexorability<\/strong> (Marina Arias). A story is meaningful if, on reaching the end, it rings with “of course, nothing else could have happened.”", "<strong>Plant early.<\/strong> If a skill, an object or a trait resolves the ending, it has to have appeared long before; as a rule of thumb, at least three scenes earlier, so the reader doesn’t feel cheated.", "<strong>Plausibility is internal coherence<\/strong>, not historical truth. Nabokov asks that the world, even if as unreal as Gogol’s, be believable for as long as the reading lasts.", "<strong>The fantastic doesn’t require a magic object<\/strong> (Martínez, tenth thesis). It can be “a hypothesis more convincing than any realist explanation,” “an atmosphere of strangeness, an alteration of the mental faculties, an accumulation of coincidences, or a simple change of point of view.” You have to set up warning signs and, if there is a transgression of the real, “it’s best that the transgression be single.”", "<strong>The reading pact<\/strong> (Franco Dall’Oste, <em>Breve teoría del cuento<\/em>, class 1). In fiction, the pact is that what is told didn’t really happen; the reader judges it by what is plausible, not by what is true. “Fiction does not renounce reality, but verification.” As Saer says: “Fiction does not ask to be believed as truth, but as fiction.”"]}, {"h": "Significance", "bullets": ["<strong>“A story is a way to say something that can’t be said any other way”<\/strong> (O’Connor). “The meaning of fiction is not abstract meaning but experienced meaning.”", "<strong>“A story is a complete dramatic action”<\/strong> (O’Connor), and “a good short story should not have less meaning than a novel.”", "<strong>Significance<\/strong> (Cortázar). A domestic episode, as in Chekhov or Katherine Mansfield, can radiate far beyond itself: “A story is significant when it breaks its own limits with that explosion of spiritual energy that suddenly lights up something that goes far beyond the small and sometimes wretched anecdote it tells.” It doesn’t depend only on the subject, but on the intensity and tension with which it is treated.", "<strong>Original and familiar at once<\/strong> (Marina Arias, quoted by Franco Dall’Oste). A meaningful fiction feels unheard-of and known at the same time, and opens a particular case toward something universal."]}, {"h": "Inventing and testing two logics", "bullets": ["<strong>Three starting points.<\/strong> From a <em>scene<\/em>: take a strict protocol and literalize its rule. From a <em>theme<\/em>: let the metaphor become matter. From an <em>image<\/em>: give a common object a hidden law.", "<strong>A template.<\/strong> <em>The facade<\/em>: the protagonist attempts an everyday action using an object or a technical skill. <em>The virus<\/em>: without their knowing, that object runs on an inverted law or a literal metaphor. <em>The crash<\/em>: if they achieve their surface goal, they inevitably suffer the fatal consequence.", "<strong>Study the models:<\/strong> “The Monkey’s Paw” (W. W. Jacobs), “Lamb to the Slaughter” (Roald Dahl), “The Feather Pillow” (Quiroga), “The Circular Ruins” (Borges), “Axolotl” (Cortázar). In each, name the surface logic and the secret one.", "<strong>Revision.<\/strong> Ask a demanding reader to mark where the initial logic feels forced and where the ending looks like a cheap surprise instead of an inevitable consequence."]}], "lamps": [{"title": "Payoff or fatality?", "verdict": "Both endings keep a promise. The difference is which one: the screenplay pays off the character’s plan; the short story pays off the story’s logic.", "sides": [{"kind": "screen", "label": "Screen and novel", "text": "Sanderson’s “standing ovation” payoff and Russell’s climax reward the hero: want and need come together, and the plan works."}, {"kind": "story", "label": "Short story", "text": "In the two-logics model, the ending is a fatality: the secret logic closes over the character, often because of their own surface goal. The pleasure is recognition, not triumph."}]}, {"title": "Where does meaning come from?", "verdict": "Levels 2 to 5 give you the protagonist’s plan; level 8, the trap. Many of the strongest stories use both: a clear surface goal that the secret logic turns into the instrument of the character’s undoing.", "sides": [{"kind": "screen", "label": "Screenwriting", "text": "A screenplay is designed from the outside in: goals, obstacles and a causal chain driven by desire."}, {"kind": "story", "label": "Short story", "text": "A short story is designed from the inside out, around a closed situation or a crisis and a single revealing moment. In the Latin American tradition, the trap (social, metaphysical, physical) often replaces the protagonist’s plan."}]}, {"title": "Suggest or omit?", "verdict": "Piglia settles it: the secret story is told, only encoded, in details that work in both stories. If the reader finds no trace of what you left out, it isn’t an iceberg: it’s a hole.", "sides": [{"kind": "story", "label": "Story: Hemingway, Piglia on Walsh", "text": "The most important thing is never told; the secret story is built “with the unsaid, with implication and allusion.”"}, {"kind": "story", "label": "Story: O’Connor", "text": "The beginner “thinks that when he leaves something out he is being subtle,” but “you can’t find anything in a text that hasn’t been put there somehow.” “Being short does not mean being slight.”"}]}, {"title": "Two stories or one logic seen twice?", "verdict": "Use Piglia’s model when something really happens out of sight: a crime, a trap, a plan. Use Martínez’s when the facts are the same and the only thing that flips at the end is their meaning.", "sides": [{"kind": "story", "label": "Story: Piglia", "text": "Every story tells two stories, and the secret one is a complete story told in the interstices of the visible one: the suicide behind the million won at the casino."}, {"kind": "story", "label": "Story: Martínez", "text": "Often there isn’t a complete second story, “only a different light cast on the facts”: two systems of causality, “or rather, one logic split in two.”"}]}, {"title": "One logic, or none?", "verdict": "Read Felisberto to the end: the plant “will not know its laws, though it has them deeply and consciousness does not reach them.” The logic can be discovered instead of designed, but a story that works has one.", "sides": [{"kind": "story", "label": "Story: Martínez and Poe", "text": "The short story is a logical system: a surface logic, a secret one, and causal links that make the ending necessary. Poe plans the whole mechanism from the dénouement."}, {"kind": "story", "label": "Story: Felisberto Hernández", "text": "“My stories have no logical structures.” He waits for the story to grow on its own and distrusts the intentions his consciousness tries to impose on it."}]}, {"title": "Twist ending or no tricks?", "verdict": "They reject the same thing: an ending that makes the reader feel cheated. Martínez asks for a turn not wholly expected that becomes necessary, not a rabbit pulled out of a hat. If the ending recasts what was already on the page, it isn’t a trick.", "sides": [{"kind": "story", "label": "Story: Carver, Highsmith", "text": "Carver: “At the first sign of a trick or a gimmick in a piece of fiction, a cheap trick or even an elaborate trick, I tend to look for cover.” Highsmith calls it “the personal school as opposed to the gimmick school”: gimmicks are clever ideas anyone can invent and have nothing to do with literature; “good short stories are made only of the writer’s emotions.”"}, {"kind": "story", "label": "Story: the secret-logic models", "text": "“The Monkey’s Paw,” “Lamb to the Slaughter” and “The Feather Pillow” turn on a final revelation, and Dall’Oste’s list of short-story traits includes an ending that seeks to “surprise or recontextualize what came before.”"}]}], "quiz": [{"q": "According to Piglia, every short story:", "o": ["Has a twist ending", "Tells two stories, one visible and one secret", "Must be read in one sitting", "Is narrated in first person"], "a": 1, "why": "The secret story surfaces bit by bit and gives meaning to the visible one."}, {"q": "In Piglia’s reading of “Death and the Compass,” the shopkeeper’s book:", "o": ["Is a red herring with no function", "Looks like a coincidence in the visible story and is indispensable in the secret one", "Is a symbol of faith", "Reveals the killer on the first page"], "a": 1, "why": "“What is superfluous in one story is basic in the other.”"}, {"q": "What does O’Connor say about suggesting and omitting?", "o": ["That they’re the same", "That suggesting isn’t omitting: nothing is in a text that wasn’t put there", "That you should always omit the ending", "That omission is the soul of brevity"], "a": 1, "why": "She warns that leaving things out isn’t subtlety."}, {"q": "According to Martínez, a fantastic story should:", "o": ["Multiply the marvels", "Transgress reality only once, after setting up signs", "Always include a magic object", "Explain the supernatural at the end"], "a": 1, "why": "Following Borges: avoid multiplying marvels."}, {"q": "For Martínez, the ideal ending is:", "o": ["A total surprise", "A turn not wholly expected that imposes itself as necessary", "An open question", "An epilogue that ties every thread"], "a": 1, "why": "Borges’s “necessity and wonder of the solution.”"}, {"q": "According to Saer, fiction renounces:", "o": ["Reality", "Verification", "Meaning", "Characters"], "a": 1, "why": "Fiction asks to be believed as fiction; it deals with the real world but can’t be checked against it."}, {"q": "What turns an anecdote into a short story, in this model?", "o": ["Greater length", "A secret logic that recasts every element at the end", "A happy ending", "More dialogue"], "a": 1, "why": "The ending has to recast, not just surprise."}, {"q": "The ending of a well-built short story should feel, above all:", "o": ["Shocking", "Ambiguous", "Inexorable and necessary", "Hopeful"], "a": 2, "why": "Fatal, inexorable, necessary, and not merely surprising."}, {"q": "In Forster’s example, which sentence is a plot and not a sequence?", "o": ["The king died and then the queen died", "The queen died, then the king", "The king died, and then the queen died of grief", "The king and queen died"], "a": 2, "why": "“Of grief” adds the causality."}, {"q": "In the facade, virus and crash template, “the virus” is:", "o": ["The antagonist", "The hidden law the common object secretly follows", "The fatal ending", "A midpoint twist"], "a": 1, "why": "Facade, virus, crash: the virus is the secret rule."}], "exercise": {"title": "Fantastic", "text": "Write a short fantastic story that starts from a real situation and ends in a supernatural one. Choose one of the classic themes: the discovery of an impossible object, time travel without a machine, a human turning into an animal, body parts that take on a life of their own, nature acquiring a will. Transgress reality only once, plant the signs early, and use the facade, virus and crash template to give it two logics."}}]} };

function scoreText(L) {
  const s = scoreOf(L);
  if (!s.done) return { t: "—", done: false };
  if (s.done < s.total) return { t: `${s.done}/${s.total}`, done: false };
  return { t: `${s.right}/${s.total} ✓`, done: true };
}

function renderChrome() {
  document.documentElement.lang = LANG;
  document.getElementById("brandLabel").textContent = T.tagline;
  document.getElementById("brandTitle").textContent = D.title;
  document.getElementById("saveNote").textContent = T.saveNote;
  document.getElementById("stairs").setAttribute("aria-label", T.levels);
  document.getElementById("menuBtn").textContent = T.levels;
  document.querySelectorAll("[data-lang-toggle]").forEach((b) => {
    b.innerHTML = `<span class="${LANG === "es" ? "on" : ""}">ES</span><span class="sep">/</span><span class="${LANG === "en" ? "on" : ""}">EN</span>`;
    b.setAttribute("aria-label", T.toOther);
    b.title = T.toOther;
  });
  paintToggles();
}

function renderNav(cur) {
  const items = [`<li><a class="home" href="#start" style="--step:0" ${cur === "start" ? 'aria-current="page"' : ""}><span class="num">·</span><span>${T.start}</span><span></span></a></li>`]
    .concat(D.levels.map((L) => {
      const s = scoreText(L);
      return `<li><a href="#level-${L.n}" style="--step:${L.n}" ${cur === L.n ? 'aria-current="page"' : ""}><span class="num">${L.n}</span><span>${L.name}</span><span class="score ${s.done ? "done" : ""}">${s.t}</span></a></li>`;
    }));
  document.getElementById("steps").innerHTML = items.join("");
  document.getElementById("where").innerHTML = cur === "start" ? D.title : `<b>${cur}</b>${D.levels[cur].name}`;
}

function lampHTML(l) {
  return `<aside class="lamp">
    <div class="lamp-head">${LAMP_SVG}<span class="label">${T.lampHead}</span></div>
    <h3>${l.title}</h3>
    <div class="sides">${l.sides.map((s) => `<div class="side"><span class="chip k-${s.kind}">${s.label}</span><p>${s.text}</p></div>`).join("")}</div>
    <p class="verdict"><b>${T.choose}</b>${l.verdict}</p>
  </aside>`;
}

function quizHTML(L) {
  const a = answers[L.n] || {};
  const s = scoreOf(L);
  const qs = L.quiz.map((q, i) => {
    const chosen = a[i];
    const answered = chosen != null;
    const opts = q.o.map((o, j) => {
      let cls = "", mark = "";
      if (answered) {
        if (j === q.a) { cls = "is-right"; mark = "✓"; }
        else if (j === chosen) { cls = "is-wrong"; mark = "✗"; }
        else cls = "is-dim";
      }
      return `<button class="opt ${cls}" id="q${L.n}-${i}-${j}" data-q="${i}" data-o="${j}" ${answered ? "disabled" : ""}><span class="l">${LETTERS[j]})</span><span>${o}</span><span class="mark">${mark}</span></button>`;
    }).join("");
    const fb = answered
      ? `<p class="why" style="--fb: var(--${chosen === q.a ? "right" : "wrong"})" role="status"><b>${chosen === q.a ? T.right : T.wrong(LETTERS[q.a])}</b> ${q.why}</p>`
      : "";
    return `<div class="q"><p class="q-text"><span>${i + 1}</span><span>${q.q}</span></p><div class="opts">${opts}</div>${fb}</div>`;
  }).join("");
  const result = s.done === s.total
    ? `<div class="result"><p><strong>${T.result(s.right, s.total)}</strong> ${s.right === s.total ? T.allRight : T.someWrong}</p><button class="btn" data-reset="${L.n}">${T.retry}</button></div>`
    : "";
  return `<section class="quiz" aria-labelledby="quiz-${L.n}">
    <div class="quiz-head"><h2 id="quiz-${L.n}">${T.quizTitle}</h2><span class="tally">${T.tally(s.done, s.total, s.right)}</span></div>
    ${qs}${result}</section>`;
}

function levelHTML(L) {
  const prev = L.n === 0 ? { href: "#start", name: T.start, lab: T.back } : { href: `#level-${L.n - 1}`, name: `${L.n - 1} · ${D.levels[L.n - 1].name}`, lab: T.prevLevel };
  const next = D.levels[L.n + 1] ? { href: `#level-${L.n + 1}`, name: `${L.n + 1} · ${D.levels[L.n + 1].name}`, lab: T.nextLevel } : null;
  return `
    <span class="label eyebrow">${T.levelOf(L.n, D.levels.length - 1)}</span>
    <p class="bignum" aria-hidden="true">${L.n}</p>
    <h1>${L.name}</h1>
    <p class="kicker">${L.kicker}</p>
    <p class="intro">${L.intro}</p>
    ${L.sections.map((s) => `<h2>${s.h}</h2><ul class="points">${s.bullets.map((b) => `<li>${b}</li>`).join("")}</ul>`).join("")}
    ${L.lamps.map(lampHTML).join("")}
    <p class="sources"><span class="label">${T.sources}</span><em>${titles(L.sources)}</em></p>
    <div id="quizwrap">${quizHTML(L)}</div>
    ${L.exercise ? `<section class="exercise" aria-labelledby="ex-${L.n}"><div class="ex-head"><span class="label ex-tag">${T.write}</span><span class="label ex-src">${T.promptSrc}</span></div><h2 id="ex-${L.n}">${L.exercise.title}</h2><p>${L.exercise.text}</p></section>` : ""}
    <div class="pager">
      <a href="${prev.href}"><span class="label">${prev.lab}</span><span class="pn">${prev.name}</span></a>
      ${next ? `<a class="next" href="${next.href}"><span class="label">${next.lab}</span><span class="pn">${next.name}</span></a>` : ""}
    </div>`;
}

function homeHTML() {
  let right = 0, total = 0, done = 0;
  D.levels.forEach((L) => { const s = scoreOf(L); right += s.right; total += s.total; done += s.done; });
  return `
    <span class="label eyebrow">${T.tagline}</span>
    <h1 class="home-title">${D.title}</h1>
    <p class="home-sub">${D.subtitle}</p>
    <div class="prose">${D.howTo.map((p) => `<p>${p}</p>`).join("")}</div>
    <aside class="lamp">
      <div class="lamp-head">${LAMP_SVG}<span class="label">${T.aboutLamps}</span></div>
      <p style="margin:0">${D.lampLegend}</p>
      <div class="legend">${Object.keys(T.kinds).map((k) => `<span class="chip k-${k}">${T.kinds[k]}</span>`).join("")}</div>
    </aside>
    <h2>${T.staircase}</h2>
    <ul class="staircase">${D.levels.map((L) => { const s = scoreText(L); return `<li><a href="#level-${L.n}" style="--step:${L.n}"><span class="n">${L.n}</span><span class="t">${L.name}<em>${L.kicker}</em></span><span class="score ${s.done ? "done" : ""}">${s.t}</span></a></li>`; }).join("")}</ul>
    <div class="totals"><span>${T.totals(done, total, right)}</span>${done ? `<button class="btn" data-reset="all">${T.resetAll}</button>` : ""}</div>
    <p class="leftout">${D.leftOut}</p>`;
}

function current() {
  const m = /^#level-(\d)$/.exec(location.hash);
  if (m && D.levels[+m[1]]) return +m[1];
  return "start";
}

function render(scrollTop = true) {
  const cur = current();
  renderChrome();
  renderNav(cur);
  document.getElementById("view").innerHTML = cur === "start" ? homeHTML() : levelHTML(D.levels[cur]);
  document.title = cur === "start" ? D.title : `${cur} · ${D.levels[cur].name} — ${D.title}`;
  if (scrollTop) window.scrollTo(0, 0);
  closeMenu();
}

function rerenderQuiz(n) {
  const wrap = document.getElementById("quizwrap");
  if (wrap) wrap.innerHTML = quizHTML(D.levels[n]);
  renderNav(n);
}

document.addEventListener("click", (e) => {
  const lt = e.target.closest("[data-lang-toggle]");
  if (lt) {
    LANG = LANG === "es" ? "en" : "es"; D = DATA[LANG]; T = UI[LANG];
    try { localStorage.setItem(LANG_KEY, LANG); } catch (err) {}
    render(false);
    return;
  }
  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled) {
    const n = current(); const qi = +opt.dataset.q; const oi = +opt.dataset.o;
    answers[n] = answers[n] || {}; answers[n][qi] = oi; save();
    rerenderQuiz(n);
    const again = document.getElementById(`q${n}-${qi}-${oi}`); if (again) again.focus({ preventScroll: true });
    return;
  }
  const r = e.target.closest("[data-reset]");
  if (r) {
    if (r.dataset.reset === "all") { answers = {}; save(); render(false); }
    else { delete answers[+r.dataset.reset]; save(); rerenderQuiz(+r.dataset.reset); document.getElementById(`quiz-${r.dataset.reset}`)?.scrollIntoView({ behavior: "smooth", block: "start" }); }
  }
});

const THEME_KEY = "escalera-tema";
const SUN = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
function effectiveTheme() { return document.documentElement.dataset.theme || (darkQuery.matches ? "dark" : "light"); }
function paintToggles() {
  const dark = effectiveTheme() === "dark";
  document.querySelectorAll("[data-theme-toggle]").forEach((b) => {
    b.innerHTML = (dark ? SUN : MOON) + `<span>${dark ? T.light : T.dark}</span>`;
    b.setAttribute("aria-label", dark ? T.toLight : T.toDark);
  });
}
document.documentElement.dataset.theme = "light";
try { const t = localStorage.getItem(THEME_KEY); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
document.querySelectorAll("[data-theme-toggle]").forEach((b) => b.addEventListener("click", () => {
  const next = effectiveTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  paintToggles();
}));
darkQuery.addEventListener("change", paintToggles);

const menuBtn = document.getElementById("menuBtn");
const nav = document.getElementById("stairs");
const narrow = window.matchMedia("(max-width: 860px)");
function closeMenu() { if (narrow.matches) { nav.hidden = true; menuBtn.setAttribute("aria-expanded", "false"); } }
function syncNav() { nav.hidden = narrow.matches; menuBtn.setAttribute("aria-expanded", "false"); }
menuBtn.addEventListener("click", () => { const open = nav.hidden; nav.hidden = !open; menuBtn.setAttribute("aria-expanded", String(open)); });
narrow.addEventListener("change", syncNav);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
window.addEventListener("hashchange", () => render(true));
syncNav();
render(false);
</script>
</body>
</html>
