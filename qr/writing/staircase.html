"Una lista de preguntas para entrevistar a los personajes", "Un registro de qué preguntas abre cada página y dónde se responde cada una", "Un gráfico de puntos de giro por porcentaje", "Una lista de temas"], "a": 1, "why": "Permite abrir y cerrar preguntas a propósito."}, {"q": "¿Por qué la lógica secreta de un cuento no rompe la regla de «compartir información»?", "o": ["Porque los cuentos están exentos", "Porque sus piezas están a la vista; solo su sentido se revela tarde", "Porque siempre se explica en el primer párrafo", "Porque en el cuento el lector prefiere confundirse"], "a": 1, "why": "Los hechos están; lo que cambia es la lógica que los une."}], "exercise": {"title": "Caja", "text": "Imaginá una historia donde hay algo encerrado en una caja, cofre o baúl, y tejé el relato alrededor de ese objeto escondido. Antes de empezar, hacé un mapa de preguntas: qué sabe el lector en cada página y cuándo se responde cada pregunta. Hacé volver la caja más de una vez, cada vez con un sentido nuevo."}}, {"n": 7, "name": "La estructura del todo", "kicker": "Del cuento a las formas largas", "intro": "Recién ahora la estructura tiene sentido: una forma que sostiene personajes, escenas y tensión. Primero va el cuento; después, los modelos de las formas largas, como estante de consulta.", "sources": "Julio Cortázar, *Algunos aspectos del cuento* · Edgar Allan Poe, *Filosofía de la composición* · Shaelin Bishop, *7 Short Story Tips* · *How to Structure a Short Story*, de la autora de *Make Your Story Matter* · Franco Dall’Oste, *Breve teoría del cuento* (clases 1 y 4) · Horacio Quiroga, *Decálogo del perfecto cuentista* · Guillermo Martínez, *Once tesis* · Chuck Palahniuk, *Plantéate esto* · Patricia Highsmith, *Suspense* · Pablo De Santis, *Contar un secreto* · Erik Bork, *The Idea* · Mary Robinette Kowal, el cociente MICE de Orson Scott Card · Larry Brooks, *Story Engineering* · Peter Russell", "sections": [{"h": "El cuento", "bullets": ["<strong>Fotografía, no cine<\/strong> (Cortázar). La novela acumula, como una película; el cuento recorta un fragmento de manera tal que ese recorte actúe «como una explosión que abre de par en par una realidad mucho más amplia». «La novela gana siempre por puntos, mientras que el cuento debe ganar por knock-out».", "<strong>Que se lea de una sola vez<\/strong> (Poe). «Si una obra literaria es demasiado extensa para ser leída en una sola sesión, debemos resignarnos a quedar privados del efecto, soberanamente decisivo, de la unidad de impresión».", "<strong>Planteá el concepto temprano.<\/strong> Un cuento no tiene contratapa; el lector necesita la situación enseguida, como en «Los Ángeles», de Ling Ma, que empieza: «Mis cien exnovios viven conmigo».", "<strong>Un andamio para empezar: el ensayo de cinco párrafos.<\/strong> Introducción como hecho detonante, desarrollo como escalada, conclusión como clímax. Usalo para arrancar y después rompelo.", "<strong>Acorralá al personaje<\/strong>, física o emocionalmente, para que tenga que enfrentar lo que viene esquivando.", "<strong>Comprimí.<\/strong> Un conflicto central, un escenario principal, un lapso breve, sin subtramas ni escenas retrospectivas: la historia previa apenas se sugiere.", "<strong>Volvé tangibles los temas:<\/strong> una acción física repetida (un personaje que se lava una y otra vez) en lugar de una explicación.", "<strong>El presente como lente del pasado.<\/strong> El cuento atrapa a un personaje en una ventana estrecha que ilumina todo lo que lo trajo hasta ahí.", "<strong>Diez decisiones<\/strong> (Franco Dall’Oste, <em>Breve teoría del cuento<\/em>, clase 4): punto de vista, tono y estilo, estructura temporal, grado de realismo, la historia visible y la oculta, caracterización, atmósfera, final (cerrado o abierto, sorprendente o confirmatorio), extensión, y adhesión o subversión de un género.", "<strong>Una decisión bajo presión<\/strong> (<em>How to Structure a Short Story<\/em>). Un cuento sigue una elección significativa y los hechos que llevan a ella. Formulala así: «Al final, ¿el protagonista va a elegir A o B?»: seguridad o riesgo, verdad o comodidad, quedarse o irse.", "<strong>«En un cuento bien logrado, las tres primeras líneas tienen casi la importancia de las tres últimas»<\/strong> (Quiroga, V).", "<strong>«El principio es más de la mitad del todo»<\/strong> (Aristóteles, en la sexta tesis de Martínez). Ahí se deciden el punto de vista, el tono, el registro y la entrada de los personajes, y sobre todo la «autoridad narrativa»: originalidad, resolución y escritura ya deberían aparecer en ciernes.", "<strong>«Establece tu autoridad, y podrás hacer lo que quieras»<\/strong> (Tom Spanbauer, citado por Palahniuk). «La acción posee autoridad en sí misma»: los verbos claros y físicos arrastran al lector; un discurso lleno de detalle experto convence; acertar con las cosas pequeñas vuelve inevitable lo increíble.", "<strong>Un cuento puede ser mínimo<\/strong> (Highsmith): su germen puede ser tan leve como la lluvia que borra las huellas de una copa; puede «tener sólo una escena y ocurrir en cinco minutos o menos».", "<strong>Una forma en siete tiempos<\/strong> (<em>How to Structure a Short Story<\/em>): fijar el recipiente (0–15 %), hecho detonante (15–30 %), escalada (30–50 %), giro de la mitad (50 %), enfrentamiento (60–70 %), la elección (70–85 %), consecuencias (85–100 %). Terminá en la decisión final, no después, y considerá reflejar el comienzo (del orden a la ruptura, del aislamiento al vínculo) para que el cuento se cierre sobre sí mismo."]}, {"h": "Cómo fue cambiando el cuento", "bullets": ["<strong>De la voz a la página<\/strong> (Franco Dall’Oste, <em>Breve teoría del cuento<\/em>, clase 1). Los relatos orales; después <em>Las mil y una noches<\/em> y el <em>Decamerón<\/em>; con Poe y su teoría de la unidad de efecto nace el cuento moderno.", "<strong>Tres formas<\/strong> (Dall’Oste, clase 4). Clásico: cronológico, narrador omnisciente, final epifánico. Moderno: tiempo no lineal, narrador poco confiable, ironía, finales abiertos. Posmoderno: fragmentos, parodia, autorreferencia, finales múltiples.", "<strong>La línea latinoamericana.<\/strong> Borges; el boom (lo fantástico en lo cotidiano de Cortázar, García Márquez); el posboom (Piglia, Bolaño); y hoy Mariana Enriquez y Samanta Schweblin.", "<strong>La nouvelle, una tercera forma<\/strong> (De Santis). «Un género incierto», como la llamó Piglia: se define por lo que no es. Suele tener marco (alguien cuenta una historia que otro le contó), una atmósfera de misterio y melancolía, y un final que «se parece más a una despedida que a un portazo», con el secreto muchas veces intacto. <em>Bartleby<\/em>, <em>La metamorfosis<\/em>, <em>Los adioses<\/em> de Onetti.", "<strong>Los géneros «menores» ganaron respeto<\/strong> (Dall’Oste). El terror, la ciencia ficción y el policial (King, Le Guin, Enriquez) dan herramientas para explorar ansiedades colectivas."]}, {"h": "Las formas largas (estante de consulta)", "bullets": ["<strong>¿La idea es viable?<\/strong> Erik Bork, que escribe para cine y televisión, la reduce al problema central y propone siete pruebas que en inglés forman la palabra PROBLEM: que castigue al personaje, que sea reconocible, original, creíble, que le cambie la vida, entretenida y significativa.", "<strong>MICE<\/strong> (Orson Scott Card, en la versión de Mary Robinette Kowal): medio, pregunta, personaje, evento. Cada hilo se abre y se cierra de una manera: entrar y salir de un lugar, una pregunta que se plantea y se responde, una identidad que se quiebra y se asienta, un orden que se rompe y se restablece. Se anidan y se cierran en orden inverso; los finales que terminan una y otra vez suelen estar cerrados fuera de orden.", "<strong>Cuatro cuartos<\/strong> (Larry Brooks): planteo, respuesta, ataque, resolución. El BMOC de Peter Russell ubica los giros en las páginas 30, 60, 90 y 110 de un guion.", "<strong>Nueve modelos clásicos:<\/strong> la pirámide de Freytag, la pirámide trágica, el viaje del héroe, el embrión de trama y su versión trágica, la estructura de siete puntos, la <em>Poética<\/em> de Aristóteles, el método del copo de nieve y <em>Save the Cat<\/em>."]}], "lamps": [{"title": "Escaletas y números de página", "verdict": "Para un cuento, tomá los modelos de las formas largas como vocabulario (hecho detonante, giro de la mitad, clímax), no como cronograma.", "sides": [{"kind": "screen", "label": "Guion y novela", "text": "El BMOC (páginas 30/60/90/110), los cuatro cuartos, <em>Save the Cat<\/em> y el viaje del héroe están hechos para largometrajes y novelas: historias largas, movidas por objetivos, con lugar para subtramas y varios giros."}, {"kind": "story", "label": "Cuento", "text": "Las reglas del cuento prohíben las subtramas, los personajes secundarios y las escenas retrospectivas, y prefieren la profundidad al avance. La forma en siete tiempos es un andamio, no un contrato. La fotografía de Cortázar es lo contrario de una escaleta: un fragmento elegido y recortado."}]}], "quiz": [{"q": "¿Cuál de estas es una regla para no pasarse de largo en un cuento?", "o": ["Usar al menos dos subtramas", "Nada de escenas retrospectivas: la historia previa se sugiere", "Empezar por el pasado del personaje", "Cambiar de escenario en cada escena"], "a": 1, "why": "Un conflicto, un escenario, sin subtramas ni flashbacks, y terminar en la decisión."}, {"q": "Según <em>How to Structure a Short Story<\/em>, ¿qué sigue un cuento?", "o": ["Una transformación completa", "Una decisión bajo presión", "Una vida entera", "Varias subtramas"], "a": 1, "why": "La novela sigue una transformación; el cuento, una elección significativa."}, {"q": "¿Dónde tiene que terminar un cuento, según la forma en siete tiempos?", "o": ["Mucho después del clímax, con un epílogo", "En la decisión final, no después", "En el giro de la mitad", "Cuando se resuelven todas las subtramas"], "a": 1, "why": "Las consecuencias son breves; el cuento termina en la elección."}, {"q": "En el modelo MICE, una historia de «medio» empieza y termina cuando:", "o": ["Se plantea y se responde una pregunta", "El personaje entra en un lugar y sale de él", "Un orden se rompe y se restablece", "La identidad del personaje se quiebra y se asienta"], "a": 1, "why": "El ejemplo es <em>Los viajes de Gulliver<\/em>."}, {"q": "Para Martínez, ¿qué se juega sobre todo en el principio de un relato?", "o": ["El final", "La autoridad narrativa", "La cantidad de palabras", "El título"], "a": 1, "why": "El principio es «más de la mitad del todo», y ahí el lector decide confiar en el narrador."}, {"q": "En la imagen de Cortázar, ¿cómo gana un cuento?", "o": ["Por puntos", "Por knock-out", "Por descalificación", "En el último round"], "a": 1, "why": "La novela acumula puntos; el cuento tiene que noquear al lector."}, {"q": "¿Qué modelo está pensado sobre todo para el guion?", "o": ["La forma en siete tiempos", "El ensayo de cinco párrafos", "El BMOC (páginas 30/60/90/110)", "Las dos lógicas"], "a": 2, "why": "Russell lo calcula sobre las páginas de un largometraje."}], "exercise": {"title": "Argumentos", "text": "Elegí uno de los argumentos de los <em>Cuadernos norteamericanos<\/em> de Nathaniel Hawthorne, como «Un hombre posee el objeto más perfecto que un mortal podría desear; al tratar de mejorarlo, lo estropea» o «Un viejo espejo. Alguien descubre la forma de que todas las imágenes que reflejó en el pasado vuelvan a la superficie». Escribí un cuento breve a partir de él: un solo recipiente, una decisión (A o B), tres primeras líneas que ya apunten al final, y terminá en la elección."}}, {"n": 8, "name": "Dos historias, dos lógicas", "kicker": "Qué tiene adentro un cuento", "intro": "Es el último peldaño, y viene de la tradición en lengua castellana. Explica por qué un cuento puede sentirse como una anécdota con sorpresa, y qué lo hace funcionar en cambio: una historia oculta debajo de la visible, y un final que se siente inevitable, no solo sorpresivo.", "sources": "Ricardo Piglia, *Tesis sobre el cuento* y prólogo a los *Cuentos completos* de Rodolfo Walsh · Guillermo Martínez, *Once tesis (y antítesis) sobre la escritura de ficción* y «El cuento como sistema lógico» · Pablo De Santis, *Contar un secreto* · Franco Dall’Oste, *Breve teoría del cuento* (clases 1, 3 y 4) · Flannery O’Connor, *El arte del cuento* · Julio Cortázar, *Algunos aspectos del cuento* · Felisberto Hernández, *Explicación falsa de mis cuentos* · Raymond Carver, *Escribir un cuento* · Patricia Highsmith, *Suspense* · E. M. Forster, *Aspectos de la novela* · Juan José Saer, *El concepto de ficción*", "sections": [{"h": "Dos historias y el iceberg", "bullets": ["<strong>«Un cuento siempre cuenta dos historias»<\/strong> (Piglia, <em>Tesis sobre el cuento<\/em>). Chéjov anotó: «Un hombre, en Montecarlo, va al casino, gana un millón, vuelve a casa, se suicida». La historia del juego está en primer plano; la del suicidio se construye en secreto.", "<strong>«El arte del cuentista consiste en saber cifrar la historia 2 en los intersticios de la historia 1».<\/strong> Cada historia tiene su propia causalidad: «Los mismos acontecimientos entran simultáneamente en dos lógicas narrativas antagónicas», y los elementos esenciales tienen doble función. En «La muerte y la brújula», de Borges, la edición popular de la <em>Historia de la secta de Hasidim<\/em> que publica un tendero parece una casualidad irónica en la historia 1 y es imprescindible en la historia 2. «Lo que es superfluo en una historia, es básico en la otra».", "<strong>La historia secreta es una historia, no un sentido oculto.<\/strong> «No se trata de un sentido oculto que dependa de la interpretación: el enigma no es otra cosa que una historia que se cuenta de un modo enigmático». El problema técnico del cuento es «¿Cómo contar una historia mientras se está contando otra?».", "<strong>La versión clásica y la moderna.<\/strong> En Poe y Quiroga, «el efecto de sorpresa se produce cuando el final de la historia secreta aparece en la superficie». Desde Chéjov, Mansfield y el Joyce de <em>Dublineses<\/em>, la tensión entre las dos nunca se resuelve: «el cuento moderno cuenta dos historias como si fueran una sola». Kafka invierte el procedimiento: cuenta con claridad la historia secreta y vuelve enigmática la visible.", "<strong>El iceberg<\/strong> (Hemingway): «lo más importante nunca se cuenta». En «El gran río de los dos corazones», la guerra no aparece nunca y el cuento parece la descripción de una excursión de pesca. Según Piglia, Hemingway contaría el casino con todo detalle y nunca diría que ese hombre se va a suicidar, «pero escribiría el cuento como si el lector ya lo supiera».", "<strong>El arte de la elipsis<\/strong> (Piglia sobre Walsh). Para Walsh, «la ficción es el arte de la elipsis, trabaja con la alusión y lo no dicho». En «Fotos» y «Cartas», las tensiones políticas y sociales están implícitas: «Walsh practica la técnica del iceberg a la Hemingway: lo más importante de una historia es lo que no se narra».", "<strong>La yuxtaposición diferida<\/strong> (Joyce, citado por Piglia): «Una palabra que ni siquiera notamos, un hecho insignificante que sólo ocupa una línea, encuentra su reverberación diez páginas después». Así se siembra la historia oculta.", "<strong>De dónde vienen las historias<\/strong> (Walter Benjamin, en la clase 3 de <em>Breve teoría del cuento<\/em>, de Franco Dall’Oste). El campesino cuenta historias de su tierra y vuelve extraño lo cotidiano; el marino trae historias de lejos y vuelve familiar lo exótico. Piglia los actualiza: la investigación de un crimen y el viaje."]}, {"h": "Anécdota y cuento", "bullets": ["<strong>Una anécdota es una secuencia de acciones con un final sorprendente<\/strong> («No sabés lo que me pasó ayer»). Es más efectiva cuando el final, además de sorprender, resignifica; en eso se parece al cuento.", "<strong>El cuento es un sistema de dos lógicas<\/strong> (Guillermo Martínez, «El cuento como sistema lógico»). Una superficial, inicial, atada al sentido común, que el lector acepta al principio; y otra secreta, final, que va ganando terreno y resignifica todos los elementos. Martínez prefiere esta idea a la de las dos historias de Piglia, «porque muchas veces no existe del todo una segunda historia, sino sólo un alumbramiento distinto sobre los hechos».", "<strong>El final como desplazamiento<\/strong> (Martínez, undécima tesis). El final «debe proponerse un desplazamiento respecto a lo narrado, que reúna, resignifique o ilumine de una manera distinta todo lo leído». No implica necesariamente sorpresa —«un conejo sacado a último momento de la galera», diría Heker—, «pero sí cierto giro no del todo esperado, y que sin embargo se impone como necesario al lector»: la «necesidad y maravilla de la solución» que Borges pedía al policial. Muchas veces el primer germen del cuento ya contiene ese giro.", "<strong>Un artefacto construido para su final<\/strong> (De Santis). Desde Poe, el cuento moderno se arma para su final: «El final no es simple conclusión: es la estrella, la señal de la convicción, el secreto de la arquitectura». En la novela, en cambio, el final puede ser apenas la extinción de la acción.", "<strong>El efecto es fatal, no sorpresivo.<\/strong> El final debe sentirse inexorable y necesario. Hay sorpresa, pero está en descubrir la lógica secreta, bajo la cual los detalles de la superficie tienen otro sentido.", "<strong>Dónde vive la segunda lógica.<\/strong> En los detalles (objetos, personas y sus rasgos, el modo en que se ejecutan las acciones) y en la estructura (el narrador, el enfoque, el género textual).", "<strong>El diagnóstico:<\/strong> los cuentos que se parecen a una anécdota suelen tener una lógica secreta poco clara, incompleta o inexistente."]}, {"h": "Causalidad y verosimilitud", "bullets": ["<strong>Causalidad, no cronología<\/strong> (E. M. Forster, George Saunders). «Murió la reina y luego murió el rey» es una sucesión; «murió la reina y luego el rey murió de pena» es una historia.", "<strong>Trabajar hacia atrás<\/strong> (Jeff Kitchen). Empezá por el final y preguntate qué tuvo que causarlo, y qué causó eso.", "<strong>Inexorabilidad<\/strong> (Marina Arias). Un relato es significativo si al llegar al final resuena un «claro, no podía pasar otra cosa».", "<strong>Sembrá temprano.<\/strong> Si una habilidad, un objeto o un rasgo resuelve el final, tiene que haber aparecido mucho antes; como regla práctica, al menos tres escenas antes, para que el lector no se sienta estafado.", "<strong>La verosimilitud es coherencia interna<\/strong>, no verdad histórica. Nabokov pide que el mundo, aunque sea irreal como el de Gógol, sea verosímil mientras dure la lectura.", "<strong>Lo fantástico no requiere un objeto mágico<\/strong> (Martínez, décima tesis). Puede ser «una hipótesis más convincente que cualquier explicación realista», «una atmósfera de extrañeza, una alteración de las facultades mentales, una acumulación de coincidencias, o un simple cambio de punto de vista». Hay que preparar señales anticipatorias y, si hay una transgresión de lo real, «conviene que esa transgresión sea única».", "<strong>El pacto de lectura<\/strong> (Franco Dall’Oste, <em>Breve teoría del cuento<\/em>, clase 1). En la ficción, el pacto es que lo que se cuenta no sucedió de verdad; el lector la juzga por lo verosímil, no por lo verídico. «La ficción no renuncia a la realidad, sino a la verificación». Como dice Saer: «La ficción no solicita ser creída en tanto que verdad, sino en tanto que ficción»."]}, {"h": "Significación", "bullets": ["<strong>«Una historia es una forma de decir algo que no puede decirse de ninguna otra manera»<\/strong> (O’Connor). «El significado de la ficción no es un significado abstracto, sino un significado que se experimenta».", "<strong>«Un cuento es una acción dramática completa»<\/strong> (O’Connor), y «un buen cuento no debe tener menos significación que una novela».", "<strong>La significación<\/strong> (Cortázar). Un episodio doméstico, como en Chéjov o Katherine Mansfield, puede irradiar mucho más allá de sí mismo: «Un cuento es significativo cuando quiebra sus propios límites con esa explosión de energía espiritual que ilumina bruscamente algo que va mucho más allá de la pequeña y a veces miserable anécdota que cuenta». No depende solo del tema, sino de la intensidad y la tensión con que se lo trata.", "<strong>Original y familiar a la vez<\/strong> (Marina Arias, citada por Franco Dall’Oste). Una ficción significativa resulta inusitada y conocida al mismo tiempo, y abre un caso particular hacia algo universal."]}, {"h": "Inventar y poner a prueba dos lógicas", "bullets": ["<strong>Tres puntos de partida.<\/strong> Desde una <em>escena<\/em>: tomá un protocolo estricto y literalizá su regla. Desde un <em>tema<\/em>: dejá que la metáfora se vuelva materia. Desde una <em>imagen<\/em>: dale a un objeto común una ley oculta.", "<strong>Una plantilla.<\/strong> <em>La fachada<\/em>: el protagonista intenta una acción cotidiana usando un objeto o un saber técnico. <em>El virus<\/em>: sin que lo sepa, ese objeto opera bajo una ley invertida o una metáfora literal. <em>El choque<\/em>: si logra su objetivo superficial, sufre inevitablemente la consecuencia fatal.", "<strong>Estudiá los modelos:<\/strong> «La pata de mono» (W. W. Jacobs), «Cordero asado» (Roald Dahl), «El almohadón de plumas» (Quiroga), «Las ruinas circulares» (Borges), «Axolotl» (Cortázar). En cada uno, nombrá la lógica superficial y la secreta.", "<strong>La corrección.<\/strong> Pedile a un lector exigente que marque dónde la lógica inicial se siente forzada y dónde el final parece una sorpresa barata en lugar de una consecuencia inevitable."]}], "lamps": [{"title": "¿Recompensa o fatalidad?", "verdict": "Los dos finales cumplen una promesa. La diferencia es cuál: el guion paga el plan del personaje; el cuento paga la lógica de la historia.", "sides": [{"kind": "screen", "label": "Guion y novela", "text": "La recompensa «para aplaudir de pie» de Sanderson y el clímax de Russell premian al héroe: el deseo y la necesidad se juntan, y el plan sale bien."}, {"kind": "story", "label": "Cuento", "text": "En el modelo de las dos lógicas, el final es una fatalidad: la lógica secreta se cierra sobre el personaje, muchas veces a causa de su propio objetivo superficial. El placer es el reconocimiento, no el triunfo."}]}, {"title": "¿De dónde sale el sentido?", "verdict": "Los niveles 2 a 5 te dan el plan del protagonista; el nivel 8, la trampa. Muchos de los cuentos más fuertes usan las dos cosas: un objetivo superficial claro que la lógica secreta convierte en el instrumento de la perdición del personaje.", "sides": [{"kind": "screen", "label": "Guion", "text": "Un guion se diseña de afuera hacia adentro: objetivos, obstáculos y una cadena causal movida por el deseo."}, {"kind": "story", "label": "Cuento", "text": "Un cuento se diseña de adentro hacia afuera, alrededor de una situación cerrada o una crisis y de un único momento revelador. En la tradición latinoamericana, la trampa (social, metafísica, física) muchas veces reemplaza al plan del protagonista."}]}, {"title": "¿Sugerir u omitir?", "verdict": "Piglia lo resuelve: la historia secreta se cuenta, solo que cifrada, en detalles que funcionan en las dos historias. Si el lector no encuentra ningún rastro de lo que dejaste afuera, no es un iceberg: es un hueco.", "sides": [{"kind": "story", "label": "Cuento: Hemingway, Piglia sobre Walsh", "text": "Lo más importante nunca se cuenta; la historia secreta se construye «con lo no dicho, con el sobreentendido y la alusión»."}, {"kind": "story", "label": "Cuento: O’Connor", "text": "El principiante «cree que cuando omite algo está ejercitando su sutileza», pero «no puede encontrarse en un texto nada que no haya sido puesto de algún modo en él». «Que un cuento sea breve no significa que deba ser superficial»."}]}, {"title": "¿Dos historias o una lógica vista dos veces?", "verdict": "Usá el modelo de Piglia cuando algo pasa de verdad fuera de la vista: un crimen, una trampa, un plan. Usá el de Martínez cuando los hechos son los mismos y lo único que se da vuelta al final es su sentido.", "sides": [{"kind": "story", "label": "Cuento: Piglia", "text": "Todo cuento cuenta dos historias, y la secreta es una historia completa contada en los intersticios de la visible: el suicidio detrás del millón ganado en el casino."}, {"kind": "story", "label": "Cuento: Martínez", "text": "Muchas veces no hay una segunda historia completa, «sino sólo un alumbramiento distinto sobre los hechos»: dos sistemas de causalidad, «o más bien, una lógica desdoblada en dos»."}]}, {"title": "¿Una lógica, o ninguna?", "verdict": "Leé a Felisberto hasta el final: la planta «no conocerá sus leyes, aunque profundamente las tenga y la conciencia no las alcance». La lógica puede descubrirse en lugar de diseñarse, pero un cuento que funciona la tiene.", "sides": [{"kind": "story", "label": "Cuento: Martínez y Poe", "text": "El cuento es un sistema lógico: una lógica superficial, una secreta y vínculos causales que vuelven necesario el final. Poe planifica todo el mecanismo desde el desenlace."}, {"kind": "story", "label": "Cuento: Felisberto Hernández", "text": "«Mis cuentos no tienen estructuras lógicas». Espera que el cuento crezca solo y desconfía de las intenciones que la conciencia intenta imponerle."}]}, {"title": "¿Giro final o nada de trucos?", "verdict": "Rechazan lo mismo: un final que hace sentir estafado al lector. Martínez pide un giro no del todo esperado que se vuelve necesario, no un conejo sacado de la galera. Si el final resignifica lo que ya estaba en la página, no es un truco.", "sides": [{"kind": "story", "label": "Cuento: Carver, Highsmith", "text": "Carver: «Al primer signo de juego o de truco en una narración, sea trivial o elaborado, cierro el libro». Highsmith lo llama «la escuela personal en contraposición a la escuela de los trucos»: los trucos son ideas ingeniosas que puede inventar cualquiera y no tienen nada que ver con la literatura; «las buenas narraciones cortas se hacen solamente con las emociones del escritor»."}, {"kind": "story", "label": "Cuento: los modelos de lógica secreta", "text": "«La pata de mono», «Cordero asado» y «El almohadón de plumas» giran sobre una revelación final, y la lista de rasgos del cuento de Dall’Oste incluye un final que busca «sorprender o recontextualizar lo anterior»."}]}], "quiz": [{"q": "Según Piglia, todo cuento:", "o": ["Tiene un final sorpresa", "Cuenta dos historias, una visible y una secreta", "Debe leerse de una sola vez", "Está narrado en primera persona"], "a": 1, "why": "La historia secreta aflora de a poco y le da sentido a la visible."}, {"q": "En la lectura de Piglia de «La muerte y la brújula», el libro del tendero:", "o": ["Es una pista falsa sin función", "Parece una casualidad en la historia visible y es imprescindible en la secreta", "Es un símbolo de la fe", "Revela al asesino en la primera página"], "a": 1, "why": "«Lo que es superfluo en una historia, es básico en la otra»."}, {"q": "¿Qué dice O’Connor sobre sugerir y omitir?", "o": ["Que son lo mismo", "Que sugerir no es omitir: nada hay en un texto que no se haya puesto en él", "Que siempre hay que omitir el final", "Que la omisión es el alma de la brevedad"], "a": 1, "why": "Advierte que dejar cosas afuera no es sutileza."}, {"q": "Según Martínez, un relato fantástico debe:", "o": ["Multiplicar los prodigios", "Transgredir la realidad una sola vez, después de preparar señales", "Incluir siempre un objeto mágico", "Explicar lo sobrenatural al final"], "a": 1, "why": "Siguiendo a Borges: evitar que se multipliquen los prodigios."}, {"q": "El final ideal para Martínez es:", "o": ["Una sorpresa total", "Un giro no del todo esperado que se impone como necesario", "Una pregunta abierta", "Un epílogo que cierra todas las líneas"], "a": 1, "why": "La «necesidad y maravilla de la solución» de Borges."}, {"q": "Según Saer, la ficción renuncia a:", "o": ["La realidad", "La verificación", "El sentido", "Los personajes"], "a": 1, "why": "La ficción pide ser creída en tanto ficción; trata el mundo real pero no puede verificarse contra él."}, {"q": "¿Qué convierte una anécdota en un cuento, según este modelo?", "o": ["Una extensión mayor", "Una lógica secreta que resignifica todos los elementos al final", "Un final feliz", "Más diálogo"], "a": 1, "why": "El final tiene que resignificar, no solo sorprender."}, {"q": "El final de un cuento bien construido debe sentirse, sobre todo:", "o": ["Impactante", "Ambiguo", "Inexorable y necesario", "Esperanzador"], "a": 2, "why": "Fatal, inexorable, necesario, y no solo sorpresivo."}, {"q": "En el ejemplo de Forster, ¿qué frase es una historia y no una sucesión?", "o": ["Murió la reina y luego murió el rey", "Murió el rey, después la reina", "Murió la reina y luego el rey murió de pena", "Murieron el rey y la reina"], "a": 2, "why": "«De pena» agrega la causalidad."}, {"q": "En la plantilla de la fachada, el virus y el choque, «el virus» es:", "o": ["El antagonista", "La ley oculta que sigue en secreto el objeto común", "El final fatal", "Un giro en la mitad"], "a": 1, "why": "Fachada, virus, choque: el virus es la regla secreta."}], "exercise": {"title": "Fantástico", "text": "Escribí un cuento fantástico breve que parta de una situación real y desemboque en una situación sobrenatural. Elegí uno de los temas clásicos: el descubrimiento de un objeto imposible, el viaje en el tiempo sin máquina, la transformación de humano en animal, las partes del cuerpo que adquieren vida propia, la naturaleza que adquiere voluntad. Transgredí la realidad una sola vez, sembrá las señales temprano y usá la plantilla de la fachada, el virus y el choque para darle dos lógicas."}}]}, en: {"title": "The Writing Staircase", "subtitle": "Craft advice for writing fiction, ordered from the first habit to the secret logic of the short story", "howTo": ["Each level assumes the one before: you can’t judge a scene without knowing what a character wants, and you can’t build a secret logic without knowing how to build a scene.", "The advice comes from two different traditions. One is <strong>screenwriting and commercial fiction<\/strong>: goals, obstacles, arcs, payoffs. The other is <strong>the short story<\/strong>, especially the River Plate tradition of Quiroga, Borges, Cortázar and Heker: compression, interiority, the two logics. They often agree. Where they don’t, you’ll find a lamp.", "Guillermo Martínez’s first thesis explains why the lamps exist: “Every general statement about writing fiction will meet some perfectly legitimate counterexample in particular.” That doesn’t stop you from working with criteria that are firm and flexible at once.", "Each level ends with a short quiz and a writing prompt taken from Pablo De Santis’s <em>Abecé de consignas<\/em>. The quiz answers, each with a one-line explanation, are in the key at the end."], "lampLegend": "A lamp marks a place where the sources disagree. It says which position is meant for the screen (and long-form plot), which for the short story, and how to choose.", "leftOut": "", "levels": [{"n": 0, "name": "Habits", "kicker": "Before any technique", "intro": "All the sources agree on these points, and none of them is a technique. They describe how writers work.", "sources": "Stephen King, *On Writing* · William Zinsser, *On Writing Well* · Strunk and White, *The Elements of Style* · Horacio Quiroga, *Decalogue of the Perfect Short-Story Writer* · Liliana Heker, interview on *La trastienda de la escritura* · Edgar Allan Poe, *The Philosophy of Composition* · Flannery O’Connor, *Mystery and Manners* · Raymond Carver, *On Writing* · Felisberto Hernández, *False Explanation of My Stories* · Franco Dall’Oste, *Breve teoría del cuento* (classes 2 and 3) and *Cajón de herramientas* (class 4) · Guillermo Martínez, *Eleven Theses (and Antitheses) on Writing Fiction* · Pablo De Santis, *Contar un secreto* · Patricia Highsmith, *Plotting and Writing Suspense Fiction* · Shaelin Bishop (ShaelinWrites) · Dada Groover · Brandon Sanderson", "sections": [{"h": "Read a lot, write a lot", "bullets": ["<strong>Stephen King calls it the “Great Commandment.”<\/strong> There are no shortcuts; Murakami and Zinsser say the same. Reading is the training; writing, the practice.", "<strong>“Believe in a master—Poe, Maupassant, Kipling, Chekhov—as in God himself”<\/strong> (Quiroga, <em>Decalogue<\/em>, I). And in III: “Resist imitation as much as you can, but imitate if the influence is too strong. More than anything else, the development of a personality is a long patience.”", "<strong>Chekhov and <em>The Elements of Style<\/em> are the shared references.<\/strong> Chekhov is the most cited master of the short story (Quiroga’s <em>Decalogue<\/em> puts him first); Strunk and White’s manual is the one everyone quotes.", "<strong>“Originality is trained in reading”<\/strong> (Martínez, third thesis). Absolute originality may be impossible, but not an “attitude” of originality: knowing what has already been done, or overdone, in your line, and looking for what sets your text apart “against what has already been written.”", "<strong>All writing rewrites other writing.<\/strong> Barthes, Bakhtin and Kristeva describe every text as a mosaic of other texts. Franco Dall’Oste (<em>Breve teoría del cuento<\/em>, class 3) quotes Charly García’s version: “Music is already made. When you steal from one, you’re mediocre; when you steal from everyone, you’re a genius.”"]}, {"h": "Writing is rewriting", "bullets": ["<strong>“Rewriting is the essence of writing well”<\/strong> (Zinsser). Saunders defines the process as “intuition plus iteration”: the voice shows up in the revisions.", "<strong>Write with the door closed, rewrite with the door open<\/strong> (King). The first draft is private; revision is for the reader.", "<strong>Work in layers<\/strong> (Dada Groover). Make separate passes for separate jobs; for example, a late pass only to check that each scene lands emotionally.", "<strong>The three ages of a text<\/strong> (De Santis). Imagining is childhood: anything goes. Writing is adolescence: the world starts to have rules. Revising is maturity, “with all its load of neurosis.” Let the text rest, read it aloud, and remember that the reader is always a newcomer: the author “need only hear his footsteps to recognize them, because he invented the sound of his steps.”", "<strong>Keep what you cut.<\/strong> Cutting is easier when nothing is entirely lost. Heker keeps a file of trimmed fragments."]}, {"h": "Desire and discipline", "bullets": ["<strong>Heker’s two hypotheses:<\/strong> “don’t write without wanting to” and “the wanting to write comes from writing.” They seem to contradict each other; together they mean you don’t wait for inspiration: you go looking for it on the page.", "<strong>Block is information<\/strong> (Shaelin Bishop). When a draft resists, something is almost always broken in the story’s logic. Don’t force the words: go back and find where the logic went wrong.", "<strong>“Don’t write under the sway of emotion. Let it die, and evoke it later. If you can then relive it exactly as it was, you have come halfway in art”<\/strong> (Quiroga, IX).", "<strong>The habit of art<\/strong> (O’Connor, after Maritain). The whole personality writes, conscious and unconscious. “Art is a habit of the artist”: a control that isn’t entirely conscious and is built over years, like a way of looking at the world.", "<strong>Collect germs<\/strong> (Highsmith). Almost anything can hold one: a respectable gentleman slipping a pear into his pocket without paying, rain washing away the prints on a glass. Some germs only grow when a second idea is added.", "<strong>A little every day, “without hope and without despair.”<\/strong> Carver quotes Isak Dinesen’s rule and makes it his own."]}, {"h": "Plan or discover: the short-story debate", "bullets": ["<strong>The planners.<\/strong> Poe builds a story like a clock: the effect comes first, and “any plot worth the name must be elaborated to its dénouement before anything be attempted with the pen.” Quiroga: “Don’t start writing without knowing from the first word where you are going” and “Take your characters by the hand and lead them firmly to the end.” García Márquez compares the short story to concrete: it is poured all at once. Chekhov’s gun: nothing that isn’t necessary.", "<strong>The discoverers.<\/strong> For O’Connor writing is discovery: “I didn’t know he was going to steal that wooden leg until ten or twelve lines before he did it, but when I found out that this was what was going to happen, I realized that it was inevitable.” For her “the form is organic, it grows out of the material.” Felisberto Hernández thinks that “in a corner of me a plant will be born” and helps it become what it is meant to be. Carver starts from a sentence (“He was vacuuming when the phone rang”) and moves forward one line at a time, as in a poem.", "<strong>What they share<\/strong> (Franco Dall’Oste, <em>Breve teoría del cuento<\/em>, class 2): control isn’t total, but it isn’t absent either. Writing is recognizing and nourishing a central idea or tension, and the meaning is woven into the story, not added afterwards."]}, {"h": "Three criteria for judging a text", "bullets": ["<strong>Originality, resolution, writing<\/strong> (Martínez, second thesis). “None of the three can be neglected: if the text fails in any one of them, it fails entirely.” All three can be discussed, practiced and learned.", "<strong>Resolution is the “little toolbox”:<\/strong> point of view, register, spotting commonplaces, pacing information, dialogue, how characters enter. Well learned, it becomes invisible and leaves room for your own voice.", "<strong>“Writing must above all be a struggle against the commonplace”<\/strong> (fifth thesis): against crystallized expressions and the clichés of the “literary,” and in favor of “a language within language,” with your own appropriations and refusals of words, even in street speech."]}, {"h": "Tools, AI included", "bullets": ["<strong>“AI is a tool, not a replacement for the writer”<\/strong> (Franco Dall’Oste, <em>Cajón de herramientas<\/em>, class 4). It produces statistical patterns without real understanding; your experience and your voice are what it can’t supply.", "<strong>Four ways to use it<\/strong> (Elizabeth Ann West, quoted by Dall’Oste): “gardeners” use it for brainstorming; “weavers” combine their own writing with generated text; “bakers” refine several versions; “architects” structure stories with precise instructions.", "<strong>Rules of use:<\/strong> start with small experiments, be specific, always edit what it produces, keep your own voice, be transparent and set clear limits. A request that only diagnoses, without rewriting, keeps the writing in your hands."]}], "lamps": [{"title": "Plan first or discover along the way?", "verdict": "It isn’t screen versus story: there are great short-story writers on both sides. Find out what kind of writer you are in each story. If you plan, plan the effect and the ending. If you discover, revise until every element serves what you found.", "sides": [{"kind": "story", "label": "Story: the planners", "text": "Poe plans from the dénouement and the effect; Quiroga wants to know the ending before the first line; García Márquez pours the story all at once. In the interview with Heker comes the idea that a short story is more “assembled” from the start than a novel."}, {"kind": "story", "label": "Story: the discoverers", "text": "O’Connor discovers the meaning while she writes; Felisberto lets the story grow like a plant and distrusts “the foreigners” his consciousness recommends; Carver follows a single sentence to see where it leads."}, {"kind": "novel", "label": "Novel: both positions", "text": "Brandon Sanderson plans by plot cycles, starting from the payoff. Shaelin Bishop defends discovery writing: a general direction is enough, and discovering is a tool, not an identity."}]}], "quiz": [{"q": "What does Heker mean by “the wanting to write comes from writing”?", "o": ["That you should only write when inspired", "That the act of writing produces the desire to write", "That writing is an obligation and desire doesn’t matter", "That ideas come from reading, not from writing"], "a": 1, "why": "Her two hypotheses work together: don’t write without wanting to, but the wanting appears as you write."}, {"q": "In King’s formula, when should the door be open?", "o": ["When writing the draft", "When reading", "When rewriting", "Never"], "a": 2, "why": "The draft is private (door closed); revision is for the reader (door open)."}, {"q": "According to Shaelin Bishop, what is writer’s block usually telling you?", "o": ["That you need a break", "That something is broken in the story’s logic", "That you should switch to planning", "That the idea isn’t original"], "a": 1, "why": "Block is a signal from the draft: look for where the logic went wrong instead of forcing the words."}, {"q": "Which author is most often cited as the master of the short story?", "o": ["Stephen King", "William Zinsser", "Anton Chekhov", "Brandon Sanderson"], "a": 2, "why": "Saunders, Quiroga, King, Piglia, Zinsser and Rozenmacher all point to him."}, {"q": "What does Quiroga advise about emotion?", "o": ["Write while you feel it most strongly", "Let it die and evoke it later", "Avoid emotional subjects", "Describe it with adjectives"], "a": 1, "why": "<em>Decalogue<\/em>, IX: if you can relive it exactly as it was, you are halfway there."}, {"q": "Martínez’s three criteria for judging a text are:", "o": ["Plot, character, theme", "Originality, resolution, writing", "Beginning, middle, end", "Voice, tone, style"], "a": 1, "why": "If the text fails in any one of them, it fails entirely."}, {"q": "Felisberto Hernández compares the birth of a story to:", "o": ["A clock being assembled", "Concrete being poured", "A plant born in a corner of himself", "A photograph"], "a": 2, "why": "The clock is Poe’s; the concrete, García Márquez’s; the photograph, Cortázar’s."}], "exercise": {"title": "Diary", "text": "For a month, keep a diary, not to record what you do, but conversations overheard in passing, a story someone tells you, something that caught your attention. Once a week, follow John Berendt’s advice, as De Santis collects it: “Take an incident and write it up as a little vignette. Give it color, including asides and dialogue, give it the shape of a story with a beginning, a middle and an end.” Mark the entries that could be a germ, in Highsmith’s sense."}}, {"n": 1, "name": "The page", "kicker": "The sentence and the detail", "intro": "The smallest unit of the craft is the sentence, and the smallest unit of meaning is the concrete detail. Two rules govern here: show the reader the evidence, and cut what doesn’t work.", "sources": "Diane Callahan, *How to Show, Not Tell* · K. M. Weiland · Andrew Stanton, *The Clues to a Great Story* · Strunk and White, *The Elements of Style* · Horacio Quiroga, *Decalogue of the Perfect Short-Story Writer* · Raymond Carver, *On Writing* · Franco Dall’Oste, *Cajón de herramientas* (class 2) · Rodolfo Walsh, “Fotos” · Flannery O’Connor, *Mystery and Manners* · Chuck Palahniuk, *Consider This* · Pablo De Santis, *Contar un secreto* · Shaelin Bishop, *How to Write a Scene* · Andy Guerdat, *The Go Draft*", "sections": [{"h": "Showing and telling", "bullets": ["<strong>Showing dramatizes; telling summarizes<\/strong> (K. M. Weiland). Neither is wrong. Every story mixes both; a story made only of scenes would be unreadably long.", "<strong>Give the reader 2 + 2, not 4<\/strong> (Andrew Stanton, of Pixar). Readers like to deduce. If you hand them the conclusion, you take away the pleasure of finding it.", "<strong>Distrust thought verbs<\/strong> (Palahniuk). Instead of “knew,” “felt,” “realized,” give the evidence that would let the reader know it.", "<strong>The concrete beats the abstract.<\/strong> Don’t write that she is clever: show the key she made with dental floss and a spatula.", "<strong>Put emotion in the body and in action<\/strong>, and let voice and subtext carry what goes unsaid.", "<strong>The combined technique:<\/strong> tell something briefly and prove it right away with a concrete image. Frances Hodgson Burnett says Mary is disagreeable and immediately shows her thin face, her yellow skin, her sour expression."]}, {"h": "Economy", "bullets": ["<strong>“Omit needless words”<\/strong> (Strunk and White, rule 17). King repeats it; Zinsser’s version is “simplify, simplify.”", "<strong>“The secret of being boring is to say everything.”<\/strong> Some attribute it to Chekhov, others to Oscar Wilde; all agree that fiction concentrates experience instead of recording it.", "<strong>“Don’t use adjectives without need”<\/strong> (Quiroga, VII). “Useless will be all the colored tails you attach to a weak noun. If you find the precise one, it alone will have an incomparable color. But you have to find it.” And in VI: “From the river blew the cold wind”: for that circumstance there are no other words in human language.", "<strong>Mix three textures<\/strong> (Palahniuk): description (“A man walks into a bar”), instruction (“Walk into a bar”) and exclamation (“Oh, he sighed”). Most fiction is only description; mixing the three sounds like the way people talk.", "<strong>No tricks<\/strong> (Carver). “At the first sign of a trick or a gimmick in a piece of fiction, a cheap trick or even an elaborate trick, I tend to look for cover.” With clear language you can endow common objects—“a chair, a window curtain, a fork, a stone, a woman’s earring”—with “immense, even startling power.”"]}, {"h": "Description", "bullets": ["<strong>“Description in fiction is not mere ornament”<\/strong> (Franco Dall’Oste, <em>Cajón de herramientas<\/em>, class 2). It builds a sensory experience, an atmosphere and the narrator’s subjectivity.", "<strong>Describe with verbs, not adjectives.<\/strong> In “Fotos,” Walsh never says that Mauricio Irigorri is rebellious: “The boy Mauricio Irigorri used to grab the teacher’s backside, dodge the slap and collect the bets at recess.”", "<strong>Look for the significant detail:<\/strong> an object, a gesture or an action that condenses a person, a scene or a conflict.", "<strong>Someone is always looking.<\/strong> What is described, and how, says as much about the observer as about what is observed: what they know, how they feel, what would catch their eye and what they would miss.", "<strong>Tense describes too<\/strong> (Dall’Oste). In Spanish, the imperfect (“le tocaba”) describes a habit and the preterite (“le tocó”) narrates a single event; in English, “used to” or “would” does the first job and the simple past the second.", "<strong>Routine and the instant<\/strong> (De Santis). Fiction has two basic ways of expressing time: what happens again and again, and what happens once. “A musician played the violin in the Philadelphia orchestra for twenty years without his bow ever touching the strings. One day his bow touched a string, sounded a note, and he was fired.”", "<strong>Use the five senses<\/strong>, but choose. Vary the rhythm—short descriptions for action, longer ones for contemplation—and avoid the molds “The X was Y” or “There was an X in Y.”", "<strong>“Fiction operates through the senses”<\/strong> (O’Connor). Henry James called the vague detail “weak specification”; Ford Madox Ford taught that you can’t put a newsboy in a story without describing him enough for the reader to see him. Even so, “every detail must be controlled by some overall purpose.”", "<strong>Make the concrete “work double time”<\/strong> (O’Connor). In “Good Country People,” the wooden leg is first of all a wooden leg; over the story it accumulates meaning until, when the Bible salesman steals it, he takes part of the girl’s personality with him. A detail becomes a symbol through the work it does, not because the author labels it.", "<strong>Get the small things right<\/strong> (Palahniuk). In cathedral windows, the miracles went in the highest panes and the most careful work in what you saw first: if the viewer believed the sandals and the folds of the robes, they believed the manna. Break a crucial gesture down so well that the reader imitates it without noticing.", "<strong>Local speech carries a whole society<\/strong> (O’Connor). When a character says he has “a mule older than Birmingham,” there is a society and its history in that one phrase; characters who talk like a television studio have none behind them."]}], "lamps": [{"title": "Is telling allowed?", "verdict": "In prose, tell what the reader needs to get through quickly and show what you want them to feel.", "sides": [{"kind": "screen", "label": "Screenwriting", "text": "Andy Guerdat (<em>The Go Draft<\/em>) keeps dialogue as a last resort: first action, objects, subtext and body language, because the camera can only show. In a screenplay, “show, don’t tell” is almost absolute."}, {"kind": "story", "label": "Prose and short story", "text": "On the page, telling is a tool. Shaelin Bishop points out that adult literary fiction can be mostly narrative summary, and that exposition and backstory, written with purpose and detail, are vital. The combined technique tells and shows in the same movement."}]}], "quiz": [{"q": "What does Stanton’s “2 + 2” rule ask of the writer?", "o": ["Use two details per sentence", "Give the parts and let the reader reach the conclusion", "Repeat each important idea twice", "Balance scenes and summaries"], "a": 1, "why": "Readers like to deduce; implicit meaning draws them in, over-explaining pushes them away."}, {"q": "Which of these is a “thought verb” worth distrusting?", "o": ["Ran", "Realized", "Whispered", "Broke"], "a": 1, "why": "Verbs like “realized,” “knew” or “felt” report a conclusion instead of showing the evidence."}, {"q": "The combined technique consists of:", "o": ["Alternating scenes and summaries", "Telling a trait and proving it right away with a concrete detail", "Mixing first and third person", "Combining dialogue and tags"], "a": 1, "why": "Burnett says Mary is disagreeable and immediately shows her face and expression."}, {"q": "In which medium is “show, don’t tell” closest to an absolute rule?", "o": ["The literary short story", "Memoir", "Screenwriting", "The literary novel"], "a": 2, "why": "The camera can only show; prose can tell when telling serves the story."}, {"q": "In O’Connor’s “Good Country People,” the wooden leg:", "o": ["Is only a symbol", "Is a real leg that accumulates meaning until its theft reveals the girl’s deeper affliction", "Doesn’t matter to the story", "Is explained in the first paragraph"], "a": 1, "why": "It works at the literal level and in depth: the concrete working double time."}, {"q": "What do Palahniuk’s stained-glass windows teach?", "o": ["Use colorful language", "If the reader believes the small details at eye level, they’ll believe the miracle", "Describe from above", "Put the climax at the top of the page"], "a": 1, "why": "Authority comes from getting the small things right; Fincher said the same about the twist in <em>Fight Club<\/em>."}, {"q": "How does Walsh show Mauricio Irigorri’s character in “Fotos”?", "o": ["With a list of adjectives", "With his habitual actions", "With his interior monologue", "With other characters’ opinions"], "a": 1, "why": "Grab, dodge, collect: the verbs do the work adjectives would do."}], "exercise": {"title": "Routine and instant", "text": "Write a true experience, lived or heard, that shows an event altering a routine in an instant. Tell the routine with “used to” or “would” (the imperfect, if you write in Spanish) and the instant in the simple past. Describe with verbs, not adjectives, and choose one significant detail."}}, {"n": 2, "name": "A character who wants something", "kicker": "Goal, motivation, singularity", "intro": "A story begins when someone wants something. This level is about making that desire visible, and making the one who desires a particular someone, not a generic type.", "sources": "Franco Dall’Oste, *Cajón de herramientas* (class 3) · Flannery O’Connor, *Mystery and Manners* · Guillermo Martínez, *Eleven Theses (and Antitheses) on Writing Fiction* · Patricia Highsmith, *Plotting and Writing Suspense Fiction* · Brandon Sanderson, writing lectures · Paul Chitlik, *Write Better Conflict* · Erik Bork, *The Idea* · Claire Keegan, *Small Things Like These* · Rodolfo Fogwill, *Malvinas Requiem (Los pichiciegos)*", "sections": [{"h": "The goal", "bullets": ["<strong>Make the goal visible and trackable.<\/strong> The reader has to be able to tell whether the character is getting closer to it or further away.", "<strong>The three-question test:<\/strong> Is the goal visible? Are the stakes immediate and personal? Does pursuing it force the character to change or sacrifice something? If they can win without changing, the goal is weak.", "<strong>Goals activate passive characters<\/strong>, and quiet, character-centered stories need them too.", "<strong>Motivation explains the goal.<\/strong> Maslow’s pyramid works as a menu: survival, safety, belonging (the most common), esteem, self-actualization."]}, {"h": "The particular person", "bullets": ["<strong>Start from a core belief:<\/strong> the unspoken rule the character lives by. Their past, actions and personality come from it.", "<strong>Introduce each character in three ways:<\/strong> have them say something, do something, and let their problem show. Hair and eye color can wait.", "<strong>Contradictions make people real.<\/strong> They create a small mystery and pull the character away from the stereotype.", "<strong>One quirk is enough<\/strong>, if it is tied to their past and psychology. An odd habit works better with an unexpected reason behind it.", "<strong>The three-tense character:<\/strong> haunted by the past (little information, much anguish), struggling in the present (an external and an internal problem) and wary of the future, like Bill in Claire Keegan’s <em>Small Things Like These<\/em>.", "<strong>Sanderson’s sliders:<\/strong> proactivity, likability and competence. If you lower one, you need to raise the others; a character low on all three is hard to follow.", "<strong>If you can’t hear a character’s voice<\/strong>, they are underdeveloped (Paul Chitlik). Go back to who they are."]}, {"h": "Ten dimensions of a character", "bullets": ["<strong>Franco Dall’Oste’s list<\/strong> (<em>Cajón de herramientas<\/em>, class 3): subjectivity, contradictions, physicality, biography, historicity, politicity, material conditions, language, resistances, needs and desires.", "<strong>History and politics are part of the person.<\/strong> In Dall’Oste’s analysis, Quiquito in Fogwill’s <em>Los pichiciegos<\/em> is made of the Falklands War he lives through, not just of his psychology.", "<strong>The familiar plus the unique.<\/strong> To avoid the stereotype, combine recognizable traits with one that surprises; Dall’Oste’s example is Carver’s “Cathedral.”", "<strong>Character and action make each other<\/strong> (O’Connor): “characters are shown through action, and the action is controlled through the characters.”", "<strong>“Few traits, but decisive ones”<\/strong>, and also “already in motion, linked to the plot” (Martínez, seventh thesis, after Borges). Don’t introduce them from outside before the story starts: put them in a scene where they reveal themselves through their acts, their way of speaking or thinking.", "<strong>Avoid “conceptual closure”<\/strong> (Martínez): first saying what a character is like and then showing them act exactly that way, so the action adds nothing.", "<strong>“Characters exist for the sake of events, and events for the sake of characters”<\/strong> (Borges, quoted by Martínez). The old split between character stories and plot stories doesn’t hold up in practice.", "<strong>Start from a person, not a plot<\/strong> (O’Connor). Many weak stories think up an action and then pick someone to carry it out. “If you start with a real personality, a real character, then something is bound to happen; and you don’t have to know what before you begin.”"]}], "lamps": [{"title": "Does the protagonist have to want something visible?", "verdict": "A short story can have a protagonist with almost no capacity for action, but then something else has to hold the reader: tension, a situation, or a secret logic that closes.", "sides": [{"kind": "screen", "label": "Screenwriting", "text": "Screenwriting guides and Paul Chitlik demand an external, visible goal, set before the end of the first act; Sanderson puts proactivity first. Without that goal, it seems nothing is happening."}, {"kind": "story", "label": "Short story", "text": "Much of the Latin American short story gives up the proactive protagonist: the characters of Rulfo or Ribeyro are trapped by their surroundings, poverty or fate. Their desire is often small, blocked from the start, or simply to endure."}]}, {"title": "Who’s in charge: you or your characters?", "verdict": "When a character strays from the plan, stop and look, as Highsmith says, for several days if need be. Keep the change if it improves the story, not because the character “wanted it.”", "sides": [{"kind": "story", "label": "Story: O’Connor, Felisberto", "text": "O’Connor let her characters lead her to the theft of the wooden leg. Felisberto lets the story grow on its own and distrusts the intentions he tries to impose on it."}, {"kind": "both", "label": "Novel and story: Highsmith, Martínez", "text": "Highsmith: a rebellious character can steer the plot toward something better, but not always: “After all, one is the boss.” Martínez’s <em>Personal Dodecalogue<\/em> asks you not to believe in “the romantic clichés of supposedly disobedient characters,” and quotes Highsmith: “Yes, my characters rebel sometimes too, but you have to remind them who’s the boss.” For him, “all fiction is an artifice.”"}]}, {"title": "Start from the problem or from the person?", "verdict": "In a short story, the problem is usually what this particular person can’t dodge. If you start from the problem, ask whether it could happen to anyone; if the answer is yes, the character isn’t working yet.", "sides": [{"kind": "screen", "label": "Film and TV", "text": "Erik Bork: 95% of his notes on scripts point to the concept, and every concept comes down to a central problem. Get the problem right before building the outline."}, {"kind": "story", "label": "Short story", "text": "O’Connor: start from a real personality. If the writer first thinks up an action and then picks a character to carry it out, generally no personality appears."}]}], "quiz": [{"q": "Which of these questions is part of the three-question test?", "o": ["Is the goal original?", "Does pursuing it force the character to change or sacrifice something?", "Does the goal appear on the first page?", "Is the goal likable?"], "a": 1, "why": "If the character can win without changing, the goal is weak."}, {"q": "When introducing a new character, it’s best to:", "o": ["Describe their appearance first", "Tell their past in a paragraph", "Have them say something, do something, and let their problem show", "Save them for the second chapter"], "a": 2, "why": "Speech, action and problem reveal a character faster than anything else."}, {"q": "What makes a quirk work?", "o": ["Having several", "Being funny", "Being connected to the character’s past and psychology", "Repeating it in every scene"], "a": 2, "why": "One is enough if it comes from who the character is."}, {"q": "Sanderson’s three sliders are:", "o": ["Wit, warmth, wisdom", "Proactivity, likability, competence", "Want, need, wound", "Flaw, restriction, limitation"], "a": 1, "why": "Flaw, restriction and limitation are another Sanderson tool."}, {"q": "What does Martínez call “conceptual closure”?", "o": ["An ending that ties up every thread", "Saying what a character is like and then showing them act exactly that way", "A character who never changes", "A narrator who explains the theme"], "a": 1, "why": "The action adds nothing to what was already said."}, {"q": "Which of these is on Dall’Oste’s list of ten dimensions?", "o": ["Likability", "Politicity", "Star sign", "Catchphrase"], "a": 1, "why": "Historicity and politicity sit alongside subjectivity, physicality and desire; Fogwill’s Quiquito is the example."}], "exercise": {"title": "Epitaphs", "text": "Read some poems from Edgar Lee Masters’s <em>Spoon River Anthology<\/em>, where the dead in a small-town cemetery tell their lives. Write, in prose or verse and in the first person, a character’s life in the form of an epitaph. Use few traits, but decisive ones, and include a contradiction."}}, {"n": 3, "name": "Conflict and the scene", "kicker": "Goal + obstacle, one time, one place", "intro": "A goal plus an obstacle produces conflict. A conflict in one time and place, with something that changes toward the end, is a scene. Most practical advice lives here.", "sources": "Paul Chitlik, *Write Better Conflict* · Ellen Brock, *How to Fix a Bad Scene* · Shaelin Bishop, *How to Write a Scene* and *7 Short Story Tips* · Andy Guerdat, *The Go Draft* · Dwight Swain, *Techniques of the Selling Writer* · Franco Dall’Oste, *Cajón de herramientas* (class 3) · Ernest Hemingway, “Hills Like White Elephants” · Guillermo Martínez, *Eleven Theses* · Chuck Palahniuk, *Consider This* · Patricia Highsmith, *Plotting and Writing Suspense Fiction*", "sections": [{"h": "What conflict is", "bullets": ["<strong>Conflict is a goal blocked by a force<\/strong>, not simply something bad happening (Ellen Brock). The obstacle can be a person, nature, an object or a relationship; if there is none, you have to invent one (Chitlik).", "<strong>Escalate.<\/strong> Obstacles have to get harder; save the biggest for the end, or the rest of the story runs downhill.", "<strong>The coincidence rule<\/strong> (Chitlik): if a coincidence makes things easier for the character, cut it; if it makes things harder, keep it.", "<strong>Corner your character<\/strong> and only then look for the way out."]}, {"h": "What a scene is", "bullets": ["<strong>Scene and summary.<\/strong> A scene dramatizes in real time; summary compresses time and pulls back.", "<strong>A scene is more than a beat and less than a chapter:<\/strong> a single event, in one time and place, where the characters negotiate something that matters, and something changes (Shaelin Bishop).", "<strong>Its six materials:<\/strong> dialogue, action and description (showing); narration of inner life, exposition and backstory (telling). There’s no right proportion; it depends on what the scene is for.", "<strong>Choreography and bodies.<\/strong> The reader has to know where everyone is, and characters need bodies, not float like talking heads."]}, {"h": "Building and testing a scene", "bullets": ["<strong>The “what” before the “how”<\/strong> (Andy Guerdat). Name the single unit of emotional information the scene delivers, then find the most vivid and least literal way to deliver it.", "<strong>Come in late, leave early.<\/strong> Skip arrivals and greetings; leave as soon as the change has happened.", "<strong>Goal, obstacle, turn.<\/strong> The character enters in one emotional state and leaves in another. Brock calls it the emotional delta: in confident, out desperate.", "<strong>The chain test<\/strong> (Brock). If you can remove the scene and the plot chain still holds, it doesn’t move the story forward. Then it must at least reveal something about the character (Chitlik); if not, cut it or move its information to another scene.", "<strong>Scene and sequel<\/strong> (Dwight Swain). Scene: goal, conflict, disaster. Sequel: reaction, dilemma, decision, which sets the next goal.", "<strong>“Yes, but” / “No, and furthermore.”<\/strong> Within a scene, each attempt succeeds at a cost or fails and makes things worse. A flat yes or no deflates it.", "<strong>Information “under the guise of naturalness and necessity”<\/strong> (Martínez, eighth thesis). What we can’t assume the reader knows, or what they need to keep in mind for later, must be absorbed into the flow of the story, not delivered like a lecture.", "<strong>“Thicken” the plot<\/strong> (Highsmith) with complications for the hero, or for his enemies, that arrive as unexpected events.", "<strong>Exposition as a weapon.<\/strong> Never let characters recite facts; put the information into a confrontation where someone uses it."]}, {"h": "Dialogue", "bullets": ["<strong>Three functions<\/strong> (Franco Dall’Oste, <em>Cajón de herramientas<\/em>, class 3): setting rhythm (each character has their own rhythm of speech), describing (social, geographic and cultural origin shows in how people talk) and moving the narrative forward.", "<strong>What goes unsaid moves the story.<\/strong> In Hemingway’s “Hills Like White Elephants”: “It’s really an awfully simple operation, Jig,” the man said. “It’s not really an operation at all.” The operation is never named.", "<strong>Dialogue for tension, narration for context<\/strong> (Dall’Oste). Dialogue is for confrontations, revelations and dynamics between characters; narration, for settings, context and summary.", "<strong>Avoid “tennis match” dialogue<\/strong> (Palahniuk): lines that go back and forth while nothing else happens in the scene.", "<strong>Common mistakes<\/strong> (Dall’Oste): artificial or forced dialogue, too many adverbs in the tags, lines that add nothing to plot or character, and every character sounding the same. Listen to real conversations and read your dialogue aloud."]}], "lamps": [{"title": "Does every scene need conflict?", "verdict": "In a short story, a scene can stand still in the plot, but it has to go deeper or advance the secret logic. If it does neither, the chain test still applies.", "sides": [{"kind": "screen", "label": "Screenwriting", "text": "Chitlik: if a scene has no conflict, it isn’t a scene; if it neither advances the story nor reveals character, cut it. Guerdat adds that every scene has to advance the story’s spine."}, {"kind": "story", "label": "Short story", "text": "Shaelin Bishop: short fiction moves downward, into the character’s interior, more than forward through the plot; each scene can dig one more layer instead of advancing toward a goal."}]}, {"title": "Can dialogue carry the plot?", "verdict": "They don’t contradict each other. Hemingway’s couple never reports a fact: the tension of what goes unsaid is the fact. What Palahniuk forbids is dialogue that announces something that should have been shown.", "sides": [{"kind": "story", "label": "Story: Dall’Oste", "text": "In <em>Cajón de herramientas<\/em>, moving the narrative forward is one of dialogue’s three functions, with “Hills Like White Elephants” as the model."}, {"kind": "novel", "label": "Prose: Palahniuk", "text": "“Don’t use dialogue to advance your plot.” A lieutenant who runs in to announce that Martians are destroying New York cheats the reader: “Any plot point worth including in your story is worth depicting in a scene.”"}]}, {"title": "Dialogue: last resort or main engine?", "verdict": "The rule changes because the alternative changes. On screen, the alternative is an image; on the page, it is often reflection.", "sides": [{"kind": "screen", "label": "Screenwriting", "text": "Guerdat: use dialogue only when image, objects, subtext and body language aren’t enough."}, {"kind": "story", "label": "Prose (novel and story)", "text": "Shaelin Bishop, on prose: use dialogue, not reflection, to move the story. On the page, the alternative to dialogue is usually a character thinking, which is slower. Dall’Oste agrees: dialogue for tension and revelations, narration for context."}]}], "quiz": [{"q": "According to Brock, “something bad happens” isn’t conflict unless:", "o": ["It happens to the protagonist", "There is a goal and a force blocking it", "It happens in dialogue", "It is surprising"], "a": 1, "why": "Conflict needs a goal and an opposing force against it."}, {"q": "Chitlik’s rule says to keep a coincidence when:", "o": ["It saves time", "It makes things harder for the character", "It is foreshadowed", "It happens early"], "a": 1, "why": "Coincidences that help the character feel like cheating; those that hurt add conflict."}, {"q": "In Swain’s model, the sequel is made of:", "o": ["Goal, conflict, disaster", "Reaction, dilemma, decision", "Setup, response, attack", "Promise, progress, payoff"], "a": 1, "why": "The sequel processes the disaster and ends in a decision that opens the next scene."}, {"q": "“Come in late, leave early” means:", "o": ["Always start in medias res", "Cut arrivals and wrap-ups: start just before the change and leave just after", "Introduce characters late", "End every chapter on a cliffhanger"], "a": 1, "why": "The scene exists for a single emotional change; the rest is padding."}, {"q": "In “Hills Like White Elephants,” the dialogue moves the story forward because:", "o": ["It explains the couple’s past", "It circles an operation that is never named", "It describes the landscape in detail", "It gives each character a regional accent"], "a": 1, "why": "The reader understands what the characters refuse to say."}], "exercise": {"title": "Game", "text": "Build a story from a game situation: a game of chess, cards, dice, snakes and ladders. The game gives you a goal and an obstacle for free. Write a single scene, come in late and leave early, and make every move a “yes, but” or a “no, and furthermore.”"}}, {"n": 4, "name": "Who tells it, and when", "kicker": "Narrator, time and world", "intro": "Before thinking about inner arcs and endings, you have to decide who tells the story, in what order and inside what world. Those choices set the pace, the register and how close the reader gets.", "sources": "Franco Dall’Oste, *Cajón de herramientas* (classes 1 and 2) · Ernesto Sabato, *The Tunnel* · Carlos Fuentes, *Aura* · Liliana Heker, “The Stolen Party” (“La fiesta ajena”) · Lorrie Moore, “How to Become a Writer” · Chuck Palahniuk, *Consider This* · Pablo De Santis, *Contar un secreto* · Samanta Schweblin, *Fever Dream* · Dada Groover", "sections": [{"h": "The narrator", "bullets": ["<strong>The author is not the narrator<\/strong> (Franco Dall’Oste, <em>Cajón de herramientas<\/em>, class 1). Borges was born in Buenos Aires in 1899; the voice of his stories is a construction, even when it bears his name. The narrator is one more tool.", "<strong>First person<\/strong> gives intimacy and subjectivity: “It should be enough to say that I am Juan Pablo Castel, the painter who killed María Iribarne…” (Sabato, <em>The Tunnel<\/em>).", "<strong>Second person<\/strong> gives immediacy and puts the reader inside the action: “You walk, disgusted this time, toward that chest the rats swarm around…” (Fuentes, <em>Aura<\/em>). Lorrie Moore’s “How to Become a Writer” is a whole life told as instructions to a “you”: “First, try to be something, anything, else.”", "<strong>Third person<\/strong> ranges from omniscience to limited perspective.", "<strong>Free indirect style<\/strong> is the most used today: third person, but from a character’s point of view. “As soon as she arrived she went to the kitchen to see if the monkey was there. It was, and that reassured her: she wouldn’t have liked at all having to admit her mother was right” (Heker, “The Stolen Party”). It lets you stay close to the character without being limited to their vocabulary.", "<strong>Big voice and little voice<\/strong> (Palahniuk). “The camera is the little voice. The voiceover is the big voice.” The little voice narrates the action in real time; the big one muses and conveys meaning. Moving from one to the other is a decision, not an accident.", "<strong>The choice of narrator sets<\/strong> the pace of the story, the formality of the language, the reader’s perception and the tone (Dall’Oste)."]}, {"h": "Order and time", "bullets": ["<strong>Fabula and plot<\/strong> (De Santis). “In simple tales the order of the events matches the order of the story. And yet it almost never does.” Deciding that order is one of the first decisions.", "<strong>The classical form<\/strong> comes from Aristotle: setup, complication and resolution. Most alternatives are built against it.", "<strong>Alternatives<\/strong> (Dall’Oste): in medias res, non-linear, fragmented, framed or circular structure. Piglia’s <em>The Absent City<\/em> combines several.", "<strong>Tools of time:<\/strong> analepsis (flashback); prolepsis (subtle flashes forward, which Samanta Schweblin uses in <em>Fever Dream<\/em> to build tension); subjective time that stretches and contracts (Alan Pauls, <em>The Past<\/em>); cyclical time.", "<strong>With several timelines, the dramatic question changes<\/strong> (Dall’Oste). It may go unanswered at the end and instead repeat and transform across the different timelines.", "<strong>Broken time can mean something:<\/strong> questioning official historical narratives or exploring collective memory, as much Latin American fiction does."]}, {"h": "Building a world", "bullets": ["<strong>Every setting is built<\/strong> (Franco Dall’Oste, <em>Cajón de herramientas<\/em>, class 2), even a real city: you show a version filtered through your characters and your plot.", "<strong>Internal consistency.<\/strong> Keep your world’s rules consistent; keep a record if you need to.", "<strong>The iceberg again:<\/strong> know much more about the world than you show; that knowledge seeps into the writing.", "<strong>The familiar and the strange.<\/strong> Philip K. Dick keeps San Francisco, but living animals are scarce and have become status symbols; Ursula K. Le Guin gives Gethen a climate and a gender system that shape everything.", "<strong>Show the world through routine:<\/strong> an ordinary day, how people talk, their slang.", "<strong>Traps:<\/strong> information overload, inconsistencies, stereotypes and perfect worlds with no conflict."]}], "lamps": [{"title": "Do events have to be in order?", "verdict": "You can scramble the events, but not the causes. The reader has to be able to reconstruct why each thing happened (level 8).", "sides": [{"kind": "screen", "label": "Screen and novel", "text": "Scene guides and Groover’s question map assume a forward chain: goal, obstacle, consequence, and one big question answered at the end."}, {"kind": "story", "label": "Short story", "text": "Dall’Oste shows fragmented, circular and multi-timeline stories, where the dramatic question repeats instead of resolving."}]}, {"title": "How much world does a story need?", "verdict": "Build as much world as you like in your notes, and bring to the page only the part that touches the conflict.", "sides": [{"kind": "novel", "label": "Novel and genre", "text": "Worldbuilding in the full sense means designing social systems, power structures, history, mythology and the laws of nature or magic, as Le Guin does with a whole planet."}, {"kind": "story", "label": "Short story", "text": "In the short story compression rules: one setting, a short span, the backstory barely hinted (level 7). Economy of detail is also Dall’Oste’s first principle for building worlds."}]}], "quiz": [{"q": "What is free indirect style?", "o": ["A first-person diary", "Third person told from a character’s point of view", "An omniscient narrator who comments on everything", "Dialogue without tags"], "a": 1, "why": "It lets you stay close to the character without being limited to their vocabulary."}, {"q": "According to Dall’Oste, the narrator is:", "o": ["Always the author", "The author when the story is in first person", "A construction within the text, distinct from the author", "The protagonist"], "a": 2, "why": "Except in autobiography, author and narrator are different figures, even when they share a name."}, {"q": "A prolepsis is:", "o": ["A flashback", "A flash forward", "An event that repeats", "A story within a story"], "a": 1, "why": "Schweblin uses small prolepses in <em>Fever Dream<\/em> to build tension."}, {"q": "Which book is cited as an example of second-person narration?", "o": ["<em>The Tunnel<\/em>", "<em>Aura<\/em>", "“The Stolen Party”", "<em>The Past<\/em>"], "a": 1, "why": "“You walk, disgusted this time…”: Fuentes addresses the reader directly."}, {"q": "The best way to show a fictional world is:", "o": ["A long opening description", "A glossary", "The characters’ routines and daily life", "A map"], "a": 2, "why": "Show, don’t tell applies to worlds too: an ordinary day reveals their essence."}], "exercise": {"title": "Monologue", "text": "Ask someone to tell you an anecdote from their life while you record it or take notes. Turn it into a monologue: delete your questions and keep only the interviewee’s voice, “without intrusions, and respecting the other voice as much as possible.” Then tell the same anecdote in third person with free indirect style and compare what each version can do."}}, {"n": 5, "name": "Inner life: want and need", "kicker": "The engine under the plot", "intro": "It is the most repeated idea in the manuals. The want is what the character pursues; the need, what they lack. The want drives the plot; the need, the theme.", "sources": "Screenwriting manuals on want and need · Peter Russell, Film Courage interviews · Brandon Sanderson, writing lectures · Shaelin Bishop, *Emotional Stakes* · Patricia Highsmith, *Plotting and Writing Suspense Fiction* · *How to Structure a Short Story*, by the author of *Make Your Story Matter* · Franco Dall’Oste, *Cajón de herramientas* (class 3) · Nicolás Verni, “La Libertad”", "sections": [{"h": "Want and need", "bullets": ["<strong>The want is external and conscious:<\/strong> a goal the character knows (Rocky wants to win the fight). It makes them active and creates the external conflict.", "<strong>The need is internal and almost always unconscious<\/strong>, or the character rejects it: a flaw, a wound, a mistaken belief about the world (Woody, in <em>Toy Story<\/em>, needs to learn to share).", "<strong>The need usually blocks the want.<\/strong> Woody’s selfishness is exactly what keeps him from being Andy’s favorite toy again.", "<strong>Imbalance has a cost.<\/strong> Want without need gives action that doesn’t move us (<em>Transformers<\/em>). Need without want gives a reactive protagonist and a plot where nothing seems to happen (<em>Manchester by the Sea<\/em>).", "<strong>Public goal, private goal.<\/strong> What the character says they’re doing, and the itch underneath. Their actions are strategies for the private one."]}, {"h": "Wounds and stakes", "bullets": ["<strong>Central wound → compensations<\/strong> (Peter Russell). The wound produces secret habits and defenses. When you get stuck, ask what shameful thing the character does to cope with it.", "<strong>Confession builds sympathy.<\/strong> We don’t identify with perfect people, but with an exposed flaw.", "<strong>Desire against fear.<\/strong> Depth comes from the friction between what the character wants and the fear or mistaken belief holding them back. A choice under pressure reveals who they are.", "<strong>Flaw, restriction, limitation<\/strong> (Sanderson). A flaw is overcome; a restriction is self-imposed; a limitation is worked around.", "<strong>Emotional stakes are the why<\/strong> (Shaelin Bishop). Three setups: <em>reason<\/em> (I need the external goal because it’s tied to an emotional one), <em>risk<\/em> (pursuing it endangers something else), <em>sacrifice<\/em> (the two goals contradict each other).", "<strong>Sympathetic criminals<\/strong> (Highsmith). The criminal hero has to be at least reasonably likable,
