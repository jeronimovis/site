<!doctype html>
<html lang="es">
<head>

<meta name="description" content="Una guía en nueve niveles para escribir ficción breve · A nine-level guide to writing short fiction, in Spanish and English.">
<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

<title>La escalera de la escritura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a fixed "staircase" of levels on the left (each step indented one notch further), a single reading column on the right. */
:root {
  --paper: #fbfbf8;
  --ink: #1b1d22;
  --ink-soft: #555a63;
  --hair: #dcdcd4;
  --accent: #2c4a8f;        /* cobalt ink */
  --accent-wash: #e9eef8;
  --lamp: #b8860b;          /* lamp light */
  --lamp-wash: #fdf7e6;
  --right: #2f7a4a;  --right-wash: #e6f3ea;
  --wrong: #a3322a;  --wrong-wash: #f8e7e5;
  --k-screen: #3b5a85; --k-story: #9a2f2a; --k-novel: #446b3c; --k-both: #5f6168;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Newsreader", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --nav-w: 18rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #15171b; --ink: #e8e7e2; --ink-soft: #a3a7ae; --hair: #2e3138;
  --accent: #93acec; --accent-wash: #1e2638;
  --lamp: #e2b44d; --lamp-wash: #262115;
  --right: #74c48f; --right-wash: #17291e; --wrong: #ec8b81; --wrong-wash: #2f1a18;
  --k-screen: #8fb0de; --k-story: #ec8b81; --k-novel: #9cc58f; --k-both: #a7a9ae;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #15171b; --ink: #e8e7e2; --ink-soft: #a3a7ae; --hair: #2e3138;
  --accent: #93acec; --accent-wash: #1e2638;
  --lamp: #e2b44d; --lamp-wash: #262115;
  --right: #74c48f; --right-wash: #17291e; --wrong: #ec8b81; --wrong-wash: #2f1a18;
  --k-screen: #8fb0de; --k-story: #ec8b81; --k-novel: #9cc58f; --k-both: #a7a9ae;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 1.125rem; line-height: 1.6; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font-family: var(--mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; }

/* ── shell */
.shell { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); min-height: 100vh; }
nav.stairs { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; border-right: 1px solid var(--hair);
  padding-block: 2rem; padding-left: max(1.25rem, env(safe-area-inset-left, 0px)); padding-right: 1.25rem; display: flex; flex-direction: column; gap: 1.5rem; }
.brand { text-decoration: none; color: var(--ink); display: grid; gap: .25rem; }
.brand b { font-family: var(--display); font-weight: 500; font-size: 1.5rem; line-height: 1.1; }
.brand span { color: var(--ink-soft); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: .15rem; }
.steps a { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; align-items: baseline; gap: .5rem;
  padding: .45rem .5rem; border-radius: 4px; text-decoration: none; color: var(--ink); font-size: 1rem; line-height: 1.3;
  margin-left: calc(var(--step) * .55rem); border-left: 2px solid transparent; }
.steps a:hover { background: var(--accent-wash); }
.steps a[aria-current="page"] { background: var(--accent-wash); border-left-color: var(--accent); }
.steps .num { font-family: var(--display); font-size: 1.25rem; color: var(--accent); }
.steps .score { font-family: var(--mono); font-size: .7rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.steps .score.done { color: var(--right); }
.steps .home .num { font-size: 1rem; }
.theme-btn { display: inline-flex; align-items: center; gap: .45rem; border: 1px solid var(--hair); background: transparent; border-radius: 999px; padding: .35rem .8rem; cursor: pointer; font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.theme-btn:hover { border-color: var(--accent); color: var(--accent); }
.theme-btn svg { flex: none; }
.topbar .actions { display: flex; gap: .5rem; flex: none; }
.navfoot { margin-top: auto; color: var(--ink-soft); font-size: .85rem; line-height: 1.4; display: grid; gap: .6rem; justify-items: start; }
.navfoot p { margin: 0; }

.topbar { display: none; }

main { padding-block: 3.5rem 5rem; padding-left: max(2.5rem, env(safe-area-inset-left, 0px)); padding-right: max(2.5rem, env(safe-area-inset-right, 0px)); }
.col { max-width: 42rem; display: grid; gap: 0; }

/* ── level opener */
.eyebrow { color: var(--accent); }
.bignum { font-family: var(--display); font-weight: 400; font-size: clamp(5rem, 14vw, 8.5rem); line-height: .9; color: var(--accent); margin: .5rem 0 0; }
h1 { font-family: var(--display); font-weight: 500; font-size: clamp(2rem, 4.5vw, 2.9rem); line-height: 1.1; margin: .5rem 0 .25rem; text-wrap: balance; letter-spacing: -.01em; }
.kicker { font-style: italic; color: var(--ink-soft); font-size: 1.2rem; margin: 0 0 1.75rem; }
.intro { font-size: 1.3rem; line-height: 1.5; border-top: 2px solid var(--ink); padding-top: 1.25rem; margin: 0 0 1rem; }
h2 { font-family: var(--display); font-weight: 600; font-size: 1.35rem; margin: 2.25rem 0 .75rem; text-wrap: balance; }
ul.points { list-style: none; padding: 0; margin: 0; display: grid; gap: .8rem; }
ul.points li { padding-left: 1.25rem; position: relative; }
ul.points li::before { content: ""; position: absolute; left: 0; top: .7em; width: .45rem; height: .45rem; background: var(--accent); }

/* ── lamps */
.lamp { margin: 2.5rem 0 0; background: var(--lamp-wash); border: 1px solid color-mix(in srgb, var(--lamp) 35%, transparent); border-radius: 6px; padding: 1.5rem 1.5rem 1.25rem; display: grid; gap: .9rem; }
.lamp-head { display: flex; align-items: center; gap: .6rem; color: var(--lamp); }
.lamp-head svg { flex: none; }
.lamp h3 { font-family: var(--display); font-weight: 600; font-size: 1.3rem; margin: -.4rem 0 0; line-height: 1.25; }
.sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1rem; }
.side { display: grid; gap: .3rem; align-content: start; font-size: 1rem; line-height: 1.5; }
.side p { margin: 0; }
.chip { justify-self: start; font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--kc); border: 1px solid var(--kc); border-radius: 999px; padding: .1rem .55rem; }
.k-screen { --kc: var(--k-screen); } .k-story { --kc: var(--k-story); } .k-novel { --kc: var(--k-novel); } .k-both { --kc: var(--k-both); }
.verdict { border-top: 1px solid color-mix(in srgb, var(--lamp) 35%, transparent); padding-top: .8rem; margin: 0; font-size: 1rem; }
.verdict b { color: var(--lamp); font-family: var(--mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; margin-right: .4rem; }

.sources { margin: 2rem 0 0; font-size: .9rem; color: var(--ink-soft); line-height: 1.5; }
.sources .label { margin-right: .5rem; }

/* ── quiz */
.quiz { margin-top: 3rem; border-top: 2px solid var(--ink); padding-top: 1.25rem; display: grid; gap: 1.75rem; }
.quiz-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
.quiz-head h2 { margin: 0; }
.tally { font-family: var(--mono); font-size: .85rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.q { display: grid; gap: .6rem; }
.q-text { font-weight: 600; margin: 0; display: grid; grid-template-columns: 1.75rem minmax(0, 1fr); }
.q-text span:first-child { font-family: var(--mono); font-weight: 500; color: var(--accent); font-size: .9rem; padding-top: .2rem; }
.opts { display: grid; gap: .4rem; padding-left: 1.75rem; }
.opt { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) 1.25rem; align-items: baseline; gap: .5rem; text-align: left;
  border: 1px solid var(--hair); background: transparent; border-radius: 5px; padding: .55rem .75rem; cursor: pointer; font-size: 1.02rem; line-height: 1.4; transition: background .15s, border-color .15s; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-wash); }
.opt:disabled { cursor: default; }
.opt .l { font-family: var(--mono); font-size: .8rem; color: var(--ink-soft); }
.opt .mark { font-family: var(--mono); font-weight: 500; text-align: right; }
.opt.is-right { border-color: var(--right); background: var(--right-wash); }
.opt.is-right .mark { color: var(--right); }
.opt.is-wrong { border-color: var(--wrong); background: var(--wrong-wash); }
.opt.is-wrong .mark { color: var(--wrong); }
.opt.is-dim { opacity: .55; }
.why { margin: .2rem 0 0 1.75rem; font-size: 1rem; padding: .6rem .85rem; border-left: 3px solid var(--fb); background: color-mix(in srgb, var(--fb) 8%, transparent); }
.why b { color: var(--fb); }
.result { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 1rem; padding: 1rem 1.1rem; border: 1px solid var(--hair); border-radius: 6px; }
.result p { margin: 0; }
.btn { border: 1px solid var(--ink); background: transparent; border-radius: 999px; padding: .4rem 1rem; cursor: pointer; font-family: var(--mono); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; }
.btn:hover { background: var(--ink); color: var(--paper); }

/* ── exercise */
.exercise { margin-top: 2.5rem; border: 1.5px solid var(--ink); border-radius: 6px; padding: 1.25rem 1.4rem 1.4rem; display: grid; gap: .5rem; }
.exercise h2 { margin: 0; font-style: italic; font-weight: 500; font-size: 1.5rem; }
.exercise p { margin: 0; }
.ex-head { display: flex; flex-wrap: wrap; gap: .4rem 1rem; align-items: baseline; }
.ex-tag { color: var(--accent); font-weight: 500; }
.ex-src { color: var(--ink-soft); }
.ex-src em { text-transform: none; letter-spacing: 0; font-family: var(--body); font-size: .85rem; }

/* ── pager */
.pager { margin-top: 3.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.pager a { display: grid; gap: .15rem; text-decoration: none; color: var(--ink); border-top: 1px solid var(--hair); padding-top: .8rem; }
.pager a:hover .pn { color: var(--accent); }
.pager .next { text-align: right; grid-column: 2; }
.pager .pn { font-family: var(--display); font-size: 1.2rem; }
.pager .label { color: var(--ink-soft); }

/* ── home */
.home-title { font-family: var(--display); font-weight: 500; font-size: clamp(2.6rem, 7vw, 4.4rem); line-height: 1; letter-spacing: -.02em; margin: .75rem 0 1rem; text-wrap: balance; }
.home-sub { font-style: italic; font-size: 1.3rem; color: var(--ink-soft); margin: 0 0 2rem; }
.prose p { margin: 0 0 1rem; }
.legend { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .25rem; }
.staircase { list-style: none; padding: 0; margin: 1rem 0 0; display: grid; gap: 0; }
.staircase li a { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; gap: .75rem; align-items: baseline; padding: .8rem 0; border-bottom: 1px solid var(--hair); text-decoration: none; color: var(--ink); margin-left: calc(var(--step) * 1.1rem); }
.staircase li:first-child a { border-top: 1px solid var(--hair); }
.staircase .n { font-family: var(--display); font-size: 2rem; line-height: 1; color: var(--accent); }
.staircase .t { font-weight: 600; }
.staircase .t em { display: block; font-weight: 400; color: var(--ink-soft); font-size: .95rem; }
.staircase a:hover .t { color: var(--accent); }
.staircase .score { font-family: var(--mono); font-size: .78rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.staircase .score.done { color: var(--right); }
.totals { margin-top: 1.5rem; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .75rem; color: var(--ink-soft); font-size: 1rem; }
.leftout { margin-top: 3rem; font-size: .9rem; color: var(--ink-soft); font-style: italic; }

/* ── narrow */
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--hair);
    justify-content: space-between; align-items: center; gap: 1rem; padding-block: .65rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar .where { font-family: var(--display); font-size: 1.1rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .where b { color: var(--accent); font-weight: 500; margin-right: .35rem; }
  nav.stairs { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 3.2rem); left: 0; right: 0; height: auto; max-height: calc(100% - 3.2rem - env(safe-area-inset-top, 0px));
    background: var(--paper); border-right: 0; border-bottom: 1px solid var(--hair); padding-block: 1rem 1.25rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-shadow: 0 12px 24px rgba(0,0,0,.12); }
  nav.stairs .brand, nav.stairs .navfoot { display: none; }
  main { padding-block: 2rem 4rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .opts, .why { padding-left: 0; margin-left: 0; }
  .staircase li a { margin-left: calc(var(--step) * .35rem); grid-template-columns: 2.25rem minmax(0, 1fr) auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>
.lang-btn { font-weight: 500; }
.lang-btn .on { color: var(--accent); }
.lang-btn .sep { opacity: .4; }
.sources em i { font-style: normal; }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="where" id="where"></div>
    <div class="actions"><button class="theme-btn lang-btn" data-lang-toggle></button><button class="theme-btn" data-theme-toggle></button><button class="btn" id="menuBtn" aria-expanded="false" aria-controls="stairs"></button></div>
  </header>
  <nav class="stairs" id="stairs">
    <a class="brand" href="#start"><span class="label" id="brandLabel"></span><b id="brandTitle"></b></a>
    <ul class="steps" id="steps"></ul>
    <div class="navfoot"><div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="theme-btn lang-btn" data-lang-toggle></button><button class="theme-btn" data-theme-toggle></button></div><p id="saveNote"></p></div>
  </nav>
  <main id="main"><div class="col" id="view"></div></main>
</div>

<script>
const DATA = { es: {"title": "La escalera de la escritura", "subtitle": "Consejos de oficio para escribir ficción, ordenados desde el primer hábito hasta la lógica secreta del cuento", "howTo": ["Cada nivel supone el anterior: no se puede juzgar una escena sin saber qué quiere un personaje, y no se puede construir una lógica secreta sin saber construir una escena.", "Los consejos vienen de dos tradiciones distintas. Una es <strong>el guion de cine y la novela comercial<\/strong>: objetivos, obstáculos, arcos, recompensas. La otra es <strong>el cuento<\/strong>, en especial la tradición rioplatense de Quiroga, Borges, Cortázar y Heker: compresión, interioridad, las dos lógicas. Muchas veces coinciden. Donde no, vas a encontrar una lámpara.", "La primera tesis de Guillermo Martínez explica por qué existen las lámparas: «Toda afirmación en general sobre la escritura de ficción encontrará algún contraejemplo perfectamente legítimo en particular». Eso no impide trabajar con criterios firmes y flexibles a la vez.", "Cada nivel termina con un cuestionario breve y una consigna de escritura tomada del <em>Abecé de consignas<\/em> de Pablo De Santis. Las respuestas del cuestionario, con una línea de explicación, están en la clave del final."], "lampLegend": "Una lámpara marca un lugar donde las fuentes no están de acuerdo. Dice qué postura está pensada para el guion (y la trama de largo aliento), cuál para el cuento, y cómo elegir.", "leftOut": "", "levels": [{"n": 0, "name": "Hábitos", "kicker": "Antes de cualquier técnica", "intro": "En estos puntos coinciden todas las fuentes, y ninguno es una técnica. Describen cómo trabajan los escritores.", "sources": "Stephen King, *Mientras escribo* · William Zinsser, *On Writing Well* · Strunk y White, *The Elements of Style* · Horacio Quiroga, *Decálogo del perfecto cuentista* · Liliana Heker, entrevista sobre *La trastienda de la escritura* · Edgar Allan Poe, *Filosofía de la composición* · Flannery O’Connor, *El arte del cuento* · Raymond Carver, *Escribir un cuento* · Felisberto Hernández, *Explicación falsa de mis cuentos* · Franco Dall’Oste, *Breve teoría del cuento* (clases 2 y 3) y *Cajón de herramientas* (clase 4) · Guillermo Martínez, *Once tesis (y antítesis) sobre la escritura de ficción* · Pablo De Santis, *Contar un secreto* · Patricia Highsmith, *Suspense* · Shaelin Bishop (ShaelinWrites) · Dada Groover · Brandon Sanderson", "sections": [{"h": "Leer mucho, escribir mucho", "bullets": ["<strong>Stephen King lo llama el «Gran Mandamiento».<\/strong> No hay atajos; Murakami y Zinsser dicen lo mismo. Leer es el entrenamiento; escribir, la práctica.", "<strong>«Cree en un maestro —Poe, Maupassant, Kipling, Chejov— como en Dios mismo»<\/strong> (Quiroga, <em>Decálogo del perfecto cuentista<\/em>, I). Y en el III: «Resiste cuanto puedas a la imitación, pero imita si el influjo es demasiado fuerte. Más que ninguna otra cosa, el desarrollo de la personalidad es una larga paciencia».", "<strong>Chéjov y <em>The Elements of Style<\/em> son las referencias compartidas.<\/strong> Chéjov es el maestro más citado del cuento (el <em>Decálogo<\/em> de Quiroga lo pone primero); el manual de Strunk y White es el que todos citan.", "<strong>«La originalidad se entrena en la lectura»<\/strong> (Martínez, tercera tesis). La originalidad absoluta quizá sea imposible, pero no una «actitud» de originalidad: conocer lo que ya está hecho, o demasiado hecho, en tu línea, y buscar el elemento diferencial de tu texto «contra lo ya escrito».", "<strong>Toda escritura reescribe otras escrituras.<\/strong> Barthes, Bajtín y Kristeva describen cada texto como un mosaico de otros textos. Franco Dall’Oste (<em>Breve teoría del cuento<\/em>, clase 3) cita la versión de Charly García: «La música ya está hecha. Cuando le robas a uno, sos un mediocre, y cuando les robas a todos, sos un genio»."]}, {"h": "Escribir es reescribir", "bullets": ["<strong>«La esencia de la escritura es la reescritura»<\/strong> (Zinsser). Saunders define el proceso como «intuición más iteración»: la voz aparece en las correcciones.", "<strong>Escribir con la puerta cerrada, corregir con la puerta abierta<\/strong> (King). El primer borrador es privado; la corrección es para el lector.", "<strong>Trabajar por capas<\/strong> (Dada Groover). Hacé pasadas separadas para tareas separadas; por ejemplo, una pasada tardía solo para comprobar que cada escena llega emocionalmente.", "<strong>Las tres edades de un texto<\/strong> (De Santis). Imaginar es la infancia: todo vale. Escribir es la adolescencia: el mundo empieza a tener reglas. Corregir es la madurez, «con toda su carga de neurosis». Dejá reposar el texto, leelo en voz alta y recordá que el lector siempre es un recién llegado: al autor «le basta escuchar sus pasos para reconocerlos, porque él ha inventado el sonido de sus pasos».", "<strong>Guardá lo que cortás.<\/strong> Es más fácil cortar cuando nada se pierde del todo. Heker guarda un archivo de fragmentos recortados."]}, {"h": "Ganas y disciplina", "bullets": ["<strong>Las dos hipótesis de Heker:<\/strong> «no escribir sin ganas» y «las ganas de escribir vienen escribiendo». Parecen contradecirse; juntas quieren decir que no se espera la inspiración: se la va a buscar a la página.", "<strong>El bloqueo es información<\/strong> (Shaelin Bishop). Cuando el borrador se resiste, casi siempre hay algo roto en la lógica de la historia. No fuerces las palabras: retrocedé y buscá dónde se torció la lógica.", "<strong>«No escribas bajo el imperio de la emoción. Déjala morir, y evócala luego. Si eres capaz entonces de revivirla tal cual fue, has llegado en arte a la mitad del camino»<\/strong> (Quiroga, IX).", "<strong>El hábito del arte<\/strong> (O’Connor, a partir de Maritain). Escribe la personalidad entera, consciente e inconsciente. «El arte es el hábito del artista»: un control que no es del todo consciente y que se construye durante años, como una manera de mirar el mundo.", "<strong>Juntá gérmenes<\/strong> (Highsmith). Casi cualquier cosa puede contener uno: un señor respetable que se mete una pera en el bolsillo sin pagarla, la lluvia que borra las huellas de una copa. Algunos gérmenes solo crecen cuando se les suma una segunda idea.", "<strong>Un poco todos los días, «sin esperanza y sin desesperación».<\/strong> Carver cita la regla de Isak Dinesen y la hace suya."]}, {"h": "Planificar o descubrir: el debate del cuento", "bullets": ["<strong>Los que planifican.<\/strong> Poe construye el cuento como un reloj: primero el efecto, y «un plan cualquiera que sea digno de este nombre ha de haber sido trazado con vistas al desenlace antes que la pluma ataque el papel». Quiroga: «No empieces a escribir sin saber desde la primera palabra adónde vas» y «Toma a tus personajes de la mano y llévalos firmemente hasta el final». García Márquez compara el cuento con el hormigón: se vacía todo junto y de una vez. La escopeta de Chéjov: nada que no sea necesario.", "<strong>Los que descubren.<\/strong> Para O’Connor escribir es descubrir: «Yo ignoraba que él iba a robar esa pierna de madera hasta diez o doce líneas antes de que sucediera; pero cuando comprendí que tal cosa iba a suceder, descubrí que era inevitable». Para ella «la forma es orgánica, crece desde el material». Felisberto Hernández piensa que «en un rincón de mí nacerá una planta» y la ayuda a ser lo que está destinada a ser. Carver arranca de una frase («Él pasaba la aspiradora cuando sonó el teléfono») y avanza una línea a la vez, como en un poema.", "<strong>Lo que comparten<\/strong> (Franco Dall’Oste, <em>Breve teoría del cuento<\/em>, clase 2): el control no es total, pero tampoco inexistente. Escribir es reconocer y nutrir una idea o tensión central, y el sentido está tramado en la historia, no se le agrega después."]}, {"h": "Tres criterios para juzgar un texto", "bullets": ["<strong>Originalidad, resolución, escritura<\/strong> (Martínez, segunda tesis). «Ninguno de los tres puede desatenderse: si el texto falla en uno cualquiera de ellos, falla enteramente». Los tres se pueden discutir, ejercitar y aprender.", "<strong>La resolución es la «cajita de herramientas»:<\/strong> el punto de vista, el registro, la detección de lugares comunes, la dosificación de la información, los diálogos, la entrada de los personajes. Bien aprendida, se vuelve invisible y deja lugar a la voz propia.", "<strong>«La escritura debe ser ante todo lucha contra el lugar común»<\/strong> (quinta tesis): contra las expresiones cristalizadas y los clichés de «lo literario», y a favor de «un lenguaje dentro del lenguaje», con apropiaciones y rechazos de palabras propios, aun en el habla de la calle."]}, {"h": "Herramientas, incluida la IA", "bullets": ["<strong>«La IA es una herramienta, no un reemplazo del escritor»<\/strong> (Franco Dall’Oste, <em>Cajón de herramientas<\/em>, clase 4). Produce patrones estadísticos sin comprensión real; tu experiencia y tu voz son lo que no puede poner.", "<strong>Cuatro maneras de usarla<\/strong> (Elizabeth Ann West, citada por Dall’Oste): los «jardineros» la usan para la lluvia de ideas; los «tejedores» combinan su escritura con la generada; los «panaderos» refinan varias versiones; los «arquitectos» estructuran historias con instrucciones precisas.", "<strong>Reglas de uso:<\/strong> empezar con experimentos chicos, ser específico, editar siempre lo que produce, mantener la voz propia, ser transparente y poner límites claros. Un pedido que solo diagnostique, sin reescribir, deja la escritura en tus manos."]}], "lamps": [{"title": "¿Planificar primero o descubrir sobre la marcha?", "verdict": "No es guion contra cuento: hay grandes cuentistas de los dos lados. Averiguá qué tipo de escritor sos en cada cuento. Si planificás, planificá el efecto y el final. Si descubrís, corregí hasta que cada elemento sirva a lo que encontraste.", "sides": [{"kind": "story", "label": "Cuento: los que planifican", "text": "Poe planifica desde el desenlace y el efecto; Quiroga quiere saber el final antes de la primera línea; García Márquez vacía el cuento de una vez. En la entrevista con Heker aparece la idea de que el cuento está más «armado» desde el principio que la novela."}, {"kind": "story", "label": "Cuento: los que descubren", "text": "O’Connor descubre el sentido mientras escribe; Felisberto deja crecer el cuento como una planta y desconfía de «los extranjeros» que la conciencia le recomienda; Carver sigue una sola frase para ver adónde lleva."}, {"kind": "novel", "label": "Novela: las dos posturas", "text": "Brandon Sanderson planifica por ciclos de trama, empezando por la recompensa. Shaelin Bishop defiende la escritura de descubrimiento: alcanza con una dirección general, y descubrir es una herramienta, no una identidad."}]}], "quiz": [{"q": "¿Qué quiere decir Heker con «las ganas de escribir vienen escribiendo»?", "o": ["Que solo hay que escribir con inspiración", "Que las ganas de escribir las produce el acto de escribir", "Que escribir es una obligación y las ganas no importan", "Que las ideas vienen de la lectura y no de la escritura"], "a": 1, "why": "Sus dos hipótesis funcionan juntas: no escribir sin ganas, pero las ganas aparecen escribiendo."}, {"q": "En la fórmula de King, ¿cuándo tiene que estar abierta la puerta?", "o": ["Al escribir el borrador", "Al leer", "Al corregir", "Nunca"], "a": 2, "why": "El borrador es privado (puerta cerrada); la corrección es para el lector (puerta abierta)."}, {"q": "Según Shaelin Bishop, ¿qué suele estar diciéndote el bloqueo?", "o": ["Que necesitás un descanso", "Que algo está roto en la lógica de la historia", "Que tenés que pasarte a planificar", "Que la idea no es original"], "a": 1, "why": "El bloqueo es una señal del borrador: buscá dónde se torció la lógica en vez de forzar las palabras."}, {"q": "¿Qué autor es el más citado como maestro del cuento?", "o": ["Stephen King", "William Zinsser", "Antón Chéjov", "Brandon Sanderson"], "a": 2, "why": "Saunders, Quiroga, King, Piglia, Zinsser y Rozenmacher lo señalan."}, {"q": "¿Qué aconseja Quiroga sobre la emoción?", "o": ["Escribir mientras se la siente con más fuerza", "Dejarla morir y evocarla luego", "Evitar los temas emotivos", "Describirla con adjetivos"], "a": 1, "why": "<em>Decálogo<\/em>, IX: si podés revivirla tal cual fue, llegaste a la mitad del camino."}, {"q": "Los tres criterios de Martínez para juzgar un texto son:", "o": ["Trama, personaje, tema", "Originalidad, resolución, escritura", "Principio, medio, final", "Voz, tono, estilo"], "a": 1, "why": "Si el texto falla en uno cualquiera de ellos, falla enteramente."}, {"q": "Felisberto Hernández compara el nacimiento de un cuento con:", "o": ["Un reloj que se arma", "Hormigón que se vacía", "Una planta que nace en un rincón de sí mismo", "Una fotografía"], "a": 2, "why": "El reloj es de Poe; el hormigón, de García Márquez; la fotografía, de Cortázar."}], "exercise": {"title": "Diario", "text": "Durante un mes, llevá un diario, no para anotar lo que hacés, sino conversaciones oídas al pasar, una historia que alguien te cuenta, algo que te llamó la atención. Una vez por semana, seguí el consejo de John Berendt que recoge De Santis: «Tomar un incidente y escribirlo como una pequeña viñeta. Darle color, incluidas acotaciones y diálogos, darle forma de historia con un comienzo, un medio y un final». Marcá las entradas que podrían ser un germen, en el sentido de Highsmith."}}, {"n": 1, "name": "La página", "kicker": "La frase y el detalle", "intro": "La unidad mínima del oficio es la frase, y la unidad mínima de sentido es el detalle concreto. Aquí mandan dos reglas: mostrarle la evidencia al lector y cortar lo que no trabaja.", "sources": "Diane Callahan, *How to Show, Not Tell* · K. M. Weiland · Andrew Stanton, *The Clues to a Great Story* · Strunk y White, *The Elements of Style* · Horacio Quiroga, *Decálogo del perfecto cuentista* · Raymond Carver, *Escribir un cuento* · Franco Dall’Oste, *Cajón de herramientas* (clase 2) · Rodolfo Walsh, «Fotos» · Flannery O’Connor, *El arte del cuento* · Chuck Palahniuk, *Plantéate esto* · Pablo De Santis, *Contar un secreto* · Shaelin Bishop, *How to Write a Scene* · Andy Guerdat, *The Go Draft*", "sections": [{"h": "Mostrar y contar", "bullets": ["<strong>Mostrar dramatiza; contar resume<\/strong> (K. M. Weiland). Ninguno de los dos está mal. Todo relato mezcla ambos; un relato hecho solo de escenas sería ilegible de tan largo.", "<strong>Dale al lector 2 + 2, no 4<\/strong> (Andrew Stanton, de Pixar). Al lector le gusta deducir. Si le das la conclusión, le quitás el placer de descubrirla.", "<strong>Desconfiá de los verbos de pensamiento<\/strong> (Palahniuk). En lugar de «supo», «sintió», «se dio cuenta», dale la evidencia que le haría saberlo al lector.", "<strong>Lo concreto le gana a lo abstracto.<\/strong> No escribas que es inteligente: mostrá la llave que fabricó con hilo dental y una espátula.", "<strong>Poné la emoción en el cuerpo y en la acción<\/strong>, y dejá que la voz y el subtexto carguen lo que no se dice.", "<strong>La técnica combinada:<\/strong> contar algo brevemente y probarlo enseguida con una imagen concreta. Frances Hodgson Burnett dice que Mary es antipática y en seguida muestra su cara flaca, la piel amarillenta, el gesto agrio."]}, {"h": "Economía", "bullets": ["<strong>«Omitir las palabras innecesarias»<\/strong> (Strunk y White, regla 17). King la repite; la versión de Zinsser es «simplificar, simplificar».", "<strong>«El secreto de ser aburrido es decirlo todo».<\/strong> Unos se la atribuyen a Chéjov y otros a Oscar Wilde; todos coinciden en que la ficción concentra la experiencia en vez de registrarla.", "<strong>«No adjetives sin necesidad»<\/strong> (Quiroga, VII). «Inútiles serán cuantas colas de color adhieras a un sustantivo débil. Si hallas el que es preciso, él solo tendrá un color incomparable. Pero hay que hallarlo». Y en el VI: «Desde el río soplaba el viento frío»: para esa circunstancia no hay en lengua humana más palabras que esas.", "<strong>Mezclá tres texturas<\/strong> (Palahniuk): descripción («Un hombre entra en un bar»), instrucción («Entra en un bar») y exclamación («Ay, suspiró»). La mayor parte de la narrativa es solo descripción; mezclar las tres suena a cómo habla la gente.", "<strong>Sin trucos<\/strong> (Carver). «Al primer signo de juego o de truco en una narración, sea trivial o elaborado, cierro el libro». Con un lenguaje claro se puede dotar a los objetos comunes —«una silla, la cortina de una ventana, un tenedor, una piedra, un pendiente de mujer»— «con los atributos de lo inmenso»."]}, {"h": "Descripción", "bullets": ["<strong>«La descripción en la narrativa no es un mero adorno»<\/strong> (Franco Dall’Oste, <em>Cajón de herramientas<\/em>, clase 2). Construye una experiencia sensorial, una atmósfera y la subjetividad del narrador.", "<strong>Describí con verbos, no con adjetivos.<\/strong> En «Fotos», Walsh nunca dice que Mauricio Irigorri es rebelde: «El niño Mauricio Irigorri le tocaba el culo a la maestra, eludía el cachetazo y en el recreo cobraba las apuestas».", "<strong>Buscá el detalle significativo:<\/strong> un objeto, un gesto o una acción que condense una persona, una escena o un conflicto.", "<strong>Siempre hay alguien mirando.<\/strong> Lo que se describe, y cómo, habla tanto de quien observa como de lo observado: qué sabe, cómo se siente, qué le llamaría la atención y qué pasaría por alto.", "<strong>El tiempo verbal también describe<\/strong> (Dall’Oste). El imperfecto («le tocaba») describe una costumbre; el pretérito perfecto simple («le tocó») narra un hecho puntual.", "<strong>La rutina y el instante<\/strong> (De Santis). La ficción tiene dos modos básicos de expresar el tiempo: lo que ocurre una y otra vez, y lo único. «Un músico tocó el violín en la orquesta de Filadelfia durante veinte años, sin que el arco rozara nunca las cuerdas. Un día su arco tocó la cuerda, emitió una nota y lo despidieron».", "<strong>Usá los cinco sentidos<\/strong>, pero elegí. Variá el ritmo —descripciones cortas para la acción, más largas para la contemplación— y evitá los moldes «El X era Y» o «Había un X en Y».", "<strong>«La ficción opera a través de los sentidos»<\/strong> (O’Connor). Henry James llamaba «especificación endeble» al detalle vago; Ford Madox Ford enseñaba que no se puede meter un vendedor de diarios en una historia si no se lo describe lo suficiente como para que el lector lo vea. Aun así, «cada detalle debe ser controlado a la luz de un objetivo primordial».", "<strong>Que lo concreto «trabaje doble turno»<\/strong> (O’Connor). En «Buena gente del campo», la pierna de madera es ante todo una pierna de madera; a lo largo del cuento acumula significado hasta que, cuando el vendedor de Biblias la roba, se lleva parte de la personalidad de la chica. Un detalle se vuelve símbolo por el trabajo que hace, no porque el autor lo etiquete.", "<strong>Acertá con las cosas pequeñas<\/strong> (Palahniuk). En los vitrales de las catedrales, los milagros iban en las ventanas más altas y el trabajo más meticuloso en lo que se veía primero: si el espectador creía las sandalias y los pliegues de la ropa, creía el maná. Descomponé un gesto crucial tan bien que el lector lo imite sin darse cuenta.", "<strong>El habla local trae consigo una sociedad<\/strong> (O’Connor). Cuando un personaje dice que tiene «una mula más vieja que Birmingham», en esa sola frase hay una sociedad y su historia; los personajes que hablan como en un estudio de televisión no tienen ninguna detrás."]}], "lamps": [{"title": "¿Está permitido contar?", "verdict": "En prosa, contá lo que el lector necesita atravesar rápido y mostrá lo que querés que sienta.", "sides": [{"kind": "screen", "label": "Guion", "text": "Andy Guerdat (<em>The Go Draft<\/em>) deja el diálogo como último recurso: primero la acción, los objetos, el subtexto y el lenguaje corporal, porque la cámara solo puede mostrar. En un guion, «mostrar, no contar» es casi absoluto."}, {"kind": "story", "label": "Prosa y cuento", "text": "En la página, contar es una herramienta. Shaelin Bishop señala que la ficción literaria para adultos puede ser sobre todo resumen narrativo, y que la exposición y el pasado, escritos con propósito y detalle, son vitales. La técnica combinada cuenta y muestra en el mismo movimiento."}]}], "quiz": [{"q": "¿Qué le pide al escritor la regla «2 + 2» de Stanton?", "o": ["Usar dos detalles por frase", "Dar las partes y dejar que el lector llegue a la conclusión", "Repetir dos veces cada idea importante", "Equilibrar escenas y resúmenes"], "a": 1, "why": "Al lector le gusta deducir; el sentido implícito lo atrapa, explicar de más lo aleja."}, {"q": "¿Cuál de estos es un «verbo de pensamiento» del que conviene desconfiar?", "o": ["Corrió", "Se dio cuenta", "Susurró", "Se rompió"], "a": 1, "why": "Verbos como «se dio cuenta», «supo» o «sintió» informan una conclusión en vez de mostrar la evidencia."}, {"q": "La técnica combinada consiste en:", "o": ["Alternar escenas y resúmenes", "Contar un rasgo y probarlo enseguida con un detalle concreto", "Mezclar primera y tercera persona", "Combinar diálogo y acotaciones"], "a": 1, "why": "Burnett dice que Mary es antipática y enseguida muestra su cara y su gesto."}, {"q": "¿En qué medio «mostrar, no contar» está más cerca de ser una regla absoluta?", "o": ["El cuento literario", "Las memorias", "El guion", "La novela literaria"], "a": 2, "why": "La cámara solo puede mostrar; la prosa puede contar cuando contar sirve a la historia."}, {"q": "En «Buena gente del campo», de O’Connor, la pierna de madera:", "o": ["Es solo un símbolo", "Es una pierna real que acumula significado hasta que su robo revela la aflicción más profunda de la chica", "No tiene importancia en el cuento", "Se explica en el primer párrafo"], "a": 1, "why": "Funciona en el nivel literal y en profundidad: lo concreto trabajando doble turno."}, {"q": "¿Qué enseñan los vitrales de Palahniuk?", "o": ["Usar un lenguaje colorido", "Si el lector cree los detalles pequeños que tiene a su altura, va a creer el milagro", "Describir desde arriba", "Poner el clímax al principio de la página"], "a": 1, "why": "La autoridad viene de acertar con las cosas pequeñas; Fincher dijo lo mismo sobre el giro final de <em>El club de la lucha<\/em>."}, {"q": "¿Cómo muestra Walsh el carácter de Mauricio Irigorri en «Fotos»?", "o": ["Con una lista de adjetivos", "Con sus acciones habituales", "Con su monólogo interior", "Con la opinión de otros personajes"], "a": 1, "why": "Toca, elude, cobra: los verbos hacen el trabajo que harían los adjetivos."}], "exercise": {"title": "Rutina e instante", "text": "Escribí una experiencia verdadera, vivida o escuchada, donde se muestre un suceso que altera en un instante una rutina. Contá la rutina en imperfecto y el instante en pretérito. Describí con verbos, no con adjetivos, y elegí un detalle significativo."}}, {"n": 2, "name": "Un personaje que quiere algo", "kicker": "Objetivo, motivación, singularidad", "intro": "Una historia empieza cuando alguien quiere algo. Este nivel trata de volver visible ese deseo y de que quien desea sea alguien en particular, no un tipo genérico.", "sources": "Franco Dall’Oste, *Cajón de herramientas* (clase 3) · Flannery O’Connor, *El arte del cuento* · Guillermo Martínez, *Once tesis (y antítesis) sobre la escritura de ficción* · Patricia Highsmith, *Suspense* · Brandon Sanderson, clases de escritura · Paul Chitlik, *Write Better Conflict* · Erik Bork, *The Idea* · Claire Keegan, *Cosas pequeñas como esas* · Rodolfo Fogwill, *Los pichiciegos*", "sections": [{"h": "El objetivo", "bullets": ["<strong>Que el objetivo sea visible y se pueda seguir.<\/strong> El lector tiene que poder saber si el personaje se acerca o se aleja de él.", "<strong>La prueba de las tres preguntas:<\/strong> ¿el objetivo es visible? ¿Lo que está en juego es inmediato y personal? ¿Perseguirlo obliga al personaje a cambiar o a sacrificar algo? Si puede ganar sin cambiar, el objetivo es débil.", "<strong>Los objetivos activan a los personajes pasivos<\/strong>, y las historias calladas, centradas en el personaje, también los necesitan.", "<strong>La motivación explica el objetivo.<\/strong> La pirámide de Maslow sirve de menú: supervivencia, seguridad, pertenencia (la más común), estima, autorrealización."]}, {"h": "La persona en particular", "bullets": ["<strong>Empezá por una creencia central:<\/strong> la regla tácita con la que vive el personaje. De ella salen su pasado, sus acciones y su personalidad.", "<strong>Presentá a cada personaje de tres maneras:<\/strong> que diga algo, que haga algo y que se vea su problema. El color de pelo y de ojos puede esperar.", "<strong>Las contradicciones vuelven real a la gente.<\/strong> Crean un pequeño misterio y alejan al personaje del estereotipo.", "<strong>Alcanza con una manía<\/strong>, si está ligada a su pasado y a su psicología. Un hábito raro funciona mejor con una razón inesperada detrás.", "<strong>El personaje de los tres tiempos:<\/strong> perseguido por el pasado (poca información, mucha angustia), en lucha en el presente (un problema externo y uno interno) y receloso del futuro, como Bill en <em>Cosas pequeñas como esas<\/em>, de Claire Keegan.", "<strong>Las escalas de Sanderson:<\/strong> proactividad, capacidad de identificación y competencia. Si bajás una, necesitás subir las otras; un personaje bajo en las tres es difícil de seguir.", "<strong>Si no escuchás la voz de un personaje<\/strong>, está poco desarrollado (Paul Chitlik). Volvé a quién es."]}, {"h": "Diez dimensiones de un personaje", "bullets": ["<strong>La lista de Franco Dall’Oste<\/strong> (<em>Cajón de herramientas<\/em>, clase 3): subjetividad, contradicciones, carnalidad, biografía, historicidad, politicidad, condiciones materiales, lenguaje, resistencias, necesidades y deseos.", "<strong>La historia y la política son parte de la persona.<\/strong> En el análisis de Dall’Oste, el Quiquito de <em>Los pichiciegos<\/em>, de Fogwill, está hecho de la guerra de Malvinas que le toca vivir, no solo de su psicología.", "<strong>Lo conocido más lo único.<\/strong> Para evitar el estereotipo, combiná rasgos reconocibles con uno que sorprenda; Dall’Oste pone como ejemplo «Catedral», de Carver.", "<strong>Personaje y acción se hacen mutuamente<\/strong> (O’Connor): «los personajes se muestran por medio de la acción, y la acción es controlada por medio de los personajes».", "<strong>«Pocos rasgos, pero decisivos»<\/strong>, y además «ya en movimiento, enlazados con la trama» (Martínez, séptima tesis, a partir de Borges). No los presentes desde afuera antes de que empiece la historia: ponelos en una escena donde se revelen por sus actos, su manera de hablar o de pensar.", "<strong>Evitá la «clausura conceptual»<\/strong> (Martínez): decir primero cómo es el personaje y después mostrarlo actuando exactamente así, de modo que la acción no agrega nada.", "<strong>«Los caracteres existen en función de los hechos, y los hechos en función de los caracteres»<\/strong> (Borges, citado por Martínez). La vieja división entre cuentos de personaje y cuentos de trama no se sostiene en la práctica.", "<strong>Partí de una persona, no de una trama<\/strong> (O’Connor). Muchos cuentos flojos piensan una acción y después eligen a alguien que la ejecute. «Si se parte de una personalidad real, un personaje real, estamos en camino de que algo pase; antes de empezar a escribir, no se necesita saber qué»."]}], "lamps": [{"title": "¿El protagonista tiene que querer algo visible?", "verdict": "Un cuento puede tener un protagonista casi sin capacidad de acción, pero entonces otra cosa tiene que sostener al lector: la tensión, una situación o una lógica secreta que se cierra.", "sides": [{"kind": "screen", "label": "Guion", "text": "Las guías de guion y Paul Chitlik exigen un objetivo externo y visible, establecido antes del final del primer acto; Sanderson pone la proactividad en primer lugar. Sin ese objetivo, parece que no pasa nada."}, {"kind": "story", "label": "Cuento", "text": "Buena parte del cuento latinoamericano renuncia al protagonista proactivo: los personajes de Rulfo o de Ribeyro están atrapados por el entorno, la pobreza o el destino. Su deseo suele ser chico, estar bloqueado desde el principio, o simplemente soportarse."}]}, {"title": "¿Quién manda: vos o tus personajes?", "verdict": "Cuando un personaje se aparta del plan, frená y mirá, como dice Highsmith, varios días si hace falta. Quedate con el cambio si mejora la historia, no porque el personaje «lo quiso».", "sides": [{"kind": "story", "label": "Cuento: O’Connor, Felisberto", "text": "O’Connor dejó que sus personajes la llevaran hasta el robo de la pierna de madera. Felisberto deja crecer el cuento solo y desconfía de las intenciones que intenta imponerle."}, {"kind": "both", "label": "Novela y cuento: Highsmith, Martínez", "text": "Highsmith: un personaje rebelde puede desviar el argumento hacia algo mejor, pero no siempre es bueno: «Después de todo, uno es el jefe». El <em>Dodecálogo personal<\/em> de Martínez pide no creer en «los clichés románticos de personajes supuestamente desobedientes», y cita a Highsmith: «Sí, mis personajes también se rebelan a veces, pero uno debe recordarles quién es el jefe». Para él, «toda ficción es un artificio»."}]}, {"title": "¿Partir del problema o de la persona?", "verdict": "En un cuento, el problema suele ser lo que esta persona en particular no puede esquivar. Si partís del problema, preguntate si le podría pasar a cualquiera; si la respuesta es sí, el personaje todavía no está trabajando.", "sides": [{"kind": "screen", "label": "Guion y series", "text": "Erik Bork: el 95 % de sus notas sobre guiones apuntan al concepto, y todo concepto se reduce a un problema central. Hay que tener bien el problema antes de armar la escaleta."}, {"kind": "story", "label": "Cuento", "text": "O’Connor: partir de una personalidad real. Si el escritor piensa primero una acción y después elige un personaje que la ejecute, en general no aparece ninguna personalidad."}]}], "quiz": [{"q": "¿Cuál de estas preguntas es parte de la prueba de las tres preguntas?", "o": ["¿El objetivo es original?", "¿Perseguirlo obliga al personaje a cambiar o sacrificar algo?", "¿El objetivo aparece en la primera página?", "¿El objetivo es simpático?"], "a": 1, "why": "Si el personaje puede ganar sin cambiar, el objetivo es débil."}, {"q": "Al presentar un personaje nuevo, conviene:", "o": ["Describir primero su aspecto", "Contar su pasado en un párrafo", "Que diga algo, que haga algo y que se vea su problema", "Guardarlo para el segundo capítulo"], "a": 2, "why": "El habla, la acción y el problema revelan al personaje más rápido que nada."}, {"q": "¿Qué hace que una manía funcione?", "o": ["Tener varias", "Que sea graciosa", "Que esté conectada con el pasado y la psicología del personaje", "Repetirla en todas las escenas"], "a": 2, "why": "Alcanza con una si sale de quién es el personaje."}, {"q": "Las tres escalas de Sanderson son:", "o": ["Ingenio, calidez, sabiduría", "Proactividad, identificación, competencia", "Deseo, necesidad, herida", "Defecto, restricción, limitación"], "a": 1, "why": "Defecto, restricción y limitación son otra herramienta de Sanderson."}, {"q": "¿Qué llama Martínez «clausura conceptual»?", "o": ["Un final que cierra todas las líneas", "Decir cómo es un personaje y después mostrarlo actuando exactamente así", "Un personaje que nunca cambia", "Un narrador que explica el tema"], "a": 1, "why": "La acción no agrega nada a lo que ya se dijo."}, {"q": "¿Cuál de estas está en la lista de diez dimensiones de Dall’Oste?", "o": ["Simpatía", "Politicidad", "Signo del zodíaco", "Muletilla"], "a": 1, "why": "La historicidad y la politicidad están junto a la subjetividad, la carnalidad y el deseo; el Quiquito de Fogwill es el ejemplo."}], "exercise": {"title": "Epitafios", "text": "Leé algunos poemas de la <em>Antología de Spoon River<\/em>, de Edgar Lee Masters, donde los muertos del cementerio de un pueblo cuentan su vida. Escribí, en prosa o en verso y en primera persona, la vida de un personaje en forma de epitafio. Usá pocos rasgos, pero decisivos, e incluí una contradicción."}}, {"n": 3, "name": "El conflicto y la escena", "kicker": "Objetivo + obstáculo, un tiempo, un lugar", "intro": "Un objetivo más un obstáculo produce conflicto. Un conflicto en un tiempo y un lugar, con algo que cambia hacia el final, es una escena. Acá vive la mayor parte de los consejos prácticos.", "sources": "Paul Chitlik, *Write Better Conflict* · Ellen Brock, *How to Fix a Bad Scene* · Shaelin Bishop, *How to Write a Scene* y *7 Short Story Tips* · Andy Guerdat, *The Go Draft* · Dwight Swain, *Techniques of the Selling Writer* · Franco Dall’Oste, *Cajón de herramientas* (clase 3) · Ernest Hemingway, «Colinas como elefantes blancos» · Guillermo Martínez, *Once tesis* · Chuck Palahniuk, *Plantéate esto* · Patricia Highsmith, *Suspense*", "sections": [{"h": "Qué es el conflicto", "bullets": ["<strong>El conflicto es un objetivo bloqueado por una fuerza<\/strong>, no simplemente algo malo que pasa (Ellen Brock). El obstáculo puede ser una persona, la naturaleza, un objeto o una relación; si no hay ninguno, hay que inventarlo (Chitlik).", "<strong>Escalá.<\/strong> Los obstáculos tienen que volverse más difíciles; guardá el mayor para el final, o el resto de la historia va cuesta abajo.", "<strong>La regla de la coincidencia<\/strong> (Chitlik): si una coincidencia le facilita las cosas al personaje, sacala; si se las complica, dejala.", "<strong>Acorralá a tu personaje<\/strong> y recién después buscá la salida."]}, {"h": "Qué es una escena", "bullets": ["<strong>Escena y resumen.<\/strong> La escena dramatiza en tiempo real; el resumen comprime el tiempo y se aleja.", "<strong>Una escena es más que un movimiento y menos que un capítulo:<\/strong> un solo hecho, en un tiempo y un lugar, donde los personajes negocian algo que importa, y algo cambia (Shaelin Bishop).", "<strong>Sus seis materiales:<\/strong> diálogo, acción y descripción (mostrar); narración de la vida interior, exposición y pasado (contar). No hay una proporción correcta; depende de para qué está la escena.", "<strong>Coreografía y cuerpos.<\/strong> El lector tiene que saber dónde está cada uno, y los personajes tienen que tener cuerpo, no flotar como cabezas que hablan."]}, {"h": "Construir y poner a prueba una escena", "bullets": ["<strong>El «qué» antes del «cómo»<\/strong> (Andy Guerdat). Nombrá la única unidad de información emocional que entrega la escena y después buscá la manera más vívida y menos literal de entregarla.", "<strong>Entrá tarde, salí temprano.<\/strong> Saltá las llegadas y los saludos; salí apenas se produjo el cambio.", "<strong>Objetivo, obstáculo, giro.<\/strong> El personaje entra en un estado emocional y sale en otro. Brock lo llama el delta emocional: entra confiado, sale desesperado.", "<strong>La prueba de la cadena<\/strong> (Brock). Si podés sacar la escena y la cadena de la trama sigue firme, no la hace avanzar. Entonces tiene que, al menos, revelar algo del personaje (Chitlik); si no, cortala o mové su información a otra escena.", "<strong>Escena y secuela<\/strong> (Dwight Swain). Escena: objetivo, conflicto, desastre. Secuela: reacción, dilema, decisión, que fija el objetivo siguiente.", "<strong>«Sí, pero» / «No, y además».<\/strong> Dentro de una escena, cada intento sale bien con un costo o sale mal y empeora las cosas. Un sí o un no a secas la aplanan.", "<strong>La información, «bajo el disfraz de la naturalidad y la necesidad»<\/strong> (Martínez, octava tesis). Lo que no podemos suponer que el lector sabe, o lo que tiene que tener presente para algo posterior, debe absorberse en el fluir del relato, no darse como una clase.", "<strong>«Espesá» el argumento<\/strong> (Highsmith) con complicaciones para el héroe, o para sus enemigos, que lleguen como hechos inesperados.", "<strong>La exposición como arma.<\/strong> Nunca dejes que los personajes reciten datos; meté la información en un enfrentamiento donde alguien la use."]}, {"h": "Diálogo", "bullets": ["<strong>Tres funciones<\/strong> (Franco Dall’Oste, <em>Cajón de herramientas<\/em>, clase 3): dar ritmo (cada personaje tiene su propio ritmo de habla), describir (el origen social, geográfico y cultural se nota en cómo habla la gente) y hacer avanzar la narración.", "<strong>Lo que no se dice hace avanzar la historia.<\/strong> En «Colinas como elefantes blancos», de Hemingway: «—Es una operación muy sencilla, Jig —dijo el hombre—. No es ni siquiera una operación propiamente dicha». La operación nunca se nombra.", "<strong>Diálogo para la tensión, narración para el contexto<\/strong> (Dall’Oste). El diálogo sirve para los enfrentamientos, las revelaciones y la dinámica entre personajes; la narración, para los escenarios, el contexto y el resumen.", "<strong>Evitá el diálogo «estilo partido de tenis»<\/strong> (Palahniuk): réplicas que van y vienen sin que pase nada más en la escena.", "<strong>Errores comunes<\/strong> (Dall’Oste): diálogos artificiales o forzados, exceso de adverbios en las acotaciones, réplicas que no aportan a la trama ni al personaje, y todos los personajes hablando igual. Escuchá conversaciones reales y leé tus diálogos en voz alta."]}], "lamps": [{"title": "¿Toda escena necesita conflicto?", "verdict": "En un cuento, una escena puede quedarse quieta en la trama, pero tiene que ir más hondo o hacer avanzar la lógica secreta. Si no hace ninguna de las dos cosas, la prueba de la cadena sigue valiendo.", "sides": [{"kind": "screen", "label": "Guion", "text": "Chitlik: si una escena no tiene conflicto, no es una escena; si no hace avanzar la historia ni revela al personaje, hay que cortarla. Guerdat agrega que cada escena tiene que hacer avanzar la columna vertebral de la historia."}, {"kind": "story", "label": "Cuento", "text": "Shaelin Bishop: la ficción breve se mueve hacia abajo, hacia el interior del personaje, más que hacia adelante por la trama; cada escena puede cavar una capa más en lugar de avanzar hacia un objetivo."}]}, {"title": "¿El diálogo puede llevar la trama?", "verdict": "No se contradicen. La pareja de Hemingway nunca informa un hecho: la tensión de lo que no se dice es el hecho. Lo que Palahniuk prohíbe es el diálogo que anuncia algo que debería haberse mostrado.", "sides": [{"kind": "story", "label": "Cuento: Dall’Oste", "text": "En <em>Cajón de herramientas<\/em>, hacer avanzar la narración es una de las tres funciones del diálogo, con «Colinas como elefantes blancos» como modelo."}, {"kind": "novel", "label": "Prosa: Palahniuk", "text": "«No uses los diálogos para hacer avanzar la trama». Un teniente que entra corriendo a anunciar que los marcianos están destruyendo Nueva York estafa al lector: «Cualquier nudo de trama que valga la pena incluir en tu historia, vale la pena describirlo con una escena»."}]}, {"title": "El diálogo: ¿último recurso o motor principal?", "verdict": "La regla cambia porque cambia la alternativa. En la pantalla, la alternativa es una imagen; en la página, muchas veces es la reflexión.", "sides": [{"kind": "screen", "label": "Guion", "text": "Guerdat: usar el diálogo solo cuando la imagen, los objetos, el subtexto y el lenguaje corporal no alcanzan."}, {"kind": "story", "label": "Prosa (novela y cuento)", "text": "Shaelin Bishop, sobre la prosa: usá el diálogo, no la reflexión, para mover la historia. En la página, la alternativa al diálogo suele ser un personaje pensando, que es más lento. Dall’Oste coincide: diálogo para la tensión y las revelaciones, narración para el contexto."}]}], "quiz": [{"q": "Según Brock, «pasa algo malo» no es conflicto salvo que:", "o": ["Le pase al protagonista", "Haya un objetivo y una fuerza que lo bloquee", "Pase en un diálogo", "Sea sorprendente"], "a": 1, "why": "El conflicto necesita un objetivo y una fuerza antagónica en su contra."}, {"q": "La regla de Chitlik dice que conviene dejar una coincidencia cuando:", "o": ["Ahorra tiempo", "Le complica las cosas al personaje", "Está anticipada", "Pasa temprano"], "a": 1, "why": "Las coincidencias que ayudan al personaje parecen trampa; las que lo perjudican suman conflicto."}, {"q": "En el modelo de Swain, la secuela está hecha de:", "o": ["Objetivo, conflicto, desastre", "Reacción, dilema, decisión", "Planteo, respuesta, ataque", "Promesa, progreso, recompensa"], "a": 1, "why": "La secuela procesa el desastre y termina en una decisión que abre la escena siguiente."}, {"q": "«Entrá tarde, salí temprano» quiere decir:", "o": ["Empezar siempre in medias res", "Cortar llegadas y cierres: empezar justo antes del cambio y salir justo después", "Presentar tarde a los personajes", "Terminar cada capítulo en suspenso"], "a": 1, "why": "La escena existe para un único cambio emocional; lo demás es relleno."}, {"q": "En «Colinas como elefantes blancos», el diálogo hace avanzar la historia porque:", "o": ["Explica el pasado de la pareja", "Gira alrededor de una operación que nunca se nombra", "Describe el paisaje en detalle", "Da a cada personaje un acento regional"], "a": 1, "why": "El lector entiende lo que los personajes se niegan a decir."}], "exercise": {"title": "Juego", "text": "Construí un cuento a partir de una situación de juego: una partida de ajedrez, de cartas, de dados, de la oca. El juego te da gratis un objetivo y un obstáculo. Escribí una sola escena, entrá tarde y salí temprano, y que cada jugada sea un «sí, pero» o un «no, y además»."}}, {"n": 4, "name": "Quién lo cuenta, y cuándo", "kicker": "Narrador, tiempo y mundo", "intro": "Antes de pensar en arcos interiores y finales, hay que decidir quién cuenta la historia, en qué orden y dentro de qué mundo. Esas elecciones fijan el ritmo, el registro y cuánto se acerca el lector.", "sources": "Franco Dall’Oste, *Cajón de herramientas* (clases 1 y 2) · Ernesto Sabato, *El túnel* · Carlos Fuentes, *Aura* · Liliana Heker, «La fiesta ajena» · Lorrie Moore, «Cómo convertirse en escritora» · Chuck Palahniuk, *Plantéate esto* · Pablo De Santis, *Contar un secreto* · Samanta Schweblin, *Distancia de rescate* · Dada Groover", "sections": [{"h": "El narrador", "bullets": ["<strong>El autor no es el narrador<\/strong> (Franco Dall’Oste, <em>Cajón de herramientas<\/em>, clase 1). Borges nació en Buenos Aires en 1899; la voz de sus cuentos es una construcción, aunque lleve su nombre. El narrador es una herramienta más.", "<strong>La primera persona<\/strong> da intimidad y subjetividad: «Bastará decir que soy Juan Pablo Castel, el pintor que mató a María Iribarne…» (Sabato, <em>El túnel<\/em>).", "<strong>La segunda persona<\/strong> da inmediatez y mete al lector en la acción: «Caminas, esta vez con asco, hacia ese arcón alrededor del cual pululan las ratas…» (Fuentes, <em>Aura<\/em>). «Cómo convertirse en escritora», de Lorrie Moore, es una vida entera contada como instrucciones a un «vos»: «Primero intenta ser algo, cualquier otra cosa».", "<strong>La tercera persona<\/strong> va de la omnisciencia a la perspectiva limitada.", "<strong>El estilo indirecto libre<\/strong> es el más usado hoy: tercera persona, pero desde el punto de vista de un personaje. «Nomás llegó, fue a la cocina a ver si estaba el mono. Estaba y eso la tranquilizó: no le hubiera gustado nada tener que darle la razón a su madre» (Heker, «La fiesta ajena»). Permite estar cerca del personaje sin quedar limitado a su vocabulario.", "<strong>Voz grande y voz pequeña<\/strong> (Palahniuk). «La cámara es la voz pequeña. El recurso de la voz en off es la voz grande». La pequeña narra la acción en tiempo real; la grande cavila y transmite el significado. Pasar de una a otra es una decisión, no un accidente.", "<strong>La elección del narrador define<\/strong> el ritmo del relato, la formalidad del lenguaje, la percepción del lector y el tono (Dall’Oste)."]}, {"h": "Orden y tiempo", "bullets": ["<strong>Fábula y trama<\/strong> (De Santis). «En los relatos sencillos el orden de los hechos coincide con el orden de la historia. Y sin embargo casi nunca es así». Decidir ese orden es una de las primeras decisiones.", "<strong>La forma clásica<\/strong> viene de Aristóteles: planteamiento, nudo y desenlace. La mayoría de las alternativas se construyen contra ella.", "<strong>Alternativas<\/strong> (Dall’Oste): in medias res, estructura no lineal, fragmentada, enmarcada o circular. <em>La ciudad ausente<\/em>, de Piglia, combina varias.", "<strong>Herramientas del tiempo:<\/strong> analepsis (flashback); prolepsis (sutiles anticipaciones del futuro, que Samanta Schweblin usa en <em>Distancia de rescate<\/em> para crear tensión); tiempo subjetivo, que se estira y se contrae (Alan Pauls, <em>El pasado<\/em>); tiempo cíclico.", "<strong>Con varias temporalidades, la pregunta dramática cambia<\/strong> (Dall’Oste). Puede no responderse al final y, en cambio, repetirse y transformarse a lo largo de las distintas líneas temporales.", "<strong>El tiempo quebrado puede significar algo:<\/strong> cuestionar las narrativas históricas oficiales o explorar la memoria colectiva, como hace buena parte de la narrativa latinoamericana."]}, {"h": "Construir un mundo", "bullets": ["<strong>Todo escenario se construye<\/strong> (Franco Dall’Oste, <em>Cajón de herramientas<\/em>, clase 2), incluso una ciudad real: mostrás una versión filtrada por tus personajes y tu trama.", "<strong>Coherencia interna.<\/strong> Mantené consistentes las reglas de tu mundo; si hace falta, llevá un registro.", "<strong>Otra vez el iceberg:<\/strong> sabé mucho más del mundo de lo que mostrás; ese conocimiento se filtra en la escritura.", "<strong>Lo familiar y lo extraño.<\/strong> Philip K. Dick conserva San Francisco, pero los animales vivos son escasos y se volvieron símbolo de estatus; Ursula K. Le Guin le da a Gethen un clima y un sistema de género que lo condicionan todo.", "<strong>Mostrá el mundo a través de la rutina:<\/strong> un día normal, cómo habla la gente, su jerga.", "<strong>Trampas:<\/strong> la sobrecarga de información, las inconsistencias, los estereotipos y los mundos perfectos, sin conflicto."]}], "lamps": [{"title": "¿Los hechos tienen que ir en orden?", "verdict": "Podés desordenar los hechos, pero no las causas. El lector tiene que poder reconstruir por qué pasó cada cosa (nivel 8).", "sides": [{"kind": "screen", "label": "Guion y novela", "text": "Las guías de escena y el mapa de preguntas de Groover suponen una cadena hacia adelante: objetivo, obstáculo, consecuencia, y una gran pregunta que se responde al final."}, {"kind": "story", "label": "Cuento", "text": "Dall’Oste muestra relatos fragmentados, circulares y con varias temporalidades, donde la pregunta dramática se repite en lugar de resolverse."}]}, {"title": "¿Cuánto mundo necesita una historia?", "verdict": "Construí todo el mundo que quieras en tus notas, y llevá a la página solo la parte que toca el conflicto.", "sides": [{"kind": "novel", "label": "Novela y géneros", "text": "La construcción de mundos en sentido pleno implica diseñar sistemas sociales, estructuras de poder, historia, mitología y las leyes de la naturaleza o de la magia, como hace Le Guin con un planeta entero."}, {"kind": "story", "label": "Cuento", "text": "En el cuento manda la compresión: un escenario, un lapso breve, la historia apenas sugerida (nivel 7). La economía de detalles es también el primer principio de Dall’Oste para construir mundos."}]}], "quiz": [{"q": "¿Qué es el estilo indirecto libre?", "o": ["Un diario en primera persona", "Una tercera persona contada desde el punto de vista de un personaje", "Un narrador omnisciente que comenta todo", "Diálogo sin acotaciones"], "a": 1, "why": "Permite estar cerca del personaje sin quedar limitado a su vocabulario."}, {"q": "Según Dall’Oste, el narrador es:", "o": ["Siempre el autor", "El autor cuando el relato está en primera persona", "Una construcción dentro del texto, distinta del autor", "El protagonista"], "a": 2, "why": "Salvo en las autobiografías, autor y narrador son figuras distintas, aunque compartan nombre."}, {"q": "Una prolepsis es:", "o": ["Un flashback", "Una anticipación del futuro", "Un hecho que se repite", "Una historia dentro de otra"], "a": 1, "why": "Schweblin usa pequeñas prolepsis en <em>Distancia de rescate<\/em> para crear tensión."}, {"q": "¿Qué libro se cita como ejemplo de narración en segunda persona?", "o": ["<em>El túnel<\/em>", "<em>Aura<\/em>", "«La fiesta ajena»", "<em>El pasado<\/em>"], "a": 1, "why": "«Caminas, esta vez con asco…»: Fuentes le habla al lector de tú."}, {"q": "La mejor manera de mostrar un mundo de ficción es:", "o": ["Una larga descripción inicial", "Un glosario", "Las rutinas y la vida cotidiana de los personajes", "Un mapa"], "a": 2, "why": "Mostrar, no contar, vale también para los mundos: un día normal revela su esencia."}], "exercise": {"title": "Monólogo", "text": "Pedile a alguien que te cuente una anécdota de su vida mientras lo grabás o tomás nota. Convertilo en un monólogo: borrá tus preguntas y dejá solo la voz del entrevistado, «sin intromisiones, y respetando tanto como sea posible la voz ajena». Después contá la misma anécdota en tercera persona con estilo indirecto libre y compará lo que puede hacer cada versión."}}, {"n": 5, "name": "La vida interior: deseo y necesidad", "kicker": "El motor debajo de la trama", "intro": "Es la idea que más se repite en los manuales. El deseo es lo que el personaje persigue; la necesidad, lo que le falta. El deseo mueve la trama; la necesidad, el tema.", "sources": "Manuales de guion sobre deseo y necesidad · Peter Russell, entrevistas en Film Courage · Brandon Sanderson, clases de escritura · Shaelin Bishop, *Emotional Stakes* · Patricia Highsmith, *Suspense* · *How to Structure a Short Story*, de la autora de *Make Your Story Matter* · Franco Dall’Oste, *Cajón de herramientas* (clase 3) · Nicolás Verni, «La Libertad»", "sections": [{"h": "Deseo y necesidad", "bullets": ["<strong>El deseo es externo y consciente:<\/strong> una meta que el personaje conoce (Rocky quiere ganar la pelea). Lo vuelve activo y crea el conflicto externo.", "<strong>La necesidad es interna y casi siempre inconsciente<\/strong>, o el personaje la rechaza: un defecto, una herida, una creencia equivocada sobre el mundo (Woody, en <em>Toy Story<\/em>, necesita aprender a compartir).", "<strong>La necesidad suele bloquear el deseo.<\/strong> El egoísmo de Woody es justo lo que le impide volver a ser el juguete preferido de Andy.", "<strong>El desequilibrio tiene un costo.<\/strong> Deseo sin necesidad da acción que no conmueve (<em>Transformers<\/em>). Necesidad sin deseo da un protagonista reactivo y una trama donde parece que no pasa nada (<em>Manchester junto al mar<\/em>).", "<strong>Objetivo público, objetivo privado.<\/strong> Lo que el personaje dice que está haciendo, y la picazón de abajo. Sus acciones son estrategias para el privado."]}, {"h": "Heridas y lo que está en juego", "bullets": ["<strong>Herida central → compensaciones<\/strong> (Peter Russell). La herida produce hábitos secretos y defensas. Cuando te trabes, preguntate qué cosa vergonzosa hace el personaje para sobrellevarla.", "<strong>La confesión genera simpatía.<\/strong> No nos identificamos con gente perfecta, sino con un defecto expuesto.", "<strong>Deseo contra miedo.<\/strong> La profundidad nace del roce entre lo que el personaje desea y el miedo o la creencia equivocada que lo frena. La elección bajo presión revela quién es.", "<strong>Defecto, restricción, limitación<\/strong> (Sanderson). El defecto se supera; la restricción es autoimpuesta; la limitación se rodea.", "<strong>Lo que está en juego emocionalmente es el porqué<\/strong> (Shaelin Bishop). Tres planteos: <em>razón<\/em> (necesito el objetivo externo porque está atado a uno emocional), <em>riesgo<\/em> (perseguirlo pone en peligro otra cosa), <em>sacrificio<\/em> (los dos objetivos se contradicen).", "<strong>Criminales simpáticos<\/strong> (Highsmith). El héroe criminal tiene que ser al menos razonablemente simpático, o fascinante por su depravación; en <em>Extraños en un tren<\/em>, la maldad de Bruno se compensa con la «bondad» de Guy.", "<strong>La tragedia no es lo que está en juego.<\/strong> Apilar muertes y pérdidas produce melodrama, salvo que la pérdida sea concreta y esté atada a los motivos del personaje."]}], "lamps": [{"title": "¿El personaje tiene que transformarse?", "verdict": "En un cuento algo tiene que moverse, pero puede ser mínimo (un gesto, como en las dos líneas de Verni) o una revelación (para el personaje, o solo para el lector), más que una transformación completa.", "sides": [{"kind": "screen", "label": "Guion", "text": "Los manuales de deseo y necesidad y el héroe de «rito de paso» de Russell describen un arco completo de la A a la Z: el personaje persigue el deseo, descubre la necesidad, cambia, y ese cambio le hace ganar el clímax."}, {"kind": "story", "label": "Cuento", "text": "El cuento se construye de adentro hacia afuera, alrededor de un único momento revelador: una epifanía más que un arco. Shaelin Bishop: el clímax suele ser una decisión pequeña que muestra en quién se convirtió el personaje. En mucha narrativa latinoamericana, el personaje ni siquiera llega a cambiar."}, {"kind": "story", "label": "Cuento: la estructura", "text": "Highsmith: en la novela de suspense «suele producirse un cambio drástico en el héroe»; el relato breve «puede tener sólo una escena y ocurrir en cinco minutos o menos». <em>How to Structure a Short Story<\/em>: una novela sigue una transformación; un cuento sigue una decisión bajo presión. La pregunta no es «¿va a sanar?», sino «¿va a elegir A o B?»."}, {"kind": "story", "label": "Cuento: Dall’Oste", "text": "En <em>Cajón de herramientas<\/em> (clase 3), el cambio del punto A al punto B es crucial, y puede ser mínimo. En «La Libertad», de Nicolás Verni: «Martín se levantó de la mesa y dijo que iba a comprar cigarrillos. Ni bien cerró la puerta de calle sintió que había empezado a correr»."}]}], "quiz": [{"q": "¿Cuál de estas afirmaciones es correcta?", "o": ["El deseo mueve el tema; la necesidad, la trama", "El deseo mueve la trama; la necesidad, el tema", "Los dos mueven la trama", "En la ficción solo importa la necesidad"], "a": 1, "why": "El deseo externo crea la acción; la necesidad interna le da sentido."}, {"q": "Una historia con una necesidad clara pero sin deseo corre el riesgo de:", "o": ["Caer en el melodrama", "Tener un protagonista reactivo y una trama donde no pasa nada", "Tener demasiadas subtramas", "Tener un héroe antipático"], "a": 1, "why": "El ejemplo es <em>Manchester junto al mar<\/em>."}, {"q": "En los tres planteos de Shaelin Bishop, «sacrificio» quiere decir:", "o": ["Que el personaje muere", "Que el objetivo externo y el emocional se contradicen", "Que el personaje arriesga quedar expuesto", "Que el pasado explica el objetivo"], "a": 1, "why": "Lograr un objetivo destruye el otro, como Joel eligiendo entre la humanidad y Ellie."}, {"q": "En «La Libertad», de Verni, ¿qué tamaño tiene el cambio de Martín?", "o": ["Un arco de toda una vida", "Un gesto: empieza a correr apenas cierra la puerta", "Ninguno: sigue igual", "Un cambio revelado en un epílogo"], "a": 1, "why": "Dall’Oste lo usa para mostrar que el paso de A a B cabe en dos oraciones."}, {"q": "¿Por qué apilar tragedias sobre un personaje no crea tensión?", "o": ["Porque a los lectores no les gustan las historias tristes", "Porque la pérdida solo importa si es concreta y está atada a los motivos del personaje", "Porque la tragedia va solo en el clímax", "Porque hace más lento el ritmo"], "a": 1, "why": "La tragedia sin anclaje se lee como melodrama y produce indiferencia."}], "exercise": {"title": "Genio de la lámpara", "text": "Escribí un cuento que tenga por tema los deseos y los métodos para alcanzarlos, en la línea de Aladino, de <em>El diablo en la botella<\/em> de Stevenson o de <em>La piel de zapa<\/em> de Balzac, donde un pedazo de cuero se encoge con cada deseo. El deseo es lo que el personaje quiere; decidí qué necesita y que el deseo le oculta, y cuánto le cuesta."}}, {"n": 6, "name": "Que el lector siga leyendo", "kicker": "Tensión, preguntas, promesas", "intro": "Cuando ya hay personajes en conflicto, la pregunta es por qué alguien seguiría dando vuelta las páginas. La respuesta: darle al lector información suficiente para temer y esperar, abrir preguntas a propósito y cumplir las promesas que hacés.", "sources": "Shaelin Bishop, *Tension, Stakes &amp; Ambiguity* · Dada Groover, *How to Keep Your Readers Reading* · Dwight Swain · Brandon Sanderson, *Promises, Progress, and Payoffs* · Peter Russell · Chuck Palahniuk, *Plantéate esto* · Patricia Highsmith, *Suspense* · Raymond Carver, *Escribir un cuento* · Julio Cortázar, *Algunos aspectos del cuento* · Horacio Quiroga, *Decálogo del perfecto cuentista* · Flannery O’Connor, *El arte del cuento* · Erik Bork, *The Idea*", "sections": [{"h": "Tensión", "bullets": ["<strong>La tensión nace de la información, no de esconderla<\/strong> (Shaelin Bishop). Si el lector no sabe qué pasa o por qué importa, no siente tensión: se confunde.", "<strong>Sus cinco materiales:<\/strong> desenlaces posibles que importan; lo que está en juego (lo tangible y lo emocional juntos); la urgencia y los plazos; una ocasión (una fiesta, una reunión) que fuerce el enfrentamiento; y la inevitabilidad, vías tendidas para que el lector vea venir el choque.", "<strong>Tres escalas:<\/strong> micro (línea a línea: subtexto, silencios, hostilidad), narrativa (el conflicto principal) y temática (ideas en conflicto).", "<strong>Herramientas de página<\/strong> (Russell): relojes que corren, la alternancia de buenas y malas noticias, lo que está en juego subiendo en cada intercambio.", "<strong>«¿Cuál es tu reloj?» y «¿Dónde está tu pistola?»<\/strong> (Palahniuk). El reloj es cualquier cosa que limite la longitud del relato y lo obligue a terminar: un embarazo, los cuatro motores de un avión que se incendian uno tras otro, la cintura de Scarlett O’Hara. La pistola es la amenaza que el lector sabe que espera.", "<strong>Dos ejes<\/strong> (Palahniuk, a partir de Tom Spanbauer). El horizontal es la sucesión de nudos de la trama; el vertical, el aumento de la tensión emocional, física o psicológica. Limitá los elementos —llegás a destino con los mismos «caballos» con los que saliste— para que acumulen tensión.", "<strong>Reciclá los objetos<\/strong> (Palahniuk). Sacá y guardá el mismo objeto durante toda la historia: cada vez que reaparece, vuelve con un significado nuevo y marca una evolución de los personajes, como la pierna de madera de O’Connor.", "<strong>Suspense por negación.<\/strong> Plantear un tema y negarse a explorarlo: «La primera regla del club de la lucha es que no se habla del club de la lucha». Y no declares tus tesis: el lector quiere un descubrimiento gradual.", "<strong>«Toda narración que conste de un principio, una mitad y un final tiene suspense»<\/strong> (Highsmith); la de suspense simplemente tiene más.", "<strong>La amenaza<\/strong> (Carver). La sensación de que algo va a pasar. Él empieza a escribir «cuando siento que una nueva historia me amenaza», y conserva esa amenaza en el texto.", "<strong>Tensión desde las primeras palabras<\/strong> (Cortázar): «Un cuento es malo cuando se lo escribe sin esa tensión que debe manifestarse desde las primeras palabras o las primeras escenas».", "<strong>No protejas a tus personajes.<\/strong>"]}, {"h": "Preguntas y promesas", "bullets": ["<strong>Hacé un mapa de preguntas<\/strong> (Dada Groover). Anotá qué preguntas abre cada página y decidí dónde se responde cada una: algunas en la página siguiente, otras al final. Dejá una pregunta abierta solo a propósito.", "<strong>Mejor reconocible que simpático.<\/strong> El protagonista no tiene que caer bien, pero el lector tiene que reconocer algo humano en él.", "<strong>Promesas, progreso, recompensas<\/strong> (Sanderson). El comienzo promete un tono, un género, una trama y un personaje; el medio tiene que mostrar progreso en cada uno; el final tiene que pagar cada promesa. En <em>La guerra de las galaxias<\/em>, la vuelta de Han, la computadora que Luke apaga y la nave chica que vence a la grande pagan tres promesas distintas.", "<strong>Toda historia es cambio, o amenaza de cambio.<\/strong>"]}], "lamps": [{"title": "¿Claridad o secreto?", "verdict": "No se contradicen. La lógica secreta no es información escondida: sus piezas están en la página todo el tiempo, a la vista, y lo único que cambia al final es su sentido. Eso es exactamente «compartí la información, no el sentido».", "sides": [{"kind": "both", "label": "Para toda forma", "text": "Shaelin Bishop: esconder información crea frustración; la ambigüedad va alrededor del sentido, las decisiones y las emociones, no de los hechos básicos. Su consejo: compartí la información, no el sentido."}, {"kind": "story", "label": "Cuento", "text": "Guillermo Martínez construye el cuento sobre una lógica secreta que recién se revela al final."}]}, {"title": "¿Hay que responder todas las preguntas?", "verdict": "Dejá abierto el sentido si querés, pero respondé las preguntas sobre los hechos.", "sides": [{"kind": "novel", "label": "Novela", "text": "Groover: hay que responder casi todas las preguntas que se abren; dejar una abierta por descuido frustra al lector."}, {"kind": "story", "label": "Cuento", "text": "Muchos cuentos terminan con un sentido abierto: lo que significa el final puede quedar sin resolver aunque esté claro lo que pasó."}]}, {"title": "¿Escribir para el público o para los personajes?", "verdict": "Escribí el borrador para el mundo de los personajes. Usá las herramientas pensadas para el lector (mapa de preguntas, lo que está en juego, tensión) al corregir, para comprobar si ese mundo llega a alguien de afuera.", "sides": [{"kind": "screen", "label": "Guion y mercado", "text": "Erik Bork: nos pagan para que el público sienta lo que vino a sentir; una idea viable tiene que ser entretenida. Groover: el lector tiene que quedar atrapado en las páginas de muestra, o no compra el libro."}, {"kind": "story", "label": "Cuento", "text": "Palahniuk: «te diría que te olvidaras de gustar»; los gustos cambian, y un libro que se queda en la memoria de alguien encuentra su público con el tiempo. Quiroga (X): «No pienses en tus amigos al escribir, ni en la impresión que hará tu historia. Cuenta como si tu relato no tuviera interés más que para el pequeño ambiente de tus personajes». O’Connor: «el único lector acerca del cual uno puede saber algo es uno mismo»."}]}], "quiz": [{"q": "Según Shaelin Bishop, esconderle al lector información básica produce sobre todo:", "o": ["Suspense", "Misterio", "Confusión", "Ironía"], "a": 2, "why": "El lector solo siente tensión cuando entiende qué puede salir mal."}, {"q": "¿Cuál de estos es uno de los cinco materiales de la tensión?", "o": ["Una ocasión que fuerce el enfrentamiento", "Un protagonista simpático", "Un final sorpresa", "La narración en primera persona"], "a": 0, "why": "Los otros son los desenlaces posibles, lo que está en juego, la urgencia y la inevitabilidad."}, {"q": "Para Palahniuk, el «reloj» de una historia es:", "o": ["La hora del día en que transcurre", "Cualquier cosa que limite el relato y lo obligue a terminar", "El ritmo del narrador", "Un flashback"], "a": 1, "why": "Un embarazo, unos motores que fallan, una cintura que crece: el reloj le avisa al lector que la historia va a terminar."}, {"q": "¿Qué quiere decir Carver con la «amenaza» de una historia?", "o": ["Un antagonista violento", "La sensación de que algo va a pasar", "Un final en suspenso", "Un tono oscuro"], "a": 1, "why": "Es la amenaza que siente cuando empieza una historia, y la tensión que conserva en ella."}, {"q": "¿Qué es un mapa de preguntas?", "o": [
